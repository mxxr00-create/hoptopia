<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e7d3a">
<title>Lilypad OS — The Pond</title>
<style>
/* ============================================================
   LILYPAD OS  —  a fan replica of the "Lilypad" toy tablet
   operating system from the Toy Story 5 trailer.
   Single-file web app, tuned for iPad Safari (landscape).
   ============================================================ */

:root{
  --pond-top:#37b6ef;
  --pond-mid:#1f98e0;
  --pond-deep:#1574c2;
  --lily:#57c23a;
  --lily-dark:#3a9526;
  --frog:#74c63f;
  --frog-dark:#3f8a23;
  --frog-belly:#a6e36a;
  --grape:#6a2fb0;
  --grape-lt:#8b46d6;
  --grape-dk:#4c1d86;
  --magenta:#cf3aa6;
  --sun:#ffd23e;
  --coral:#ff6f61;
  --ink:#1a2a3a;
  --white:#ffffff;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Nunito,"Baloo 2",system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;height:100dvh;width:100%;
  position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
  background:#0b0f14;
  background:radial-gradient(120% 120% at 50% 0%,#1b2733 0%,#0b0f14 70%);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}

/* ---------- Stage that holds & scales the device ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

/* The whole green frog tablet. Aspect ~ 4:3. Scales to viewport. */
#device{position:relative;width:100%;height:100%;}

/* The OS fills the whole screen — the iPad's own frog case is the bezel. */
#screen{
  position:absolute; inset:0; width:100%; height:100%;
  border-radius:0;
  overflow:hidden;
  background:#0f5fa0 url('assets/pond-wallpaper.jpg') center center / cover no-repeat;
  box-shadow: inset 0 10px 30px rgba(255,255,255,.10), inset 0 -16px 40px rgba(4,40,80,.22);
  cursor:default;
}
/* faint screen glare */
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 22%);}

/* floating bubbles & lilypads layer (decor behind UI) */
.pond-decor{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,255,255,.05) 60%,transparent);animation:rise linear infinite;}
@keyframes rise{0%{transform:translateY(110%) scale(.6);opacity:0}10%{opacity:.8}100%{transform:translateY(-20%) scale(1);opacity:0}}
.padfloat{position:absolute;width:18%;aspect-ratio:1.25/1;background:
   radial-gradient(60% 60% at 55% 45%,var(--lily) 0%,var(--lily-dark) 100%);
   border-radius:50% 50% 50% 6%;opacity:.5;transform:rotate(-12deg);}

/* ---------- OS chrome ---------- */
#statusbar{position:absolute;top:0;left:0;right:0;height:8%;min-height:42px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;padding:0 3.5%;
  color:#eaf6ff;font-weight:800;}
.navgroup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:1.4vmin;}
.sbtn{width:clamp(26px,5vmin,46px);aspect-ratio:1;border-radius:50%;border:none;
  background:rgba(255,255,255,.16);
  display:grid;place-items:center;color:#eaf6ff;cursor:pointer;
  transition:transform .12s, background .12s;}
.sbtn:active{transform:scale(.9);background:rgba(255,255,255,.3);}
.sbtn svg{width:56%;height:56%;fill:none;stroke:#eaf6ff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
#clock{font-size:clamp(11px,2.4vmin,20px);letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,30,60,.4);}
.battery{width:clamp(26px,5vmin,40px);height:clamp(13px,2.5vmin,20px);border:2px solid #eaf6ff;border-radius:3px;position:relative;}
.battery::after{content:"";position:absolute;right:-4px;top:25%;height:50%;width:3px;background:#eaf6ff;border-radius:0 2px 2px 0;}
.battery i{position:absolute;inset:2px;width:78%;background:#9be86a;border-radius:1px;}

/* view host */
#view{position:absolute;inset:8% 0 0 0;z-index:10;overflow:hidden;}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;padding:3% 4% 5%;
  animation:viewin .32s cubic-bezier(.2,.9,.3,1);}
@keyframes viewin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.view::-webkit-scrollbar{width:0;height:0;}

/* ---------- HOME: carousel over a spinning lilypad + dock ---------- */
#view-home{overflow:hidden;display:flex;flex-direction:column;padding-bottom:1.5%;}
#view-home .home-greet{flex:none;}
#caro{flex:1;display:flex;align-items:center;gap:7vmin;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;padding:0 calc(50% - 15vmin);z-index:2;}
#caro::-webkit-scrollbar{display:none;}
.caro-item{flex:none;width:30vmin;background:none;border:none;scroll-snap-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1.2vmin;color:#fff;font-weight:900;
  font-size:clamp(13px,3vmin,24px);text-shadow:0 2px 4px rgba(0,40,80,.55);}
.cbig{width:100%;aspect-ratio:1;position:relative;transition:transform .16s ease-out;
  filter:drop-shadow(0 14px 16px rgba(0,40,70,.42));}
.cbig .ic-svg{width:100%;height:100%;display:block;}
.cbig .badge{font-size:clamp(11px,2.4vmin,17px);}
#lilystage{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;
  transform:translate(-50%,-34%);pointer-events:none;z-index:1;opacity:.95;}
#lilystage svg{width:100%;height:100%;transform-origin:50% 50%;
  filter:drop-shadow(0 10px 16px rgba(0,40,70,.35));}
#dock{flex:none;display:flex;justify-content:flex-start;gap:1.8vmin;margin:0 auto;max-width:94%;
  padding:1.4vmin 2.2vmin calc(1.4vmin + env(safe-area-inset-bottom)*0.5);
  background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);
  border-radius:3vmin;backdrop-filter:blur(12px);overflow-x:auto;z-index:3;}
#dock::-webkit-scrollbar{display:none;}
.dockic{flex:none;width:clamp(42px,8.5vmin,66px);aspect-ratio:1;border:none;background:none;
  position:relative;cursor:pointer;transition:transform .12s;padding:0;}
.dockic:active{transform:scale(1.2) translateY(-8px);}
.dockic svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,40,70,.35));}
.dockic .badge{top:-10%;right:-4%;font-size:clamp(9px,1.8vmin,13px);}

/* ---------- HOME ---------- */
.home-greet{display:flex;align-items:center;gap:2.5%;color:#fff;margin:.2% 0 2%;
  text-shadow:0 2px 4px rgba(0,40,80,.4);}
.home-greet .av{width:clamp(34px,8vmin,64px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,var(--frog-belly),var(--frog) 70%);
  display:grid;place-items:center;font-size:clamp(20px,5vmin,40px);box-shadow:var(--shadow);}
.home-greet h1{margin:0;font-size:clamp(15px,3.6vmin,30px);font-weight:900;}
.home-greet p{margin:0;font-size:clamp(10px,2.2vmin,18px);opacity:.9;font-weight:700;}

.home-wrap{max-width:min(100%,900px);margin:0 auto;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vmin,20px);align-content:start;justify-items:center;}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:.5em;
  background:none;border:none;cursor:pointer;color:#fff;font-weight:800;
  font-size:clamp(9px,2vmin,16px);text-shadow:0 1px 3px rgba(0,40,80,.55);
  transition:transform .12s;}
.app:active{transform:scale(.9);}
.app .ic{width:min(100%,17vmin);aspect-ratio:1;position:relative;}
.ic-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 5px 10px rgba(0,40,70,.38));}
.crit svg,.av svg,.friend .crit svg{width:90%;height:90%;display:block;}
.app .lily{position:absolute;bottom:-6%;width:84%;height:22%;border-radius:50%;
  background:radial-gradient(50% 60% at 50% 30%,rgba(60,160,60,.5),transparent);z-index:-1;}
/* per-app icon colors */
.ic-pond{background:linear-gradient(160deg,#7ad24a,#3f9826);}
.ic-post{background:linear-gradient(160deg,#ff9a4d,#ef6b2a);}
.ic-doodle{background:linear-gradient(160deg,#ff7aa8,#d63b86);}
.ic-games{background:linear-gradient(160deg,#9b6bff,#6a2fb0);}
.ic-msg{background:linear-gradient(160deg,#4dd2ff,#1f8fd0);}
.ic-cam{background:linear-gradient(160deg,#ffd24d,#f0a91f);}
.ic-tunes{background:linear-gradient(160deg,#ff6f9c,#b03ad6);}
.ic-set{background:linear-gradient(160deg,#8fa6b8,#4f6577);}
.badge{position:absolute;top:-6%;right:8%;min-width:1.6em;height:1.6em;padding:0 .35em;
  background:var(--coral);border-radius:1em;color:#fff;font-size:clamp(8px,1.7vmin,13px);
  display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.3);border:2px solid #fff;}

/* ---------- generic app header ---------- */
.app-head{display:flex;align-items:center;gap:2.5%;margin-bottom:3%;}
.tab{display:inline-flex;align-items:center;gap:.4em;background:var(--magenta);color:#fff;
  font-weight:900;padding:.35em .9em;border-radius:.7em .7em .2em .7em;
  font-size:clamp(12px,3vmin,24px);box-shadow:0 4px 0 rgba(0,0,0,.15);
  text-shadow:0 1px 2px rgba(0,0,0,.25);}
.pill-btn{margin-left:auto;background:#7dd13f;color:#0c3a06;border:none;font-weight:900;
  border-radius:1em;padding:.45em 1em;font-size:clamp(10px,2.2vmin,18px);cursor:pointer;
  box-shadow:0 4px 0 #4f9223;display:inline-flex;align-items:center;gap:.35em;transition:transform .1s,box-shadow .1s;}
.pill-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4f9223;}

/* ---------- Friends / The Pond ---------- */
.panel{background:linear-gradient(180deg,var(--grape-lt),var(--grape));
  border-radius:1.4vmin;padding:3.5% 3.5% 4%;box-shadow:var(--shadow),inset 0 2px 0 rgba(255,255,255,.25);
  margin-bottom:3%;}
.req-row{display:flex;align-items:center;gap:3%;background:rgba(255,255,255,.12);
  border-radius:1vmin;padding:2.4% 3%;margin-top:2.5%;}
.req-row .who{display:flex;align-items:center;gap:2%;font-weight:800;color:#fff;}
.crit{width:clamp(34px,8vmin,62px);aspect-ratio:1;border-radius:30%;display:grid;place-items:center;
  font-size:clamp(20px,5vmin,40px);box-shadow:inset 0 -4px 8px rgba(0,0,0,.2),0 3px 6px rgba(0,0,0,.25);}
.friend-strip{display:flex;gap:3%;justify-content:space-around;margin-top:3%;flex-wrap:wrap;}
.friend{display:flex;flex-direction:column;align-items:center;gap:.4em;color:#fff;font-weight:800;
  font-size:clamp(10px,2.3vmin,18px);}
.friend .name{background:rgba(0,0,0,.18);padding:.15em .7em;border-radius:1em;}
.friend.added .name{background:#7dd13f;color:#0c3a06;}
.speech{display:inline-block;background:#fff;color:var(--ink);font-weight:800;border-radius:1em;
  padding:.4em .9em;font-size:clamp(10px,2.2vmin,18px);box-shadow:0 3px 6px rgba(0,0,0,.2);position:relative;}
.namechip{background:#eef7ff;color:var(--grape-dk);font-weight:900;border-radius:1em;padding:.3em .9em;
  display:inline-block;font-size:clamp(11px,2.6vmin,20px);box-shadow:0 3px 6px rgba(0,0,0,.2);}
.bonnie-row{display:flex;align-items:center;gap:2%;margin-bottom:3%;flex-wrap:wrap;}

/* ---------- Posts (bulletin board) ---------- */
.board{background:
   repeating-linear-gradient(90deg,#b9772f,#b9772f 7%,#a9692a 7%,#a9692a 7.4%),
   linear-gradient(#b9772f,#9c5f26);
  border-radius:1.4vmin;padding:5% 4%;box-shadow:var(--shadow),inset 0 0 0 .6vmin #7d4a1c;
  display:grid;grid-template-columns:repeat(3,1fr);gap:4%;}
.note{position:relative;background:#fffef0;border-radius:.6vmin;padding:8% 6%;color:#3a2a18;
  font-weight:800;text-align:center;min-height:7em;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.4em;font-size:clamp(9px,2vmin,16px);
  box-shadow:0 6px 12px rgba(0,0,0,.3);transition:transform .15s;}
.note:nth-child(odd){transform:rotate(-2.2deg);}
.note:nth-child(even){transform:rotate(1.8deg);}
.note:active{transform:scale(1.04) rotate(0);}
.note .pin{position:absolute;top:-7%;left:50%;transform:translateX(-50%);width:1.4em;height:1.4em;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#c62828);box-shadow:0 2px 4px rgba(0,0,0,.4);}
.note .emoji{font-size:clamp(22px,5.5vmin,46px);}
.note.new::after{content:"NEW!";position:absolute;right:-6%;bottom:-8%;background:var(--coral);color:#fff;
  font-size:clamp(8px,1.7vmin,13px);font-weight:900;padding:.2em .5em;border-radius:.3em;transform:rotate(8deg);
  box-shadow:0 2px 5px rgba(0,0,0,.35);}

/* ---------- Doodle ---------- */
#view-doodle{overflow:hidden;display:flex;flex-direction:column;}
#doodle-wrap{display:flex;flex-direction:column;gap:1.6%;flex:1;min-height:0;}
#doodle-canvas{flex:1;min-height:0;width:100%;background:#fff;border-radius:1.2vmin;box-shadow:var(--shadow);touch-action:none;}
.palette{display:flex;gap:1.4%;align-items:center;flex-wrap:wrap;flex:none;justify-content:center;
  padding-bottom:max(4px,env(safe-area-inset-bottom));}
.swatch{width:clamp(24px,5.4vmin,42px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;cursor:pointer;
  box-shadow:0 3px 6px rgba(0,0,0,.3);transition:transform .1s;}
.swatch:active,.swatch.sel{transform:scale(1.18);outline:3px solid #ffd23e;}

/* ---------- Games menu ---------- */
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4%;}
.game-card{border:none;cursor:pointer;border-radius:1.6vmin;padding:7% 5%;color:#fff;font-weight:900;
  display:flex;flex-direction:column;align-items:center;gap:.4em;font-size:clamp(11px,2.6vmin,22px);
  box-shadow:var(--shadow),inset 0 3px 0 rgba(255,255,255,.3);text-shadow:0 2px 3px rgba(0,0,0,.3);transition:transform .12s;}
.game-card:active{transform:scale(.95);}
.game-card .big{font-size:clamp(30px,8vmin,64px);}
.gc-1{background:linear-gradient(160deg,#ff7e5f,#feb47b);}
.gc-2{background:linear-gradient(160deg,#43cea2,#185a9d);}
.gc-3{background:linear-gradient(160deg,#c471f5,#fa71cd);}
.gc-4{background:linear-gradient(160deg,#f7971e,#ffd200);}

/* Guess Who game */
#guess{display:flex;flex-direction:column;align-items:center;gap:2%;text-align:center;color:#fff;}
#guess .round{font-size:clamp(18px,4.6vmin,40px);font-weight:900;color:var(--sun);letter-spacing:2px;text-shadow:0 3px 0 #b07d00;margin:.2em 0;}
.pixel-box{width:min(48%,30vmin);aspect-ratio:1;border-radius:2vmin;overflow:hidden;box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:13vmin;background:#fff;position:relative;}
.pixel-box .meter{position:absolute;top:6%;left:10%;right:10%;height:8%;background:rgba(255,255,255,.4);border-radius:1em;overflow:hidden;}
.pixel-box .meter i{display:block;height:100%;background:linear-gradient(90deg,#ffd23e,#ff6f61);width:100%;}
.guess-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:3%;width:80%;}
.guess-opts button{border:none;cursor:pointer;background:#fff;color:var(--grape-dk);font-weight:900;
  padding:.7em;border-radius:1em;font-size:clamp(11px,2.6vmin,20px);box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s;}
.guess-opts button:active{transform:translateY(3px);}
.guess-opts button.right{background:#7dd13f;}
.guess-opts button.wrong{background:#ff6f61;color:#fff;}

/* ===== Bubble Pop game ===== */
#pop-area{position:relative;width:100%;height:100%;overflow:hidden;border-radius:1.4vmin;
  background:#1f8ace;box-shadow:inset 0 0 40px rgba(0,0,0,.25);touch-action:none;}
.pop-bg{position:absolute;inset:0;z-index:0;}
.pop-bg svg{width:100%;height:100%;display:block;}
.pop-item{position:absolute;border:none;background:none;padding:0;cursor:pointer;z-index:2;will-change:transform;}
.pop-item svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 5px rgba(0,30,60,.3));pointer-events:none;}
.pop-hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:2.5%;padding:2.4% 3.5%;pointer-events:none;}
.hud-chip{font-weight:900;color:#fff;border-radius:1em;padding:.32em .85em;font-size:clamp(12px,3vmin,22px);
  box-shadow:0 4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3);display:inline-flex;align-items:center;gap:.3em;white-space:nowrap;}
.chip-round{background:linear-gradient(160deg,#9b6bff,#6a2fb0);}
.chip-score{background:linear-gradient(160deg,#ffe066,#f0a51c);color:#5a3a00;font-size:clamp(15px,3.8vmin,30px);}
.chip-time{background:linear-gradient(160deg,#4dd2ff,#1f8fd0);margin-left:auto;}
.score-bump{animation:bump .32s;}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.time-bar{position:absolute;top:0;left:0;height:6px;width:100%;z-index:6;border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,#ff6f61,#ffd23e 45%,#7dd13f);transition:width .25s linear;}
.pop-pop{position:absolute;z-index:7;font-weight:900;pointer-events:none;text-shadow:0 2px 3px rgba(0,0,0,.35);transform:translate(-50%,-50%);}
.pop-overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3%;text-align:center;color:#fff;background:rgba(8,30,55,.5);backdrop-filter:blur(3px);padding:5%;}
.pop-overlay h2{margin:0;font-size:clamp(22px,6vmin,52px);font-weight:900;color:#ffe066;text-shadow:0 3px 0 rgba(0,0,0,.25);}
.pop-overlay p{margin:0;font-weight:800;font-size:clamp(12px,3vmin,22px);max-width:82%;opacity:.95;}
.big-btn{border:none;cursor:pointer;background:linear-gradient(160deg,#7dd13f,#4f9e23);color:#0c3a06;font-weight:900;
  border-radius:1.4em;padding:.6em 1.5em;font-size:clamp(15px,4vmin,30px);box-shadow:0 6px 0 #3a7a18;pointer-events:auto;}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3a7a18;}
.tip-row{display:flex;gap:3%;justify-content:center;flex-wrap:wrap;}
.tip-row b{display:inline-flex;align-items:center;gap:.3em;background:rgba(255,255,255,.16);padding:.3em .7em;border-radius:1em;
  font-size:clamp(11px,2.6vmin,18px);}
.tip-row b svg{width:1.5em;height:1.5em;}

/* ---------- Messages ---------- */
.chat{display:flex;flex-direction:column;gap:2.5%;}
.msg{max-width:78%;padding:.6em 1em;border-radius:1.2em;font-weight:700;font-size:clamp(11px,2.5vmin,19px);
  box-shadow:0 3px 6px rgba(0,0,0,.18);line-height:1.25;}
.msg.them{background:#fff;color:var(--ink);align-self:flex-start;border-bottom-left-radius:.2em;}
.msg.me{background:#7dd13f;color:#0c3a06;align-self:flex-end;border-bottom-right-radius:.2em;}
.chat-from{font-size:clamp(9px,2vmin,15px);font-weight:800;color:#eaf6ff;margin-left:.6em;margin-top:1.5%;}
.composer{display:flex;gap:2%;margin-top:3%;}
.composer input{flex:1;border:none;border-radius:1.4em;padding:.6em 1em;font-size:clamp(11px,2.4vmin,18px);
  background:#fff;color:var(--ink);font-weight:700;}
.composer button{border:none;background:#7dd13f;color:#0c3a06;font-weight:900;border-radius:50%;
  width:clamp(36px,8vmin,56px);aspect-ratio:1;font-size:clamp(14px,3.4vmin,26px);cursor:pointer;box-shadow:0 4px 0 #4f9223;}
.composer button:active{transform:translateY(3px);box-shadow:0 1px 0 #4f9223;}

/* ---------- Camera (live camera + playful overlays) ---------- */
#cam{display:flex;flex-direction:column;align-items:center;gap:2.4%;height:100%;justify-content:center;}
.viewfinder{width:min(86%,60vmin);aspect-ratio:4/3;border-radius:2vmin;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#bfe9ff,#7fc7f0);box-shadow:var(--shadow),inset 0 0 0 .8vmin rgba(255,255,255,.4);
  display:grid;place-items:center;font-size:18vmin;}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.viewfinder video.mirror{transform:scaleX(-1);}
.viewfinder .snapfreeze{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
.viewfinder .camscene.overlaymode{opacity:.5;}
.camrow{display:flex;align-items:center;gap:6vmin;}
.camctl{width:clamp(46px,9.5vmin,68px);aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.28);display:grid;place-items:center;color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.3);transition:transform .1s;}
.camctl:active{transform:scale(.9);}
.camctl svg{width:52%;height:52%;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.viewfinder .grid-l{position:absolute;inset:0;background:
  linear-gradient(transparent 33%,rgba(255,255,255,.4) 33% 34%,transparent 34%),
  linear-gradient(transparent 66%,rgba(255,255,255,.4) 66% 67%,transparent 67%),
  linear-gradient(90deg,transparent 33%,rgba(255,255,255,.4) 33% 34%,transparent 34%),
  linear-gradient(90deg,transparent 66%,rgba(255,255,255,.4) 66% 67%,transparent 67%);}
.shutter{width:clamp(48px,12vmin,90px);aspect-ratio:1;border-radius:50%;border:.7vmin solid #fff;
  background:#ff6f61;cursor:pointer;box-shadow:0 6px 12px rgba(0,0,0,.35);transition:transform .1s;}
.shutter:active{transform:scale(.9);}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999;}

/* ---------- Tunes ---------- */
#tunes{display:flex;flex-direction:column;align-items:center;gap:2.4%;text-align:center;color:#fff;}
.cover{width:min(44%,32vmin);aspect-ratio:1;border-radius:2.4vmin;background:
  linear-gradient(135deg,#ff6f9c,#b03ad6);display:grid;place-items:center;
  box-shadow:var(--shadow);position:relative;overflow:hidden;}
.cover .disc{width:88%;height:88%;border-radius:50%;overflow:hidden;margin:auto;
  box-shadow:0 4px 14px rgba(0,0,0,.35);}
.cover .disc .coverart{width:100%;height:100%;display:block;}
.cover.spin .disc{animation:spin 5s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.track-title{font-size:clamp(15px,3.6vmin,30px);font-weight:900;}
.track-sub{opacity:.85;font-weight:700;font-size:clamp(10px,2.3vmin,18px);}
.transport{display:flex;align-items:center;gap:5vmin;margin-top:.6%;}
.transport button{border:none;cursor:pointer;color:#fff;transition:transform .1s;
  width:clamp(54px,11vmin,84px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(160deg,#9b6bff,#6a2fb0);
  box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.3);}
.transport button.playbtn{width:clamp(74px,15vmin,112px);
  background:linear-gradient(160deg,#7dd13f,#4f9e23);}
.transport button:active{transform:scale(.9);}
.transport button .gi{width:46%;height:46%;}
.seek{width:min(72%,520px);height:1.4vmin;min-height:8px;background:rgba(255,255,255,.35);border-radius:1em;overflow:hidden;}
.seek i{display:block;height:100%;width:30%;background:#fff;}

/* ---------- Settings (stub-ish, partly live) ---------- */
.set-row{display:flex;align-items:center;gap:3%;background:rgba(255,255,255,.14);border-radius:1.2vmin;
  padding:3% 4%;margin-bottom:2.5%;color:#fff;font-weight:800;font-size:clamp(11px,2.6vmin,20px);}
.set-row .ic2{font-size:clamp(20px,5vmin,40px);}
.toggle{margin-left:auto;width:clamp(46px,10vmin,72px);height:clamp(26px,5.6vmin,40px);border-radius:1em;
  background:rgba(0,0,0,.3);position:relative;cursor:pointer;transition:background .2s;flex:none;}
.toggle.on{background:#7dd13f;}
.toggle b{position:absolute;top:8%;left:6%;height:84%;aspect-ratio:1;border-radius:50%;background:#fff;
  transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.3);}
.toggle.on b{left:54%;}
.slider{margin-left:auto;width:46%;}
.slider input{width:100%;}

.toast{position:absolute;left:50%;bottom:6%;transform:translateX(-50%) translateY(20px);
  background:rgba(20,40,60,.92);color:#fff;font-weight:800;padding:.6em 1.2em;border-radius:1.4em;
  font-size:clamp(11px,2.4vmin,18px);opacity:0;z-index:50;pointer-events:none;transition:.3s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---- inline icon system ---- */
.gi{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.18em;flex:none;}
.tabtile{width:1.55em;height:1.55em;border-radius:.34em;vertical-align:-.4em;flex:none;}
.cardic{width:46%;height:46%;}
.note .noteic{width:clamp(28px,6.5vmin,50px);height:clamp(28px,6.5vmin,50px);}
.set-row .ic2{display:inline-flex;}
.set-row .ic2 svg{width:1.2em;height:1.2em;}
.cover .coverart{width:100%;height:100%;display:block;border-radius:inherit;}
.camscene{position:absolute;inset:0;width:100%;height:100%;display:block;}
.sendic{width:54%;height:54%;}
.h2ic{width:1em;height:1em;vertical-align:-.12em;}
.chipic{width:1.1em;height:1.1em;vertical-align:-.16em;}
.round .roundic{width:1em;height:1em;vertical-align:-.1em;}
.pixel-box .gfsvg{width:100%;height:100%;display:block;}
/* ---- Ribbit (kids' forum) ---- */
.ribbit-sort{display:flex;gap:2.5%;margin-bottom:3%;}
.ribbit-sort button{border:none;cursor:pointer;background:rgba(255,255,255,.18);color:#eaffff;font-weight:800;
  border-radius:1em;padding:.4em 1em;font-size:clamp(10px,2.4vmin,18px);display:inline-flex;align-items:center;gap:.35em;}
.ribbit-sort button.on{background:#1fb37e;color:#05311f;}
.ribbit-sort .gi{width:1.15em;height:1.15em;}
.rib{display:flex;gap:3%;background:#fff;border-radius:1.4vmin;padding:2.8% 3.2%;margin-bottom:2.4%;
  box-shadow:0 4px 10px rgba(0,40,70,.18);}
.rib-vote{display:flex;flex-direction:column;align-items:center;gap:.1em;color:#33424f;font-weight:900;flex:none;}
.rib-vote button{border:none;background:none;cursor:pointer;color:#b3bfca;width:1.7em;height:1.7em;padding:0;display:grid;place-items:center;border-radius:.4em;transition:transform .1s;}
.rib-vote button:active{transform:scale(.85);}
.rib-vote button .gi{width:1.6em;height:1.6em;}
.rib-vote button.up.on{color:#ff7a3d;}
.rib-vote button.down.on{color:#4a90e2;}
.rib-vote .count{font-size:clamp(12px,2.9vmin,21px);}
.rib-body{flex:1;min-width:0;}
.rib-meta{display:flex;align-items:center;gap:.5em;font-size:clamp(9px,2.1vmin,15px);color:#7c8a98;font-weight:800;margin-bottom:.3em;flex-wrap:wrap;}
.rib-comm{display:inline-flex;align-items:center;gap:.35em;color:#1fa372;}
.rib-comm .cico{width:1.5em;height:1.5em;border-radius:50%;background:#e6f7f0;display:inline-grid;place-items:center;}
.rib-comm .cico .gi{width:1.2em;height:1.2em;}
.rib-title{font-weight:800;color:#21303c;font-size:clamp(12px,2.8vmin,21px);line-height:1.2;}
.rib-foot{display:flex;align-items:center;gap:1.1em;margin-top:.5em;color:#8c98a4;font-weight:800;font-size:clamp(9px,2.1vmin,15px);}
.rib-foot span{display:inline-flex;align-items:center;gap:.35em;}
.rib-foot .gi{width:1.25em;height:1.25em;}
.hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#5a6b7a;font-size:12px;z-index:1;}
@media (orientation:portrait){ .hint b{color:#ffd23e;} }

<script>

const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const SVG=(sym,cls)=>`<svg class="${cls||'gi'}" aria-hidden="true"><use href="#${sym}"/></svg>`;
const view = $('#view');
const toastEl = $('#toast');
let soundOn = true;

/* ---- Keep the OS "sticky": stop iOS Safari rubber-banding & toolbar reveal ----
   Allow a touch-drag to scroll ONLY when it's inside a .view that actually
   overflows; otherwise swallow it so the page itself never moves. */
document.addEventListener('touchmove', function(e){
  if(e.touches && e.touches.length>1){ e.preventDefault(); return; } // no pinch
  let n=e.target;
  while(n && n!==document.body){
    if(n.id==='caro'||n.id==='dock'){ if(n.scrollWidth>n.clientWidth+1) return; }
    if(n.classList && n.classList.contains('view') && n.scrollHeight>n.clientHeight+1) return;
    n=n.parentNode;
  }
  e.preventDefault();
},{passive:false});
document.addEventListener('gesturestart', e=>e.preventDefault()); // block double-tap zoom

/* ---- persisted state ---- */
const DEFAULT_STATE = {
  friends:{ Heidi:false, Chelsea:false, Kara:false, BonnieBoo:true },
  posts:[

  ],
  ribbit:[
    {id:6, comm:"PondLife",      author:"BonnieBoo", av:"frog",   title:"I caught the BIGGEST bubble ever today!", votes:142, comments:23, v:0},
    {id:5, comm:"FrogFacts",     author:"HopMaster", av:"kara",   title:"Did you know? Frogs can breathe through their skin!", votes:308, comments:54, v:0},
    {id:4, comm:"BugClub",       author:"Heidi",     av:"lady",   title:"Found a shiny rainbow beetle by the reeds", votes:88, comments:12, v:0},
    {id:3, comm:"Tadpoles",      author:"Kara",      av:"kara",   title:"My tadpole grew its very first leg!!", votes:201, comments:31, v:0},
    {id:2, comm:"LilyPads",      author:"Chelsea",   av:"beaver", title:"Best lily pad for napping? Need recommendations", votes:67, comments:45, v:0},

  ],

};

  PondLife:{ic:"frog"}, FrogFacts:{ic:"tp-star"}, BugClub:{ic:"lady"},
  Tadpoles:{ic:"kara"}, LilyPads:{ic:"pop-lily"}, CritterCorner:{ic:"beaver"},
};
let S = load();

function save(){ localStorage.setItem('lilypad', JSON.stringify(S)); }

/* ---- friend avatars (the little Pond critters) ---- */
const CRITTER = {
  Heidi:   {sym:"lady",   bg:"#7a3fc0"},
  Chelsea: {sym:"beaver", bg:"#c98a3a"},

};
const critSvg=(sym)=>`<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#${sym}"/></svg>`;

/* ---- tiny sound engine (Web Audio beeps) ---- */
let actx;
function blip(freq=520,dur=.08,type="sine",vol=.2){
  if(!soundOn) return;
  try{ actx = actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol*(S.volume/100);
    o.connect(g);g.connect(actx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sfxTap=()=>blip(620,.06,"triangle",.18);
const sfxGood=()=>{blip(660,.09,"sine",.2);setTimeout(()=>blip(880,.12,"sine",.2),90);};
const sfxBad=()=>blip(160,.18,"sawtooth",.15);

/* ---- Tunes: tiny Web Audio melody player (real, looping music) ---- */
function ensureCtx(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended')actx.resume(); }catch(e){} }
function noteFreq(n){ if(!n) return 0; const map={C:-9,D:-7,E:-5,F:-4,G:-2,A:0,B:2}; const m=/^([A-G])(#?)(\d)$/.exec(n); if(!m)return 0; const s=map[m[1]]+(m[2]?1:0)+(+m[3]-4)*12; return 440*Math.pow(2,s/12); }
const TUNES_MELODY={
  'cov-1':{step:0.19,wave:'square',  notes:['C4','E4','G4','C5','G4','E4','A4','C5','F4','A4','C5','A4','G4','E4','C4',null]},
  'cov-2':{step:0.42,wave:'sine',    notes:['E4','G4','C5','B4','A4','G4','E4',null,'D4','E4','G4',null,'C4',null,null,null]},
  'cov-3':{step:0.16,wave:'triangle',notes:['G4','G4','C5','C5','E5','C5','G4',null,'A4','A4','D5','D5','F5','D5','A4',null]},
};
let tuneTimer=null;
function stopTune(){ if(tuneTimer){clearInterval(tuneTimer);tuneTimer=null;} }
function startTune(cov){
  stopTune(); ensureCtx(); if(!actx) return;
  const mel=TUNES_MELODY[cov]||TUNES_MELODY['cov-1']; let idx=0;
  const tap=()=>{
    if(!soundOn) return;
    const n=mel.notes[idx%mel.notes.length]; idx++;
    const f=noteFreq(n); if(!f) return;
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type=mel.wave; o.frequency.value=f;
    const vol=0.14*(S.volume/100);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+mel.step*0.9);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+mel.step);
  };
  tap();
  tuneTimer=setInterval(tap, mel.step*1000);
}

function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1600);}

/* ---- clock ---- */
function tick(){const d=new Date();let h=d.getHours()%12||12;$('#clock').textContent=h+":"+String(d.getMinutes()).padStart(2,'0');}
setInterval(tick,1000);tick();

/* ---- pond decor (bubbles + lily pads) ---- */
(function decor(){
  const d=$('#decor');

    else arr.sort((a,b)=>(score(b)+b.comments)-(score(a)+a.comments));
    arr.forEach(p=>list.appendChild(row(p)));

  function row(p){
    const c=RIBBIT_COMMS[p.comm]||{ic:'frog'};

      <div class="rib-vote">
        <button class="up${p.v===1?' on':''}">${SVG('gl-up')}</button>

function renderDoodle(v){
  const head=el('div','app-head');head.innerHTML=`<span class="tab" style="background:#d63b86">${SVG('app-doodle','tabtile')} Doodle</span>`;
  const clr=el('button','pill-btn',`${SVG('gl-reset')} Clear`);
  head.appendChild(clr);
  v.appendChild(head);
  const wrap=el('div',null);wrap.id='doodle-wrap';
  const cv=el('canvas');cv.id='doodle-canvas';
  const pal=el('div','palette');
  wrap.appendChild(cv);wrap.appendChild(pal);v.appendChild(wrap);

  const colors=['#16202a','#ff6f61','#ffd23e','#7dd13f','#4dd2ff','#cf3aa6','#9b6bff','#ffffff'];
  let color=colors[0], size=6;
  colors.forEach((c,i)=>{const s=el('div','swatch'+(i===0?' sel':''));s.style.background=c;
    s.onclick=()=>{color=c;[...pal.children].forEach(x=>x.classList.remove('sel'));s.classList.add('sel');sfxTap();};pal.appendChild(s);});
  [3,6,10].forEach((rr,i)=>{const b=el('button','swatch');b.style.cssText='background:#fff;display:grid;place-items:center;';
    b.innerHTML=`<svg viewBox="0 0 24 24" style="width:72%;height:72%"><circle cx="12" cy="12" r="${rr}" fill="#16242e"/></svg>`;
    b.onclick=()=>{size=[4,12,26][i];sfxTap();toast('Brush '+['thin','thick','huge'][i]);};pal.appendChild(b);});

  const ctx=cv.getContext('2d');
  function fit(){const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineCap='round';ctx.lineJoin='round';}
  requestAnimationFrame(fit);
  let drawing=false,last=null;
  function pos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
  function start(e){drawing=true;last=pos(e);e.preventDefault();}
  function move(e){if(!drawing)return;const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault();}
  function end(){drawing=false;}
  cv.addEventListener('pointerdown',start);cv.addEventListener('pointermove',move);
  window.addEventListener('pointerup',end);
  clr.onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);sfxTap();};
}

/* "ROUND 1-7 guess the toy" mini-game straight from the trailer */
function gameGuess(v){
  v.innerHTML='';
  const TOYS=[
    {sym:'toy-woody',name:'Woody',opts:['Woody','Buzz','Rex','Hamm']},
    {sym:'toy-buzz',name:'Buzz',opts:['Jessie','Buzz','Slinky','Forky']},
    {sym:'toy-bullseye',name:'Bullseye',opts:['Bullseye','Rex','Trixie','Buttercup']},
    {sym:'toy-rex',name:'Rex',opts:['Hamm','Rex','Woody','Wheezy']},
    {sym:'toy-jessie',name:'Jessie',opts:['Bo Peep','Jessie','Dolly','Gabby']},
    {sym:'toy-potato',name:'Mr. Potato Head',opts:['Mr. Potato Head','Slinky','Buzz','Rex']},
    {sym:'toy-frog',name:'Lilypad',opts:['Lilypad','Forky','Ducky','Bunny']},
  ];
  let round=0,score=0;
  const wrap=el('div',null);wrap.id='guess';
  v.appendChild(wrap);
  function draw(){
    const t=TOYS[round];
    wrap.innerHTML='';
    wrap.appendChild(el('div','round','ROUND '+(round+1)));
    const box=el('div','pixel-box');
    box.innerHTML=`<div class="meter"><i style="width:100%"></i></div>`;
    const face=el('div');
    face.innerHTML=SVG(t.sym,'gfsvg');
    face.style.cssText='width:74%;height:74%;filter:blur(14px);transition:filter 2.4s linear;';
    box.appendChild(face);
    wrap.appendChild(box);
    requestAnimationFrame(()=>{face.style.filter='blur(2px)';box.querySelector('.meter i').style.transition='width 2.4s linear';box.querySelector('.meter i').style.width='0%';});
    const opts=el('div','guess-opts');
    t.opts.forEach(o=>{const b=el('button',null,o);b.onclick=()=>{
      if(o===t.name){b.classList.add('right');sfxGood();score++;face.style.filter='none';}
      else{b.classList.add('wrong');sfxBad();[...opts.children].forEach(x=>{if(x.textContent===t.name)x.classList.add('right');});face.style.filter='none';}
      [...opts.children].forEach(x=>x.disabled=true);
      setTimeout(()=>{round++; round<TOYS.length?draw():finish();},1100);
    };opts.appendChild(b);});
    wrap.appendChild(opts);
  }
  function finish(){
    wrap.innerHTML='';
    const rd=el('div','round'); rd.innerHTML=`${SVG('gl-trophy','roundic')} ${score}/${TOYS.length}`; wrap.appendChild(rd);
    wrap.appendChild(el('div',null,`<p style="color:#fff;font-weight:800;font-size:clamp(13px,3vmin,24px)">${score===TOYS.length?'Perfect round! You know every toy!':'Great guessing on the Pond!'}</p>`));
    const again=el('button','pill-btn','▶ Play again');again.style.margin='2% auto';again.onclick=()=>{round=0;score=0;draw();};
    const back=el('button','pill-btn','← Games');back.style.cssText='margin:2% auto;background:#9b6bff;box-shadow:0 4px 0 #6a2fb0;';back.onclick=()=>go('games');
    wrap.appendChild(again);wrap.appendChild(back);
  }
  draw();
}

/* Bubble Pop — pop bubbles (+1), frogs are double (+2), avoid lily pads (-1).
   Difficulty ramps each round; first two rounds are gentle for little kids. */
const POP_ROUNDS=[
  {bg:'bg-r1',name:'Warm Up',      dur:22, spawn:720,  life:3500, sizeF:0.30, lily:0.16, frog:0.28},
  {bg:'bg-r2',name:'Lily Splash',  dur:24, spawn:1000, life:3000, sizeF:0.27, lily:0.16, frog:0.27},
  {bg:'bg-r3',name:'Deep Dive',    dur:26, spawn:850,  life:2400, sizeF:0.23, lily:0.16, frog:0.24},
  {bg:'bg-r4',name:'Sunset Pop',   dur:28, spawn:700,  life:2000, sizeF:0.20, lily:0.22, frog:0.22},
  {bg:'bg-r5',name:'Night Frenzy', dur:30, spawn:560,  life:1700, sizeF:0.18, lily:0.26, frog:0.22},
];
const piece=(sym)=>`<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#${sym}"/></svg>`;

function gamePop(v){
  v.innerHTML='';
  const area=el('div'); area.id='pop-area'; v.appendChild(area);
  let bgEl=null, roundIdx=0, total=0;

  function setBg(sym){ if(!bgEl){bgEl=el('div','pop-bg'); area.appendChild(bgEl);} bgEl.innerHTML=`<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><use href="#${sym}"/></svg>`; }
  function overlay(html){ const o=el('div','pop-overlay'); o.innerHTML=html; area.appendChild(o); return o; }

  function roundIntro(){
    const r=POP_ROUNDS[roundIdx];
    setBg(r.bg);
    const o=overlay(`<div class="hud-chip chip-round">Round ${roundIdx+1} / ${POP_ROUNDS.length}</div>
      <h2>${r.name}</h2>
      <div class="tip-row"><b>${piece('pop-bubble')} +1</b><b>${piece('pop-frog')} +2</b><b>${piece('pop-lily')} −1</b></div>
      <p>${roundIdx<2?'Take your time — tap the bubbles!':'Faster now — grab the frogs, dodge the lily pads!'}</p>`);
    const btn=el('button','big-btn', roundIdx===0?'▶ Start':'▶ Go!');
    btn.onclick=()=>{ o.remove(); playRound(); };
    o.appendChild(btn);
  }

  function playRound(){
    const r=POP_ROUNDS[roundIdx];
    let time=r.dur, roundScore=0, live=true;
    const hud=el('div','pop-hud');
    const cRound=el('span','hud-chip chip-round',`${SVG('gl-star','chipic')} R${roundIdx+1}`);
    const cScore=el('span','hud-chip chip-score',`${SVG('gl-star','chipic')} <span class="num">${total}</span>`);
    const cTime=el('span','hud-chip chip-time',`⏱ ${time}`);
    hud.append(cRound,cScore,cTime); area.appendChild(hud);
    const bar=el('div','time-bar'); area.appendChild(bar);

    function award(d,x,y){
      total=Math.max(0,total+d); roundScore+=d;
      cScore.querySelector('.num').textContent=total;
      cScore.classList.remove('score-bump'); void cScore.offsetWidth; cScore.classList.add('score-bump');
      const p=el('div','pop-pop'); p.textContent = d>=2?'+2 ×2!':(d>0?`+${d}`:`−1`);
      p.style.left=x+'px'; p.style.top=y+'px';
      p.style.color = d<0?'#ff6b6b':(d>=2?'#ffe066':'#9be86a');
      p.style.fontSize = d>=2?'clamp(18px,5vmin,36px)':'clamp(14px,4vmin,26px)';
      area.appendChild(p);
      p.animate([{transform:'translate(-50%,-50%) scale(.5)',opacity:0},{transform:'translate(-50%,-90%) scale(1.1)',opacity:1,offset:.3},{transform:'translate(-50%,-180%) scale(1)',opacity:0}],{duration:850,easing:'ease-out'}).onfinish=()=>p.remove();
    }
    function spawn(){
      if(!live)return;
      const R=area.getBoundingClientRect(); const amin=Math.min(R.width,R.height);
      const size=Math.max(36, amin*r.sizeF);
      const rr=Math.random(); let type,sym;
      if(rr<r.frog){type='frog';sym='pop-frog';}
      else if(rr<r.frog+r.lily){type='lily';sym='pop-lily';}
      else{type='bubble';sym=['pop-bubble','pop-bubble-pink','pop-bubble-mint'][Math.floor(Math.random()*3)];}
      const it=el('button','pop-item'); it.innerHTML=piece(sym);
      it.style.width=it.style.height=size+'px';
      const x=6+Math.random()*Math.max(1,R.width-size-12);
      const topMin=R.height*0.16, topMax=R.height-size-6;
      const y=topMin+Math.random()*Math.max(1,topMax-topMin);
      it.style.left=x+'px'; it.style.top=y+'px';
      area.appendChild(it);
      it.animate([{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:260,easing:'ease-out'});
      const bob=it.animate([{transform:'translateY(0)'},{transform:`translateY(-${6+Math.random()*8}px)`},{transform:'translateY(0)'}],{duration:1400+Math.random()*800,iterations:Infinity,easing:'ease-in-out'});
      it._life=setTimeout(()=>{ it.animate([{opacity:1},{opacity:0,transform:'scale(.6)'}],{duration:340}).onfinish=()=>it.remove(); }, r.life);
      it.addEventListener('pointerdown',(e)=>{
        e.preventDefault(); if(!live)return;
        clearTimeout(it._life); bob.cancel();
        const br=it.getBoundingClientRect(), ar=area.getBoundingClientRect();
        award(type==='frog'?2:(type==='lily'?-1:1), br.left-ar.left+size/2, br.top-ar.top+size/2);
        it.style.pointerEvents='none';
        it.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.5)',opacity:0}],{duration:170}).onfinish=()=>it.remove();
        if(type==='lily') blip(150,.16,'sawtooth',.14); else blip(560+Math.random()*160,.05,'triangle',.16);
      },{passive:false});
      if(live) setTimeout(spawn, r.spawn*(0.7+Math.random()*0.6));
    }
    const timer=setInterval(()=>{
      time--; cTime.textContent=`⏱ ${time}`; bar.style.width=Math.max(0,time/r.dur*100)+'%';
      if(time<=0){ clearInterval(timer); live=false; setTimeout(()=>endRound(roundScore,hud,bar),250); }
    },1000);
    spawn();
  }

  function endRound(roundScore,hud,bar){
    area.querySelectorAll('.pop-item,.pop-pop').forEach(i=>i.remove());
    if(hud)hud.remove(); if(bar)bar.remove();
    const last = roundIdx>=POP_ROUNDS.length-1;
    sfxGood(); if(last) confetti();
    const sign = roundScore>=0?`+${roundScore}`:`${roundScore}`;
    const o=overlay(`<h2>${last?`${SVG('gl-trophy','h2ic')} Pond Champion!`:'Round Done!'}</h2>
      <div class="hud-chip chip-score" style="font-size:clamp(18px,5vmin,34px)">${SVG('gl-star','chipic')} ${total} points</div>
      <p>${last?'You finished every round on the Pond!':`${sign} points this round`}</p>`);
    const btn=el('button','big-btn', last?'▶ Play again':'▶ Next round');
    btn.onclick=()=>{ o.remove(); if(last){ total=0; roundIdx=0; } else { roundIdx++; } roundIntro(); };
    o.appendChild(btn);
  }

  roundIntro();
}

    const b=el('div','msg me');b.textContent=t;chat.appendChild(b);inp.value='';chat.scrollIntoView(false);sfxTap();

      S.msgs.push({from:'them',who:'BonnieBoo',text:r});save();const rb=el('div','msg them');rb.textContent=r;chat.appendChild(rb);chat.scrollIntoView(false);blip(560,.07);},800);}

  comp.appendChild(inp);comp.appendChild(send);v.appendChild(comp);

/* =====================================================================
   CAMERA  — real iPad camera (front/back) with pond scene overlays
   ===================================================================== */
let camStream=null;
function stopCam(){if(camStream){try{camStream.getTracks().forEach(t=>t.stop());}catch(e){}camStream=null;}}
function renderCamera(v){
  const head=el('div','app-head');head.innerHTML=`<span class="tab" style="background:#f0a91f">${SVG('app-camera','tabtile')} Camera</span>`;
  v.appendChild(head);
  const wrap=el('div',null);wrap.id='cam';
  const scenes=[null,'cam-pond','cam-frog','cam-room','cam-sunset'];let si=0,facing='environment',live=false;
  const vf=el('div','viewfinder');
  vf.innerHTML=`<video id="camvid" autoplay playsinline muted></video>
    <canvas class="snapfreeze" id="camsnap"></canvas>
    <svg class="camscene" id="cam-scene" style="display:none"><use href="#cam-pond"/></svg>
    <div class="grid-l"></div>`;
  const vid=vf.querySelector('#camvid'),snap=vf.querySelector('#camsnap'),scene=vf.querySelector('#cam-scene');
  const row=el('div','camrow');
  const flip=el('button','camctl');flip.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>';
  const sh=el('button','shutter');
  const scn=el('button','camctl');scn.innerHTML=SVG('gl-leaf','gi');scn.querySelector('svg').style.cssText='width:52%;height:52%;fill:#fff;stroke:none;';
  row.appendChild(flip);row.appendChild(sh);row.appendChild(scn);
  wrap.appendChild(vf);wrap.appendChild(row);
  v.appendChild(wrap);
  function applyScene(){
    if(si===0){scene.style.display='none';return;}
    scene.style.display='';
    scene.querySelector('use').setAttribute('href','#'+scenes[si]);
    scene.classList.toggle('overlaymode',live);
  }
  async function startCam(){
    stopCam();
    try{
      camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
      vid.srcObject=camStream;live=true;
      vid.style.display='';vid.classList.toggle('mirror',facing==='user');
      applyScene();
    }catch(e){
      live=false;vid.style.display='none';
      si=1;applyScene();scene.classList.remove('overlaymode');
      toast('No camera here — pretend mode!');
    }
  }
  flip.onclick=()=>{facing=facing==='environment'?'user':'environment';sfxTap();startCam();};
  scn.onclick=()=>{si=(si+1)%scenes.length;if(!live&&si===0)si=1;applyScene();sfxTap();
    toast(si===0?'No overlay':'Overlay: '+['','Pond','Froggy','Cozy room','Sunset'][si]);};
  sh.onclick=()=>{
    const f=$('#flash');f.animate([{opacity:0},{opacity:.9},{opacity:0}],{duration:260});
    blip(900,.05,'square',.2);
    if(live&&vid.videoWidth){
      snap.width=vid.videoWidth;snap.height=vid.videoHeight;
      const c=snap.getContext('2d');
      if(facing==='user'){c.translate(snap.width,0);c.scale(-1,1);}
      c.drawImage(vid,0,0);
      snap.style.display='block';
      setTimeout(()=>{snap.style.display='none';},1100);
      toast('Snap! What a shot!');
    }else{
      si=(si%4)+1;applyScene();
      toast('Snap! Saved to the Pond');
    }
  };
  startCam();
}

/* =====================================================================
   TUNES  — stub music player
   ===================================================================== */
function renderTunes(v){
  const head=el('div','app-head');head.innerHTML=`<span class="tab" style="background:#b03ad6">${SVG('app-tunes','tabtile')} Tunes</span>`;
  v.appendChild(head);
  const wrap=el('div',null);wrap.id='tunes';
  const tracks=[{t:'Ribbit Remix',a:'DJ Tadpole',cov:'cov-1'},{t:'Lily Pad Lullaby',a:'The Pond Girls',cov:'cov-2'},{t:'Splash Party',a:'Bonnie & Friends',cov:'cov-3'}];
  let i=0,playing=false;
  const cover=el('div','cover');
  const title=el('div','track-title');
  const sub=el('div','track-sub');
  const seek=el('div','seek');seek.innerHTML='<i></i>';
  const tr=el('div','transport');
  const prev=el('button',null,SVG('gl-prev','gi'));const play=el('button','playbtn',SVG('gl-play','gi'));const next=el('button',null,SVG('gl-next','gi'));
  tr.appendChild(prev);tr.appendChild(play);tr.appendChild(next);
  function set(){cover.innerHTML='<div class="disc">'+SVG(tracks[i].cov,'coverart')+'</div>';title.textContent=tracks[i].t;sub.textContent=tracks[i].a;}
  function setPlay(p){playing=p;play.innerHTML=SVG(playing?'gl-pause':'gl-play','gi');cover.classList.toggle('spin',playing);if(playing)startTune(tracks[i].cov);else stopTune();}
  play.onclick=()=>{setPlay(!playing);toast(playing?'Playing':'Paused');};
  next.onclick=()=>{i=(i+1)%tracks.length;set();sfxTap();if(playing)startTune(tracks[i].cov);};
  prev.onclick=()=>{i=(i-1+tracks.length)%tracks.length;set();sfxTap();if(playing)startTune(tracks[i].cov);};
  set();
  [cover,title,sub,seek,tr].forEach(x=>wrap.appendChild(x));
  v.appendChild(wrap);
}

/* =====================================================================
   SETTINGS  — partly live (volume/brightness/sound)
   ===================================================================== */
function renderSettings(v){
  const head=el('div','app-head');head.innerHTML=`<span class="tab" style="background:#4f6577">${SVG('app-settings','tabtile')} Settings</span>`;
  v.appendChild(head);
  // volume
  v.appendChild(sliderRow('gl-vol','Volume','volume', val=>{S.volume=val;save();}));
  v.appendChild(sliderRow('gl-sun','Brightness','brightness', val=>{S.brightness=val;save();$('#screen').style.filter=`brightness(${.55+val/100*.6})`;}));
  v.appendChild(toggleRow('gl-mute','Sound effects','sfx', on=>{S.sfx=on;soundOn=on;save();if(on)sfxTap();}));
  v.appendChild(toggleRow('frog','Frog voice','frogVoice', on=>{S.frogVoice=on;save();if(on)blip(440,.12,'sine',.2);toast(on?'Ribbit!':'Frog muted');}));
  // about
  const about=el('div','set-row');about.style.display='block';
  about.innerHTML=`<div style="display:flex;align-items:center;gap:3%"><span class="ic2">${SVG('gl-info')}</span><span>About Lilypad</span></div>
    <p style="font-weight:700;opacity:.85;margin:.6em 0 0;font-size:.8em">Lilypad OS · "The Pond" · v5.0<br>Make friends. Make a splash.<br><span style="opacity:.6">Fan replica — not affiliated with Disney/Pixar.</span></p>`;
  v.appendChild(about);
  const reset=el('button','pill-btn',`${SVG('gl-reset')} Reset the Pond`);reset.style.cssText='background:#ff6f61;box-shadow:0 4px 0 #b03a30;color:#fff;margin-top:2%';
  reset.onclick=()=>{if(confirm('Reset all Pond data?')){localStorage.removeItem('lilypad');S=load();sfxTap();go('home');}};
  v.appendChild(reset);
}
function sliderRow(ic,label,key,fn){
  const r=el('div','set-row');
  r.innerHTML=`<span class="ic2">${SVG(ic)}</span><span>${label}</span>`;
  const sl=el('div','slider');const inp=el('input');inp.type='range';inp.min=0;inp.max=100;inp.value=S[key];
  inp.oninput=()=>fn(+inp.value);sl.appendChild(inp);r.appendChild(sl);return r;
}
function toggleRow(ic,label,key,fn){
  const r=el('div','set-row');
  r.innerHTML=`<span class="ic2">${SVG(ic)}</span><span>${label}</span>`;
  const t=el('div','toggle'+(S[key]?' on':''));t.innerHTML='<b></b>';
  t.onclick=()=>{const on=!t.classList.contains('on');t.classList.toggle('on',on);fn(on);};
  r.appendChild(t);return r;
}

/* apply saved brightness on boot */
$('#screen').style.filter=`brightness(${.55+S.brightness/100*.6})`;

/* boot (supports deep links like #pond, #games, #guess, #pop) */
function route(n){
  if(APPS[n]){go(n);return;}
  if(n==='guess'||n==='pop'){ go('games'); const v=$('#view-games'); v.innerHTML=''; (n==='guess'?gameGuess:gamePop)(v); return; }
  go('home');
}
route(location.hash.slice(1));
window.addEventListener('hashchange',()=>route(location.hash.slice(1)));
