<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pond Puzzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'SF Pro Rounded','Arial Rounded MT Bold',system-ui,sans-serif;background:#0e3a4a;}
button{font-family:inherit;border:none;cursor:pointer;}
#app{position:fixed;inset:0;background:linear-gradient(180deg,#134b5f,#0e3a4a 60%,#0a2c3a);}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.on{display:flex;}
/* gallery */
#galHead{display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top)) 18px 8px;}
#galHead h1{color:#fff;font-size:30px;flex:1;}
.round{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,0.14);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.round svg{width:26px;height:26px;}
#galGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:10px 18px calc(24px + env(safe-area-inset-bottom));}
.gcard{background:rgba(255,255,255,0.1);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;transition:transform .09s;}
.gcard:active{transform:scale(0.96);}
.gcard canvas{width:100%;border-radius:14px;display:block;}
.gcard .nm{color:#fff;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;}
.gcard .st{color:#ffd23e;font-size:13px;letter-spacing:1px;}
/* size picker modal */
#veil{position:absolute;inset:0;background:rgba(6,22,30,0.72);display:none;align-items:center;justify-content:center;z-index:40;}
#veil.on{display:flex;}
#sizeCard{background:#fdfcf7;border-radius:26px;padding:22px 26px;width:min(430px,88vw);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,0.4);}
#sizeCard h2{color:#1d4e5e;margin-bottom:4px;}
#sizeCard p{color:#5b7d89;font-weight:700;margin-bottom:14px;}
#sizeCard .sizes{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sizeb{font-size:22px;font-weight:900;padding:18px 8px;border-radius:18px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,0.22);}
.sizeb small{display:block;font-size:12px;font-weight:800;opacity:0.85;}
.sizeb:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,0.22);}
.s6{background:linear-gradient(160deg,#7dd13f,#4f9e23);}
.s12{background:linear-gradient(160deg,#4dc9f0,#1e8ac2);}
.s24{background:linear-gradient(160deg,#b48cff,#7a3fd1);}
.s48{background:linear-gradient(160deg,#ff9d3f,#e5533d);}
#sizeClose{margin-top:14px;color:#5b7d89;font-weight:800;background:none;font-size:16px;}
/* play screen */
#playWrap{flex:1;position:relative;overflow:hidden;}
#board{position:absolute;z-index:1;border-radius:6px;box-shadow:0 0 0 4px rgba(255,255,255,0.25),0 12px 40px rgba(0,0,0,0.35);}
#ghost{position:absolute;z-index:2;opacity:0.18;border-radius:6px;pointer-events:none;}
.piece{position:absolute;touch-action:none;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,0.35));}
.piece.locked{filter:none;pointer-events:none;}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;z-index:30;pointer-events:none;}
#hud>*{pointer-events:auto;}
#hudR{display:flex;gap:10px;}
#prog{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;font-weight:900;font-size:16px;background:rgba(10,30,40,0.6);padding:8px 18px;border-radius:999px;z-index:30;}
#winV{position:absolute;inset:0;background:rgba(6,22,30,0.55);display:none;align-items:center;justify-content:center;z-index:50;}
#winV.on{display:flex;}
#winCard{background:#fdfcf7;border-radius:28px;padding:26px 30px;text-align:center;width:min(420px,88vw);box-shadow:0 18px 50px rgba(0,0,0,0.4);animation:pop .35s;}
@keyframes pop{from{transform:scale(0.6);opacity:0;}to{transform:scale(1);opacity:1;}}
#winCard h2{color:#1d4e5e;font-size:32px;}
#winCard .stars{font-size:34px;color:#ffd23e;letter-spacing:6px;margin:6px 0 12px;}
#winCard button{display:block;width:100%;margin-top:10px;padding:14px;border-radius:16px;font-size:18px;font-weight:900;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,0.2);}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:45;}
</style>
</head>
<body>
<div id="app">
  <div class="screen on" id="scrGal">
    <div id="galHead">
      <button class="round" id="btnHome" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
      <h1>Pond Puzzle</h1>
    </div>
    <div id="galGrid"></div>
  </div>
  <div class="screen" id="scrPlay">
    <div id="playWrap">
      <canvas id="ghost"></canvas>
      <canvas id="board"></canvas>
      <div id="hud">
        <button class="round" id="btnBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div id="hudR">
          <button class="round" id="btnEye" aria-label="Toggle guide"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
          <button class="round" id="btnShuf" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
        </div>
      </div>
      <div id="prog"></div>
      <canvas id="confetti"></canvas>
      <div id="winV"><div id="winCard">
        <h2>Puzzle done!</h2>
        <div class="stars" id="winStars"></div>
        <button class="s24" id="winBigger">Try more pieces!</button>
        <button class="s6" id="winGal">More puzzles</button>
      </div></div>
    </div>
  </div>
  <div id="veil"><div id="sizeCard">
    <h2 id="szName"></h2>
    <p>How many pieces?</p>
    <div class="sizes">
      <button class="sizeb s6" data-n="6">6<small>easy peasy</small></button>
      <button class="sizeb s12" data-n="12">12<small>just right</small></button>
      <button class="sizeb s24" data-n="24">24<small>tricky</small></button>
      <button class="sizeb s48" data-n="48">48<small>puzzle master</small></button>
    </div>
    <button id="sizeClose">Not now</button>
  </div></div>
</div>
<script>
'use strict';
const $=q=>document.querySelector(q);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
let seed=1;
const srand=s=>{seed=s;};
const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};

/* ================= scene painting kit (900x675 space) ================= */
const SW=900,SH=675;
function lg(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);
  for(const s of stops)gr.addColorStop(s[0],s[1]);return gr;}
function rg(g,x,y,r,stops){const gr=g.createRadialGradient(x,y,0,x,y,r);
  for(const s of stops)gr.addColorStop(s[0],s[1]);return gr;}
function blob(g,pts,close){ /* smooth closed curve through points */
  g.beginPath();
  const n=pts.length;
  g.moveTo((pts[0][0]+pts[n-1][0])/2,(pts[0][1]+pts[n-1][1])/2);
  for(let i=0;i<n;i++){
    const p=pts[i],q=pts[(i+1)%n];
    g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);
  }
  g.closePath();
}
function sky(g,stops){g.fillStyle=lg(g,0,0,0,SH,stops);g.fillRect(0,0,SW,SH);}
function sun(g,x,y,r,c1,c2){
  g.fillStyle=rg(g,x,y,r*3,[[0,c2],[1,'rgba(255,255,255,0)']]);g.fillRect(x-r*3,y-r*3,r*6,r*6);
  g.fillStyle=c1;g.beginPath();g.arc(x,y,r,0,7);g.fill();
}
function cloudBank(g,y,c,n){
  for(let i=0;i<n;i++){
    const cx=rnd()*SW,cy=y+rnd()*46,s=40+rnd()*70;
    g.fillStyle=c;
    for(let k=0;k<4;k++){g.beginPath();g.arc(cx+k*s*0.5-(s*0.75),cy+(k%2)*-s*0.16,s*(0.5-k*0.07),0,7);g.fill();}
  }
}
function hills(g,y,c){
  g.fillStyle=c;g.beginPath();g.moveTo(0,SH);g.lineTo(0,y+30);
  for(let x=0;x<=SW;x+=60)g.quadraticCurveTo(x+30,y+(rnd()-0.5)*60,x+60,y+(rnd()-0.5)*30+15);
  g.lineTo(SW,SH);g.closePath();g.fill();
}
function treeline(g,y,c,n){
  g.fillStyle=c;
  for(let i=0;i<n;i++){
    const x=rnd()*SW,s=26+rnd()*40;
    g.beginPath();g.arc(x,y,s,0,7);g.arc(x-s*0.7,y+s*0.35,s*0.7,0,7);g.arc(x+s*0.7,y+s*0.3,s*0.75,0,7);g.fill();
  }
}
function water(g,yTop,stops,ripC){
  g.fillStyle=lg(g,0,yTop,0,SH,stops);g.fillRect(0,yTop,SW,SH-yTop);
  g.strokeStyle=ripC;g.lineWidth=2.5;g.lineCap='round';
  for(let i=0;i<38;i++){
    const y=yTop+8+Math.pow(rnd(),1.4)*(SH-yTop-16);
    const x=rnd()*SW,len=20+rnd()*90*((y-yTop)/(SH-yTop)+0.3);
    g.globalAlpha=0.14+rnd()*0.3;
    g.beginPath();g.moveTo(x-len/2,y);g.lineTo(x+len/2,y);g.stroke();
  }
  g.globalAlpha=1;
}
function reflection(g,x,y,w,h,c){
  g.fillStyle=c;g.globalAlpha=0.22;
  g.beginPath();g.ellipse(x,y,w,h,0,0,7);g.fill();g.globalAlpha=1;
}
function reeds(g,x0,x1,yB,n,c1,c2){
  for(let i=0;i<n;i++){
    const x=x0+rnd()*(x1-x0),h=90+rnd()*160,lean=(rnd()-0.5)*40;
    g.strokeStyle=rnd()>0.5?c1:c2;g.lineWidth=5+rnd()*4;g.lineCap='round';
    g.beginPath();g.moveTo(x,yB);g.quadraticCurveTo(x+lean*0.4,yB-h*0.6,x+lean,yB-h);g.stroke();
    if(rnd()>0.55){g.fillStyle='#6b4a2a';g.beginPath();g.ellipse(x+lean,yB-h-14,7,20,lean*0.01,0,7);g.fill();}
  }
}
function lilyPad(g,x,y,s,c){
  g.fillStyle=c;g.beginPath();
  g.ellipse(x,y,s,s*0.42,0,0.25,6.05);g.lineTo(x,y);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,0.12)';g.beginPath();g.ellipse(x-s*0.25,y-s*0.1,s*0.5,s*0.16,0,0,7);g.fill();
}
function lotus(g,x,y,s,c1,c2){
  for(let k=0;k<7;k++){
    const a=-Math.PI/2+(k-3)*0.42;
    g.fillStyle=k%2?c1:c2;
    g.beginPath();g.ellipse(x+Math.cos(a)*s*0.42,y+Math.sin(a)*s*0.42,s*0.34,s*0.62,a+Math.PI/2,0,7);g.fill();
  }
  g.fillStyle='#ffd23e';g.beginPath();g.arc(x,y,s*0.2,0,7);g.fill();
}
function eyeDot(g,x,y,r){
  g.fillStyle='#fff';g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.fillStyle='#182430';g.beginPath();g.arc(x+r*0.15,y+r*0.12,r*0.55,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(x-r*0.18,y-r*0.22,r*0.22,0,7);g.fill();
}
function soft(g,blur,color){g.shadowBlur=blur;g.shadowColor=color;}
function unsoft(g){g.shadowBlur=0;}
function grad2(g,x,y,r,c1,c2){return rg(g,x-r*0.3,y-r*0.4,r*1.7,[[0,c1],[1,c2]]);}
function mist(g,y,a){
  for(let i=0;i<5;i++){
    g.fillStyle='rgba(240,248,252,'+(a*(0.5+rnd()*0.5))+')';
    g.beginPath();g.ellipse(rnd()*SW,y+(rnd()-0.5)*60,180+rnd()*200,26+rnd()*22,0,0,7);g.fill();
  }
}
function raindrops(g,n){
  g.strokeStyle='rgba(220,240,255,0.4)';g.lineWidth=2.4;g.lineCap='round';
  for(let i=0;i<n;i++){const x=rnd()*SW,y=rnd()*SH,l=16+rnd()*18;
    g.beginPath();g.moveTo(x,y);g.lineTo(x-l*0.22,y+l);g.stroke();}
}
function frogBody(g,x,y,s,c1,c2,c3){ /* reusable frog: sitting, big eyes */
  soft(g,18,'rgba(0,0,0,0.3)');
  g.fillStyle=grad2(g,x,y,s,c1,c2);
  blob(g,[[x-s*0.95,y+s*0.35],[x-s*0.8,y-s*0.35],[x,y-s*0.72],[x+s*0.8,y-s*0.35],[x+s*0.95,y+s*0.35],[x,y+s*0.62]]);g.fill();
  unsoft(g);
  for(const sgn of [-1,1]){ /* legs */
    g.fillStyle=c2;
    blob(g,[[x+sgn*s*0.55,y+s*0.28],[x+sgn*s*1.12,y+s*0.28],[x+sgn*s*1.2,y+s*0.62],[x+sgn*s*0.5,y+s*0.6]]);g.fill();
    g.fillStyle=c1;
    for(let t=0;t<3;t++){g.beginPath();g.ellipse(x+sgn*(s*0.95+t*s*0.16),y+s*0.66,s*0.1,s*0.06,0,0,7);g.fill();}
    /* eye bumps */
    g.fillStyle=grad2(g,x+sgn*s*0.45,y-s*0.7,s*0.3,c1,c2);
    g.beginPath();g.arc(x+sgn*s*0.45,y-s*0.68,s*0.3,0,7);g.fill();
    eyeDot(g,x+sgn*s*0.45,y-s*0.7,s*0.17);
  }
  g.fillStyle=c3;
  blob(g,[[x-s*0.5,y+s*0.15],[x,y-s*0.05],[x+s*0.5,y+s*0.15],[x,y+s*0.52]]);g.fill();
  g.strokeStyle='rgba(20,40,20,0.5)';g.lineWidth=3;g.lineCap='round';
  g.beginPath();g.moveTo(x-s*0.3,y-s*0.18);g.quadraticCurveTo(x,y-s*0.02,x+s*0.3,y-s*0.18);g.stroke();
}

/* ================= 22 scenes ================= */
const SCENES=[
{id:'frog',name:'Sunset Singer',paint(g){
  srand(11);
  sky(g,[[0,'#ffd98f'],[0.45,'#ff9d5c'],[1,'#e56a4f']]);
  sun(g,650,180,64,'#fff3c0','rgba(255,220,140,0.55)');
  cloudBank(g,90,'rgba(255,230,190,0.5)',4);
  treeline(g,300,'#8a4d3f',8);
  water(g,330,[[0,'#e58a5c'],[0.4,'#b85c4e'],[1,'#6e3040']],'rgba(255,225,170,0.7)');
  reflection(g,650,420,120,26,'#ffe9b0');
  reeds(g,20,190,SH,9,'#5f3a34','#7a4a3c');
  lilyPad(g,450,520,150,'#4f7a3a');
  lilyPad(g,720,610,110,'#456e34');lilyPad(g,180,600,95,'#456e34');
  frogBody(g,450,430,95,'#8fce56','#4f8f30','#d8ecab');
}},
{id:'duck',name:'Duckling Parade',paint(g){
  srand(21);
  sky(g,[[0,'#aee3f5'],[1,'#e8f7fb']]);
  cloudBank(g,80,'rgba(255,255,255,0.85)',5);
  treeline(g,265,'#7fae6a',9);
  water(g,300,[[0,'#7ec8dd'],[1,'#3b7f9e']],'rgba(255,255,255,0.7)');
  const duck=(x,y,s,c1,c2)=>{
    soft(g,12,'rgba(0,40,60,0.3)');
    g.fillStyle=grad2(g,x,y,s,c1,c2);
    blob(g,[[x-s,y],[x-s*0.5,y-s*0.5],[x+s*0.4,y-s*0.42],[x+s,y+s*0.05],[x+s*0.6,y+s*0.4],[x-s*0.6,y+s*0.4]]);g.fill();
    g.beginPath();g.arc(x-s*0.75,y-s*0.65,s*0.42,0,7);g.fill();
    unsoft(g);
    g.fillStyle='#f0a51c';blob(g,[[x-s*1.15,y-s*0.7],[x-s*1.45,y-s*0.58],[x-s*1.12,y-s*0.48]]);g.fill();
    eyeDot(g,x-s*0.82,y-s*0.74,s*0.09);
    g.fillStyle=c2;g.beginPath();g.ellipse(x+s*0.1,y-s*0.05,s*0.5,s*0.3,-0.3,0,7);g.fill();
    reflection(g,x,y+s*0.72,s*1.1,s*0.2,'#fff');
  };
  duck(430,420,95,'#f5f2e4','#c9bf96');
  duck(620,505,42,'#ffe066','#e0a81c');duck(720,470,38,'#ffe066','#e0a81c');
  duck(250,505,40,'#ffe066','#e0a81c');duck(320,545,36,'#ffe066','#e0a81c');
  reeds(g,760,890,SH,8,'#3e7d4f','#2f6440');
}},
{id:'turtle',name:'Log Nappers',paint(g){
  srand(31);
  sky(g,[[0,'#bfe6c8'],[1,'#f2f7d8']]);
  sun(g,180,120,52,'#fffbe0','rgba(255,250,210,0.5)');
  treeline(g,250,'#6d9e58',10);
  water(g,290,[[0,'#87b98a'],[1,'#3c6b52']],'rgba(240,255,220,0.6)');
  g.fillStyle='#6b4a2a';
  blob(g,[[80,480],[440,430],[820,470],[830,520],[420,485],[90,530]]);g.fill();
  g.fillStyle='#553a20';g.beginPath();g.ellipse(120,500,40,26,0.3,0,7);g.fill();
  const shell=(x,y,s)=>{
    soft(g,12,'rgba(0,30,10,0.35)');
    g.fillStyle=grad2(g,x,y,s,'#7fae4a','#42622c');
    g.beginPath();g.ellipse(x,y,s,s*0.62,0,Math.PI,0);g.closePath();g.fill();unsoft(g);
    g.strokeStyle='rgba(30,50,20,0.5)';g.lineWidth=3;
    for(let k=-1;k<=1;k++){g.beginPath();g.moveTo(x+k*s*0.45,y);g.quadraticCurveTo(x+k*s*0.5,y-s*0.4,x+k*s*0.25,y-s*0.58);g.stroke();}
    g.fillStyle='#8fbe5a';g.beginPath();g.ellipse(x+s*1.05,y-s*0.1,s*0.32,s*0.24,0.2,0,7);g.fill();
    eyeDot(g,x+s*1.14,y-s*0.2,s*0.07);
  };
  shell(300,430,85);shell(520,415,65);shell(680,440,48);
  lilyPad(g,150,620,110,'#4f7a3a');lotus(g,150,600,46,'#ff9ec4','#ffd7e6');
}},
{id:'dragonfly',name:'Jewel Wings',paint(g){
  srand(41);
  sky(g,[[0,'#cfeef2'],[1,'#eef9e8']]);
  g.fillStyle='rgba(150,200,160,0.35)';g.beginPath();g.arc(700,520,260,0,7);g.fill();
  g.fillStyle='rgba(120,180,140,0.3)';g.beginPath();g.arc(150,560,220,0,7);g.fill();
  reeds(g,60,840,SH+40,14,'#4d8a54','#3a7044');
  g.strokeStyle='#3a7044';g.lineWidth=13;g.lineCap='round';
  g.beginPath();g.moveTo(430,SH);g.quadraticCurveTo(470,420,455,300);g.stroke();
  const x=455,y=290;
  for(const [a,l] of [[-2.5,150],[-2.1,175],[0.6,175],[1,150]]){
    g.fillStyle='rgba(190,230,250,0.55)';
    soft(g,8,'rgba(120,190,230,0.5)');

/* ================= save ================= */
let SV;
try{SV=JSON.parse(localStorage.getItem('pondpz')||'{}');}catch(e){SV={};}
SV.done=SV.done||{};
const save=()=>{try{localStorage.setItem('pondpz',JSON.stringify(SV));}catch(e){}};
const SIZES=[{n:6,c:3,r:2},{n:12,c:4,r:3},{n:24,c:6,r:4},{n:48,c:8,r:6}];

/* ================= sounds ================= */
let AC=null;
function audio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}
function blip(f,d,v,t){
  if(!AC)return;
  const o=AC.createOscillator(),gn=AC.createGain();
  o.type=t||'sine';o.frequency.value=f;
  gn.gain.setValueAtTime(v,AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
}
const sSnap=()=>{blip(520,0.09,0.2,'triangle');blip(780,0.14,0.12,'sine');};
const sWin=()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.3,0.18,'triangle'),i*130));};

/* ================= gallery ================= */
const fullCache={};
function fullScene(i){
  if(!fullCache[i]){
    const c=document.createElement('canvas');c.width=SW;c.height=SH;
    SCENES[i].paint(c.getContext('2d'));
    fullCache[i]=c;
  }
  return fullCache[i];
}
function stars(id){
  const d=SV.done[id]||{};
  let n=0;for(const s of SIZES)if(d[s.n])n++;
  return n;
}
function buildGallery(){
  const grid=$('#galGrid');
  grid.innerHTML='';
  SCENES.forEach((sc,i)=>{
    const card=document.createElement('div');card.className='gcard';
    const cv=document.createElement('canvas');cv.width=300;cv.height=225;
    const tg=cv.getContext('2d');tg.save();tg.scale(300/SW,225/SH);sc.paint(tg);tg.restore();
    const nm=document.createElement('div');nm.className='nm';
    const st=stars(sc.id);
    nm.innerHTML='<span>'+sc.name+'</span><span class="st">'+'★'.repeat(st)+'<span style="opacity:0.25">'+'★'.repeat(4-st)+'</span></span>';
    card.appendChild(cv);card.appendChild(nm);
    card.addEventListener('pointerup',()=>{audio();openSize(i);});
    grid.appendChild(card);
  });
}
let pick=0;
function openSize(i){pick=i;$('#szName').textContent=SCENES[i].name;$('#veil').classList.add('on');}
$('#sizeClose').addEventListener('click',()=>$('#veil').classList.remove('on'));
document.querySelectorAll('.sizeb').forEach(b=>b.addEventListener('click',()=>{
  $('#veil').classList.remove('on');audio();
  startPuzzle(pick,+b.dataset.n);
}));
$('#btnHome').addEventListener('click',()=>location.href='index.html');

/* ================= jigsaw ================= */
let CUR=null; /* {scene,size,placed,pieces} */
function edgePath(g,w,h,tabs,t){
  /* tabs: [top,right,bottom,left] each -1/0/1 ; path starts at 0,0 */
  const tab=(len,dir,horiz,flip)=>{
    /* draws one edge with classic tab using bezier segments; returns nothing */
    const m=len/2,s=t*dir;
    if(dir===0){g.lineTo(...pt(len,0));return;}
    g.lineTo(...pt(m-t*0.8,0));
    g.bezierCurveTo(...pt(m-t*0.28,0),...pt(m-t*1.05,-s*1.05),...pt(m,-s*1.05));
    g.bezierCurveTo(...pt(m+t*1.05,-s*1.05),...pt(m+t*0.28,0),...pt(m+t*0.8,0));
    g.lineTo(...pt(len,0));
  };
  let ox=0,oy=0,rot=0;
  const pt=(x,y)=>{ /* rotate local edge coords into path space */
    const c=Math.cos(rot),s=Math.sin(rot);
    return [ox+x*c-y*s,oy+x*s+y*c];
  };
  g.moveTo(0,0);
  rot=0;ox=0;oy=0;tab(w,tabs[0]);
  rot=Math.PI/2;ox=w;oy=0;tab(h,tabs[1]);
  rot=Math.PI;ox=w;oy=h;tab(w,tabs[2]);
  rot=-Math.PI/2;ox=0;oy=h;tab(h,tabs[3]);
  g.closePath();
}
function startPuzzle(sceneI,n){
  $('#scrGal').classList.remove('on');
  $('#scrPlay').classList.add('on');
  const sz=SIZES.find(s=>s.n===n);
  const wrap=$('#playWrap');
  const WW=wrap.clientWidth,WH=wrap.clientHeight;
  /* board sized to leave a tray margin */
  const bw=Math.min(WW*0.62,(WH*0.66)*(SW/SH));
  const bh=bw*(SH/SW);
  const bx=(WW-bw)/2,by=(WH-bh)/2-14;
  const board=$('#board'),ghost=$('#ghost');
  board.width=bw;board.height=bh;
  board.style.left=bx+'px';board.style.top=by+'px';
  const bg=board.getContext('2d');
  bg.fillStyle='#10333f';bg.fillRect(0,0,bw,bh);
  ghost.width=bw;ghost.height=bh;
  ghost.style.left=bx+'px';ghost.style.top=by+'px';
  ghost.getContext('2d').drawImage(fullScene(sceneI),0,0,bw,bh);
  ghost.style.display='block';
  /* piece geometry */
  const pw=bw/sz.c,ph=bh/sz.r,t=Math.min(pw,ph)*0.22;
  srand(sceneI*97+n*13+5);
  const Hm=[],Vm=[];
  for(let r=0;r<sz.r;r++){Hm[r]=[];for(let c=0;c<sz.c-1;c++)Hm[r][c]=rnd()>0.5?1:-1;}
  for(let r=0;r<sz.r-1;r++){Vm[r]=[];for(let c=0;c<sz.c;c++)Vm[r][c]=rnd()>0.5?1:-1;}
  /* clear old pieces */
  document.querySelectorAll('.piece').forEach(p=>p.remove());
  const img=fullScene(sceneI);
  const pieces=[];
  for(let r=0;r<sz.r;r++)for(let c=0;c<sz.c;c++){
    const tabs=[
      r===0?0:-Vm[r-1][c],
      c===sz.c-1?0:Hm[r][c],
      r===sz.r-1?0:Vm[r][c],
      c===0?0:-Hm[r][c-1]];
    const cv=document.createElement('canvas');
    cv.className='piece';
    cv.width=pw+t*2.4;cv.height=ph+t*2.4;
    const pg=cv.getContext('2d');
    pg.save();pg.translate(t*1.2,t*1.2);
    pg.beginPath();edgePath(pg,pw,ph,tabs,t);pg.clip();
    pg.drawImage(img,0,0,SW,SH,-c*pw,-r*ph,bw,bh);
    pg.restore();
    pg.save();pg.translate(t*1.2,t*1.2);
    pg.beginPath();edgePath(pg,pw,ph,tabs,t);
    pg.strokeStyle='rgba(0,0,0,0.35)';pg.lineWidth=2.5;pg.stroke();
    pg.strokeStyle='rgba(255,255,255,0.25)';pg.lineWidth=1;pg.stroke();
    pg.restore();
    /* scatter around edges of the play area */
    const side=(r*sz.c+c)%4;
    let sx2,sy2;
    if(side===0){sx2=rnd()*(bx-pw-30)+6;sy2=rnd()*(WH-ph-90)+50;}
    else if(side===1){sx2=bx+bw+24+rnd()*Math.max(20,WW-bx-bw-pw-40);sy2=rnd()*(WH-ph-90)+50;}
    else if(side===2){sx2=rnd()*(WW-pw-40)+20;sy2=Math.max(52,by-ph-26-rnd()*40);}
    else{sx2=rnd()*(WW-pw-40)+20;sy2=Math.min(WH-ph-14,by+bh+18+rnd()*50);}
    sx2=clamp(sx2,6,WW-cv.width-6);sy2=clamp(sy2,48,WH-cv.height-8);
    const P={cv,c,r,tx:bx+c*pw-t*1.2,ty:by+r*ph-t*1.2,locked:false};
    cv.style.left='0px';cv.style.top='0px';
    cv.style.transform='translate('+sx2+'px,'+sy2+'px)';
    P.x=sx2;P.y=sy2;
    wrap.appendChild(cv);
    pieces.push(P);
  }
  CUR={sceneI,size:sz,placed:0,pieces,bx,by,bw,bh};
  $('#prog').textContent='0 / '+sz.n;
  $('#winV').classList.remove('on');
}
let ZTOP=10,DRAG=null;
/* per-pixel piece grabbing: taps ignore transparent margins, topmost wins */
const wrapEl=$('#playWrap');
wrapEl.addEventListener('pointerdown',e=>{
  if(!CUR||DRAG)return;
  const cand=CUR.pieces
    .filter(P=>!P.locked&&e.clientX>=P.x&&e.clientX<P.x+P.cv.width&&e.clientY>=P.y&&e.clientY<P.y+P.cv.height)
    .sort((a,b)=>((+b.cv.style.zIndex)||0)-((+a.cv.style.zIndex)||0));
  for(const P of cand){
    const px=(e.clientX-P.x)|0,py=(e.clientY-P.y)|0;
    let a=255;
    try{a=P.cv.getContext('2d').getImageData(px,py,1,1).data[3];}catch(err){}
    if(a>12){
      DRAG={P,ox:e.clientX-P.x,oy:e.clientY-P.y};
      P.cv.style.zIndex=++ZTOP;
      audio();
      break;
    }
  }
});
wrapEl.addEventListener('pointermove',e=>{
  if(!DRAG)return;
  const P=DRAG.P;
  P.x=e.clientX-DRAG.ox;P.y=e.clientY-DRAG.oy;
  P.cv.style.transform='translate('+P.x+'px,'+P.y+'px)';
});
function wrapUp(){
  if(!DRAG)return;
  const P=DRAG.P;DRAG=null;
  const snapR=Math.max(26,(CUR.bw/CUR.size.c)*0.22);
  if(Math.hypot(P.x-P.tx,P.y-P.ty)<snapR){
    P.x=P.tx;P.y=P.ty;P.locked=true;
    P.cv.style.transform='translate('+P.x+'px,'+P.y+'px)';
    P.cv.classList.add('locked');
    P.cv.style.zIndex=3;
    sSnap();
    CUR.placed++;
    $('#prog').textContent=CUR.placed+' / '+CUR.size.n;
    if(CUR.placed>=CUR.size.n)winPuzzle();
  }
}
wrapEl.addEventListener('pointerup',wrapUp);
wrapEl.addEventListener('pointercancel',wrapUp);
function winPuzzle(){
  const sc=SCENES[CUR.sceneI];
  SV.done[sc.id]=SV.done[sc.id]||{};
  SV.done[sc.id][CUR.size.n]=1;
  save();
  sWin();
  confettiBurst();
  setTimeout(()=>{
    $('#winStars').innerHTML='★'.repeat(stars(sc.id))+'<span style="opacity:0.25">'+'★'.repeat(4-stars(sc.id))+'</span>';
    $('#winV').classList.add('on');
  },700);
}
function confettiBurst(){
  const cv=$('#confetti');
  cv.width=cv.clientWidth;cv.height=cv.clientHeight;
  const g=cv.getContext('2d');
  const parts=[];
  for(let i=0;i<120;i++)parts.push({
    x:cv.width/2+(Math.random()-0.5)*200,y:cv.height*0.45,
    vx:(Math.random()-0.5)*440,vy:-200-Math.random()*380,
    c:['#ffd23e','#ff9ec4','#4dc9f0','#7dd13f','#c9a8ff'][(Math.random()*5)|0],
    s:5+Math.random()*7,rot:Math.random()*7,t:0});
  let last=performance.now();
  const tick=now=>{
    const dt=Math.min(0.04,(now-last)/1000);last=now;
    g.clearRect(0,0,cv.width,cv.height);
    let alive=false;
    for(const p of parts){
      p.t+=dt;if(p.t>2.4)continue;alive=true;
      p.vy+=800*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*6;
      g.save();g.translate(p.x,p.y);g.rotate(p.rot);
      g.fillStyle=p.c;g.globalAlpha=Math.min(1,2.4-p.t);
      g.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);g.restore();
    }
    if(alive)requestAnimationFrame(tick);else g.clearRect(0,0,cv.width,cv.height);
  };
  requestAnimationFrame(tick);
}
$('#btnBack').addEventListener('click',()=>{
  document.querySelectorAll('.piece').forEach(p=>p.remove());
  $('#scrPlay').classList.remove('on');
  $('#scrGal').classList.add('on');
  buildGallery();
});
$('#btnEye').addEventListener('click',()=>{
  const gh=$('#ghost');
  gh.style.display=gh.style.display==='none'?'block':'none';
});
$('#btnShuf').addEventListener('click',()=>{if(CUR)startPuzzle(CUR.sceneI,CUR.size.n);});
$('#winBigger').addEventListener('click',()=>{
  $('#winV').classList.remove('on');
  const i=SIZES.findIndex(s=>s.n===CUR.size.n);
  startPuzzle(CUR.sceneI,SIZES[Math.min(SIZES.length-1,i+1)].n);
});
$('#winGal').addEventListener('click',()=>{$('#winV').classList.remove('on');$('#btnBack').click();});

buildGallery();
window.PZ={SCENES,startPuzzle,cur:()=>CUR}; /* playtest hooks */
