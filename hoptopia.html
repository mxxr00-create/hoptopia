];
function dayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dailyOrder(){
  const d=new Date();
  const n=(d.getFullYear()*373+d.getMonth()*31+d.getDate())%DAILY_ORDERS.length;
  return DAILY_ORDERS[n];
}
function dailyDone(){return SV.q2.daily===dayKey();}
function dailyCanHandIn(){
  const o=dailyOrder();
  return Object.keys(o.items).every(k=>invCount(k)>=o.items[k]);
}
function handInDaily(){
  const o=dailyOrder();
  if(!dailyCanHandIn()){toast('Still gathering — check the list!');sBad();return;}
  for(const k in o.items)SV.inv[k]-=o.items[k];
  SV.q2.daily=dayKey();
  addCoins(o.coins);save();sWin();
  openQuestBoard();
}
/* per-frame quest logic */
let QT=0;
function questTick(dt){
  QT-=dt;if(QT>0)return;QT=0.3;
  const h=todNow();
  /* hide & seek */
  if(q2get('s1')===1){
    const l=NPCS.find(n=>n.id==='lulu');
    if(l&&Math.hypot(l.x-P.x,l.z-P.z)<3){
      SV.q2.s1=0;SV.q2p.s1n=(SV.q2p.s1n||0)+1;
      addCoins(4);save();sWin();
      luluHome();
      toast('You found Lulu! ('+SV.q2p.s1n+' wins)');
      updateHUD();
    }
  }
  /* firefly jar */
  if(q2get('t1')===1&&NIGHTA>0.35){
    for(let i=PARTS.length-1;i>=0;i--){
      const p=PARTS[i];
      if(p.col==='#d8ff6e'&&Math.hypot(p.x-P.x,p.z-P.z)<1.4&&Math.abs(p.y-P.y-1)<2){
        PARTS.splice(i,1);
        SV.q2p.t1=(SV.q2p.t1||0)+1;sPick();
        popLabel('+1 firefly','');
        if(SV.q2p.t1>=5){SV.q2[ 't1'.trim() ]=2;addCoins(10);sWin();toast('Firefly jar full! Fern will love these.');}
        save();updateHUD();
        break;
      }
    }
  }
  /* treasure hunt waypoints */
  if(q2get('h1')===1){
    const st=SV.q2p.h1||0;
    if(st<HUNT_STEPS.length){
      const w=HUNT_STEPS[st];
      if(Math.hypot(P.x-w.x,P.z-w.z)<w.r){
        if(w.clue){SV.q2p.h1=st+1;save();sTalk();toast(w.clue);updateHUD();}
        else if(!CHEST){
          CHEST={x:w.x+1.5,y:walkGroundY(w.x+1.5,w.z+1.5),z:w.z+1.5};
          sPick();toast('Something glitters nearby…');
        }
      }
    }
    if(CHEST&&Math.hypot(CHEST.x-P.x,CHEST.z-P.z)<1.8){
      burst(CHEST.x,CHEST.y+0.6,CHEST.z,16,'#ffd23e',2.4,2.6,5,0.1);
      CHEST=null;
      const q=QDEFS.find(x=>x.id==='h1');
      SV.q2.h1=2;addCoins(q.coins);save();sWin();
      toast('TREASURE! +'+q.coins+' coins! Tell Captain Puddles!');
      updateHUD();
    }
  }
  /* the wiggly egg */
  if(q2get('pet1')===1){
    if(!EGG){const ex=COVE.x-5.5,ez=COVE.z-7.5;EGG={x:ex,y:walkGroundY(ex,ez),z:ez};}
    if(Math.hypot(EGG.x-P.x,EGG.z-P.z)<2.2){
      SV.q2.pet1=2;save();EGG=null;
      namePetModal();
    }
  }else if(EGG)EGG=null;
  /* SNAP + FISH button visibility */
  const ws=$('#wrapSnap');
  if(ws)ws.style.display=anyPhotoActive()&&!SHOP.active?'flex':'none';
  const wf=$('#wrapFish');
  if(wf)wf.style.display=(SV.tools.rod&&!SHOP.active&&!P.inWater&&(FISHING||castTargetWater()))?'flex':'none';
}

const QGLYPH={deliver:'→',photo:'◉',seek:'?',fireflies:'✦',dew:'❀',hunt:'✕',fetch:'✿',wear:'❖'};
function q2status(q){
  const st=q2get(q.id);
  if(q.type==='seek')return st===1?'She’s hiding — find her!':'Ask Lulu to play! ('+(SV.q2p.s1n||0)+' wins)';
  if(st===0)return 'See '+((NPCS.find(n=>n.id===q.giver)||{}).name||'?');
  if(st===2)return 'Done ✓';
  if(q.type==='deliver')return 'Deliver to '+((NPCS.find(n=>n.id===q.target)||{}).name||'?');
  if(q.type==='photo')return 'SNAP the shot!';
  if(q.type==='fireflies')return (SV.q2p.t1||0)+'/5 after dark';
  if(q.type==='dew')return (SV.q2p.t2||0)+'/4 at sunrise';
  if(q.type==='hunt')return 'Clue '+((SV.q2p.h1||0)+1)+' of 3';
  if(q.type==='egg')return 'Find the egg in the cove!';
  return 'In progress';
}

/* quest guidance: gathering quests point to an area; everything else is exact */
const QUEST_AREAS={berry:[0,0],reed:[0,0],shell:[0,0],mushroom:[0,0]};
QUEST_AREAS.berry=[GARDEN.x,GARDEN.z];
QUEST_AREAS.reed=[REED.x,REED.z-6];
QUEST_AREAS.shell=[BAY.x,BAY.z+8];
QUEST_AREAS.mushroom=[MOSS.x,MOSS.z];
function questTargets(){
  const t=[];let anyActive=false;
  for(const n of NPCS){
    if(!n.quest)continue;
    const st=SV.quests[n.id]||0;
    if(st!==1)continue;
    anyActive=true;
    if(n.quest.wear){
      const dressed=SV.outfit.hat!=='none'||SV.outfit.neck!=='none';
      if(dressed)t.push({x:n.x,z:n.z,k:'goal'});
      else{const p=NPCS.find(m=>m.id==='poppy');
        t.push({x:p?p.x:CITY.x+14,z:p?p.z:CITY.z+12,k:'goal'});}
    }else if(invCount(n.quest.item)>=n.quest.n)t.push({x:n.x,z:n.z,k:'goal'});
    else{const a=QUEST_AREAS[n.quest.item];
      if(a)t.push({x:a[0],z:a[1],k:'area',icon:n.quest.item});
      else t.push({x:n.x,z:n.z,k:'goal'});}
  }
  for(const q of QDEFS){
    if(q2get(q.id)!==1)continue;
    anyActive=true;
    if(q.type==='deliver'){
      const tn=NPCS.find(n=>n.id===q.target);
      if(tn)t.push({x:tn.x,z:tn.z,k:'goal'});
    }else if(q.id==='p2'){t.push({x:MINI.hop.fin[0],z:MINI.hop.fin[2],k:'area'});}
    else if(q.id==='p3'){t.push({x:BAY.x,z:BAY.z+6,k:'area'});}
    else if(q.type==='seek'){t.push({x:CITY.x,z:CITY.z,k:'area'});}
    else if(q.type==='dew'){t.push({x:GARDEN.x,z:GARDEN.z,k:'area',icon:'flower'});}
    else if(q.type==='egg'){t.push({x:COVE.x-5,z:COVE.z-7,k:'area'});}
    else if(q.type==='hunt'){
      const st=SV.q2p.h1||0;
      const w=HUNT_STEPS[Math.min(st,HUNT_STEPS.length-1)];
      t.push({x:w.x,z:w.z,k:'area'});
    }
  }
  if(!anyActive){ /* nothing accepted: nudge toward the nearest "!" critter */
    let best=null,bd=1e9;
    for(const n of NPCS)if(n.bang){const d=dist2(n.x,n.z,P.x,P.z);if(d<bd){bd=d;best=n;}}
    if(best)t.push({x:best.x,z:best.z,k:'avail'});
  }
  return t;
}
function heading(){return Math.atan2(-Math.sin(cam.yaw),Math.cos(cam.yaw));}
function angNorm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
const CARD=[[0,'N','#ffd23e'],[Math.PI/2,'E','#fff'],[Math.PI,'S','#fff'],[-Math.PI/2,'W','#fff']];
function drawCompass(){
  const c=CMP.ctx,Wc=CMP.el.width,Hc=CMP.el.height;
  c.clearRect(0,0,Wc,Hc);
  const h=heading(),half=Math.PI/3,px=ang=>Wc/2+(ang/half)*(Wc/2-30);
  /* ticks + cardinals */
  c.textAlign='center';c.textBaseline='middle';
  for(let k=0;k<24;k++){
    const ang=k*Math.PI/12,d=angNorm(ang-h);
    if(Math.abs(d)>half)continue;
    const x=px(d);
    if(k%6===0)continue; /* cardinal spots get letters */
    c.fillStyle='rgba(255,255,255,.4)';
    c.fillRect(x-1.5,k%3===0?26:32,3,k%3===0?28:16);
  }
  for(const cd of CARD){
    const d=angNorm(cd[0]-h);
    if(Math.abs(d)>half)continue;
    c.fillStyle=cd[2];
    c.font='900 30px -apple-system,system-ui,sans-serif';
    c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=4;
    c.fillText(cd[1],px(d),Hc/2);
    c.shadowBlur=0;
  }
  /* center notch */
  c.fillStyle='#ffffff';
  c.beginPath();c.moveTo(Wc/2-7,4);c.lineTo(Wc/2+7,4);c.lineTo(Wc/2,14);c.closePath();c.fill();
  /* quest markers */
  for(const m of questTargets()){
    const ang=Math.atan2(m.x-P.x,-(m.z-P.z));
    let d=angNorm(ang-h);
    const off=Math.abs(d)>half;
    d=clamp(d,-half,half);
    const x=px(d);
    c.globalAlpha=off?0.55:1;
    if(m.k==='area'){
      c.strokeStyle='#8fe05a';c.lineWidth=5;
      c.beginPath();c.arc(x,Hc/2+8,13,0,Math.PI*2);c.stroke();
      const im=ICONIMG[m.icon];
      if(im&&im.complete)c.drawImage(im,x-11,Hc/2-3,22,22);
    }else if(m.k==='goal'){
      c.fillStyle='#ff6f61';c.strokeStyle='#fff';c.lineWidth=3;
      c.beginPath();c.moveTo(x,Hc/2-6);c.lineTo(x+12,Hc/2+8);c.lineTo(x,Hc/2+22);c.lineTo(x-12,Hc/2+8);
      c.closePath();c.fill();c.stroke();
      if(!off){
        const dist=Math.round(Math.hypot(m.x-P.x,m.z-P.z));
        c.fillStyle='#fff';c.font='800 17px -apple-system,system-ui,sans-serif';
        c.fillText(dist,x,Hc-9);
      }
    }else{ /* available quest */
      c.fillStyle='#ffd23e';c.font='900 30px -apple-system,system-ui,sans-serif';
      c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=4;
      c.fillText('!',x,Hc/2+6);c.shadowBlur=0;
    }
    c.globalAlpha=1;
  }
}
function drawMini(){
  if(!MMAP.base)return;
  const S=MMAP.big?580:264;
  if(MMAP.el.width!==S){MMAP.el.width=S;MMAP.el.height=S;}
  const c=MMAP.ctx,k=S/W;
  c.imageSmoothingEnabled=false;
  c.drawImage(MMAP.base,0,0,S,S);
  /* quest + available markers */
  for(const n of NPCS){
    if(n.bang){c.fillStyle='#ffd23e';c.strokeStyle='#7a5a00';c.lineWidth=2;
      c.beginPath();c.arc(n.x*k,n.z*k,MMAP.big?7:5,0,Math.PI*2);c.fill();c.stroke();}
  }
  for(const m of questTargets()){
    if(m.k==='area'){c.strokeStyle='#8fe05a';c.lineWidth=3;
      c.beginPath();c.arc(m.x*k,m.z*k,MMAP.big?18:10,0,Math.PI*2);c.stroke();}
    else if(m.k==='goal'){c.fillStyle='#ff6f61';c.strokeStyle='#fff';c.lineWidth=2;
      const x=m.x*k,z=m.z*k,r=MMAP.big?9:6;
      c.beginPath();c.moveTo(x,z-r);c.lineTo(x+r,z);c.lineTo(x,z+r);c.lineTo(x-r,z);
      c.closePath();c.fill();c.stroke();}
  }
  /* friends */
  for(const r of REMOTES.values()){
    c.fillStyle='#4dd2ff';c.strokeStyle='#fff';c.lineWidth=2;
    c.beginPath();c.arc(r.x*k,r.z*k,MMAP.big?6:4,0,Math.PI*2);c.fill();c.stroke();
  }
  /* player arrow (map stays north-up; the arrow rotates) */
  c.save();
  c.translate(P.x*k,P.z*k);
  c.rotate(heading());
  c.fillStyle='#ffffff';c.strokeStyle='#2f6e18';c.lineWidth=2.5;
  const a=MMAP.big?12:8;
  c.beginPath();c.moveTo(0,-a);c.lineTo(a*0.7,a);c.lineTo(0,a*0.45);c.lineTo(-a*0.7,a);
  c.closePath();c.fill();c.stroke();
  c.restore();
}

  return h>=5.5&&h<9.5?'morning':h>=9.5&&h<16.5?'day':h>=16.5&&h<20.5?'evening':'night';}
function rng32(seed){let st=seed|0;return()=>{st=st+0x6D2B79F5|0;
  let t=Math.imul(st^st>>>15,1|st);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function scaleAt(tr,k){const m=tr.maj?MODE_MAJ:MODE_MIN;
  return tr.root+m[((k%7)+7)%7]+12*Math.floor(k/7);}
const mFreq=m=>440*Math.pow(2,(m-69)/12);
function genMotif(tr){
  const r=rng32(tr.seed);
  const pent=tr.maj?[0,2,4,7,9]:[0,3,5,7,10];
  const map=new Array(32).fill(null);
  let deg=2+Math.floor(r()*2),step=0;
  const den=tr.leadDen||0.45;
  while(step<32){
    const strong=step%8===0;
    if(r()<(strong?den+0.35:den)){
      const mv=r();
      deg+=mv<0.4?1:mv<0.8?-1:(r()<0.5?2:-2);
      deg=clamp(deg,0,7);
      const len=tr.style==='chip'?(r()<0.6?1:2):(r()<0.5?2:(r()<0.8?4:6));
      map[step]={semi:pent[deg%5]+12*Math.floor(deg/5),len};
      step+=len;
    }else step+=tr.style==='chip'?1:2;
  }
  return map;
}
function musEnsure(){
  if(MUS.bus)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  MUS.bus=actx.createGain();MUS.bus.gain.value=MUS.vol;MUS.bus.connect(actx.destination);
  /* generated hall reverb */
  const len=Math.floor(actx.sampleRate*2.4);
  const imp=actx.createBuffer(2,len,actx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=imp.getChannelData(ch);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  MUS.verb=actx.createConvolver();MUS.verb.buffer=imp;
  MUS.verbIn=actx.createGain();MUS.verbIn.gain.value=1;
  MUS.verbIn.connect(MUS.verb);MUS.verb.connect(MUS.bus);
  /* tempo-synced feedback echo */
  MUS.delay=actx.createDelay(1.2);
  const fb=actx.createGain();fb.gain.value=0.32;
  const dLP=actx.createBiquadFilter();dLP.type='lowpass';dLP.frequency.value=2600;
  MUS.delay.connect(dLP);dLP.connect(fb);fb.connect(MUS.delay);
  MUS.delayIn=actx.createGain();MUS.delayIn.connect(MUS.delay);dLP.connect(MUS.bus);
  /* shared noise buffer for percussion */
  const nb=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);
  const nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  MUS.noiseBuf=nb;
}
function mOsc(type,midi,t0,dur,g,dest,det,slideTo){
  const o=actx.createOscillator(),ga=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(mFreq(midi),t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(mFreq(slideTo),t0+dur);
  if(det)o.detune.value=det;
  ga.gain.setValueAtTime(0.0001,t0);
  ga.gain.linearRampToValueAtTime(g,t0+Math.min(0.03,dur*0.25));
  ga.gain.setValueAtTime(g,t0+dur*0.65);
  ga.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(ga);ga.connect(dest);
  o.start(t0);o.stop(t0+dur+0.05);
}
function mPad(midi,t0,dur,g,dest){
  const f=actx.createBiquadFilter();f.type='lowpass';f.Q.value=0.8;
  f.frequency.setValueAtTime(500,t0);
  f.frequency.linearRampToValueAtTime(1900,t0+dur*0.55);
  f.frequency.linearRampToValueAtTime(700,t0+dur);
  const ga=actx.createGain();
  ga.gain.setValueAtTime(0.0001,t0);
  ga.gain.linearRampToValueAtTime(g,t0+dur*0.3);
  ga.gain.setValueAtTime(g,t0+dur*0.75);
  ga.gain.linearRampToValueAtTime(0.0001,t0+dur+0.7);
  for(const det of [-6,6]){
    const o=actx.createOscillator();o.type='sawtooth';
    o.frequency.value=mFreq(midi);o.detune.value=det;
    o.connect(f);o.start(t0);o.stop(t0+dur+0.8);
  }
  f.connect(ga);ga.connect(dest);
}
function mHit(t0,dur,g,fLo,fHi,dest){
  const src=actx.createBufferSource();src.buffer=MUS.noiseBuf;
  src.loop=true;src.loopStart=Math.random();
  const f=actx.createBiquadFilter();f.type='bandpass';
  f.frequency.value=(fLo+fHi)/2;f.Q.value=0.7;
  const ga=actx.createGain();
  ga.gain.setValueAtTime(g,t0);
  ga.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f);f.connect(ga);ga.connect(dest);
  src.start(t0);src.stop(t0+dur+0.02);
}
function mKick(t0,g,dest){
  const o=actx.createOscillator(),ga=actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(110,t0);
  o.frequency.exponentialRampToValueAtTime(42,t0+0.1);
  ga.gain.setValueAtTime(g,t0);
  ga.gain.exponentialRampToValueAtTime(0.0001,t0+0.14);
  o.connect(ga);ga.connect(dest);o.start(t0);o.stop(t0+0.16);
}
function musSetTrack(tr,tStart){
  if(MUS.tg){ /* fade the previous track; its reverb tail rings out */
    const old=MUS.tg;
    old.gain.setValueAtTime(old.gain.value,tStart);
    old.gain.linearRampToValueAtTime(0,tStart+2.2);
    setTimeout(()=>{try{old.disconnect();}catch(e){}},5000);
  }
  MUS.tr=tr;MUS.lastId=tr.id;
  MUS.spb=60/tr.bpm/4;
  MUS.motif=genMotif(tr);
  MUS.step=0;
  MUS.tg=actx.createGain();
  MUS.tg.gain.setValueAtTime(0,tStart);
  MUS.tg.gain.linearRampToValueAtTime(1,tStart+1.6);
  MUS.tg.connect(MUS.bus);
  MUS.dryOut=actx.createGain();MUS.dryOut.connect(MUS.tg);
  MUS.padOut=actx.createGain();MUS.padOut.connect(MUS.tg);
  MUS.leadOut=actx.createGain();MUS.leadOut.connect(MUS.tg);
  const vSend=actx.createGain(),dSend=actx.createGain();
  vSend.gain.value=tr.style==='wave'?0.45:0.14;
  dSend.gain.value=tr.style==='wave'?0.4:0.22;
  MUS.padOut.connect(vSend);MUS.leadOut.connect(vSend);vSend.connect(MUS.verbIn);
  MUS.leadOut.connect(dSend);dSend.connect(MUS.delayIn);
  MUS.delay.delayTime.setValueAtTime(MUS.spb*3,tStart);
}
function musPickNext(){
  const part=musDaypart();
  let pool=TRACKS.filter(t=>t.when.indexOf(part)>=0&&t.id!==MUS.lastId);
  if(!pool.length)pool=TRACKS.filter(t=>t.when.indexOf(part)>=0);
  return pool[Math.floor(Math.random()*pool.length)];
}
const TRACK_BARS=40;
function musSched(g,t0){
  const tr=MUS.tr,spb=MUS.spb,bar=Math.floor(g/16),st=g%16;
  const deg=tr.prog[bar%tr.prog.length];
  const cRoot=scaleAt(tr,deg);
  const chord=[cRoot,scaleAt(tr,deg+2),scaleAt(tr,deg+4)];
  if(tr.style==='wave'){
    if(st===0){
      const dur=spb*16;
      mPad(chord[0]+12,t0,dur,0.055,MUS.padOut);
      mPad(chord[1]+12,t0,dur,0.045,MUS.padOut);
      mPad(chord[2]+12,t0,dur,0.045,MUS.padOut);
      if(bar%2===1)mPad(scaleAt(tr,deg+6)+12,t0,dur,0.03,MUS.padOut);
    }
    if(st===0||st===8)
      mOsc('sine',cRoot-12,t0,spb*7.6,0.1,MUS.dryOut);
    if(bar%4===3&&st===12)
      mOsc('sine',chord[2]-12,t0,spb*3.6,0.08,MUS.dryOut);
    const ev=MUS.motif[g%32];
    if(ev)mOsc('triangle',cRoot+12+ev.semi,t0,spb*ev.len*0.92,0.05,MUS.leadOut);
    if((g*2654435761>>>13)%100<8)
      mOsc('sine',cRoot+36+[0,2,4,7,9][(g>>2)%5],t0,spb*1.6,0.016,MUS.leadOut);
    if(tr.drums){
      if(st===0||st===8)mKick(t0,0.1,MUS.dryOut);
      if(st===2||st===6||st===10||st===14)mHit(t0,0.05,0.012,6000,9000,MUS.dryOut);
    }
  }else{ /* chip */
    const ev=MUS.motif[g%32];
    if(ev)mOsc(tr.soft?'triangle':'square',cRoot+12+ev.semi,t0,spb*ev.len*0.85,tr.soft?0.07:0.055,MUS.leadOut);
    if(st%4===0){
      const bp=[0,7,12,7][(st/4)|0];
      mOsc('triangle',cRoot-12+bp,t0,spb*1.6,0.1,MUS.dryOut);
    }
    if(!tr.soft&&st%2===1)
      mOsc('triangle',chord[(st>>1)%3]+24,t0,spb*0.8,0.024,MUS.leadOut);
    if(tr.drums){
      if(st===0||(st===10&&bar%2===1))mKick(t0,0.09,MUS.dryOut);
      if(st===4||st===12)mHit(t0,0.07,0.035,3000,6500,MUS.dryOut);
      if(st%2===0)mHit(t0,0.03,0.008,8000,11000,MUS.dryOut);
    }
  }
}
function musTick(){
  if(!MUS.playing||!actx)return;
  const ahead=actx.currentTime+0.35;
  while(MUS.nextT<ahead){
    if(MUS.step>=TRACK_BARS*16){
      musSetTrack(musPickNext(),MUS.nextT);
    }
    musSched(MUS.step,MUS.nextT);
    MUS.step++;
    MUS.nextT+=MUS.spb;
  }
}
function musStart(){
  musEnsure();
  if(!MUS.bus||MUS.playing)return;
  try{if(actx.state==='suspended')actx.resume();}catch(e){}
  MUS.playing=true;
  musSetTrack(musPickNext(),actx.currentTime+0.1);
  MUS.nextT=actx.currentTime+0.15;
  MUS.timer=setInterval(musTick,90);
}
function musStop(){
  MUS.playing=false;
  if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null;}
  if(MUS.tg){const old=MUS.tg;
    try{old.gain.linearRampToValueAtTime(0,actx.currentTime+1);}catch(e){}
    setTimeout(()=>{try{old.disconnect();}catch(e){}},2500);
    MUS.tg=null;}
}
function musKick(){if(SV.music&&!MUS.playing)musStart();}
document.addEventListener('visibilitychange',()=>{
  if(!MUS.bus)return;
  try{
    if(document.hidden)MUS.bus.gain.setValueAtTime(0,actx.currentTime);
    else MUS.bus.gain.setValueAtTime(MUS.playing?MUS.vol:0,actx.currentTime);
  }catch(e){}
});

/* let the loading screen paint, then build the world */
setTimeout(boot,60);
</script>
