<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#79c7f0">
<title>HOPTOPIA — Lilypad OS</title>
<style>
/* ============================================================
   HOPTOPIA — a blocky pond sandbox for the Lilypad tablet.
   Explore biomes, scavenge, meet critters, then build your own
   games on Maker Isle. Single file, no dependencies.
   ============================================================ */
:root{
  --ink:#1a2a3a; --sun:#ffd23e; --lily:#57c23a; --grape:#6a2fb0; --coral:#ff6f61;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Nunito,"Baloo 2",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;position:fixed;inset:0;overflow:hidden;background:#79c7f0;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;}
#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
#ui button{pointer-events:auto;font-family:inherit;}

/* ---- top bar ---- */
#topbar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
  right:calc(10px + env(safe-area-inset-right));display:flex;gap:8px;align-items:flex-start;z-index:5;}
.chip{display:inline-flex;align-items:center;gap:.4em;font-weight:900;color:#fff;border:none;
  border-radius:1em;padding:.38em .8em;font-size:clamp(13px,2.6vmin,19px);
  box-shadow:0 4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3);white-space:nowrap;}
.chip img{width:1.3em;height:1.3em;image-rendering:pixelated;}
.chip svg{width:1.15em;height:1.15em;}
#chipCoins{background:linear-gradient(160deg,#ffe066,#f0a51c);color:#5a3a00;}
#chipObj{background:rgba(20,50,80,.55);font-weight:800;font-size:clamp(11px,2.2vmin,16px);
  position:absolute;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top));
  max-width:56%;white-space:normal;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.35);text-align:center;}
#compass{position:absolute;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));
  width:min(44%,430px);height:40px;border-radius:20px;background:rgba(16,45,75,.55);
  box-shadow:0 4px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.18);z-index:5;pointer-events:none;}
#mini{position:absolute;right:calc(104px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
  width:132px;height:132px;border-radius:16px;border:3px solid rgba(255,255,255,.6);
  box-shadow:0 8px 20px rgba(0,20,50,.35);z-index:4;pointer-events:auto;opacity:.93;
  transition:width .2s,height .2s;background:#1f8ace;}
#mini.big{width:290px;height:290px;}
#btnInv{background:linear-gradient(160deg,#9b6bff,#6a2fb0);}
#btnPause{background:rgba(20,50,80,.55);margin-left:auto;}
#chipObj .mx{margin-left:.4em;opacity:.8;font-weight:900;}

/* ---- virtual joystick ---- */
#joy{position:absolute;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.16);
  border:2px solid rgba(255,255,255,.5);display:none;pointer-events:none;z-index:4;}
#joyn{position:absolute;width:54px;height:54px;border-radius:50%;left:33px;top:33px;
  background:radial-gradient(circle at 35% 30%,#fff,#cfe9f8);box-shadow:0 3px 8px rgba(0,40,80,.35);}

/* ---- action buttons: HOP dead-center on the right edge, others below ---- */
#abtns{position:absolute;right:calc(10px + env(safe-area-inset-right));top:50%;
  transform:translateY(-43px); /* HOP's center sits at the exact vertical middle */
  display:flex;flex-direction:column;align-items:center;gap:10px;z-index:5;}
.actwrap{display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;}
.act{width:62px;height:62px;border-radius:50%;border:none;font-weight:900;color:#fff;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35);
  display:grid;place-items:center;transition:transform .08s,opacity .3s;pointer-events:auto;}
.act:active{transform:scale(.92);}
.act svg{width:52%;height:52%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.alabel{font-size:10px;font-weight:900;color:#fff;letter-spacing:1.2px;
  text-shadow:0 1px 3px rgba(0,30,60,.65);transition:opacity .3s;}
#abtns.dim .act{opacity:.75;}
#abtns.dim .alabel{opacity:.15;}
#btnA{width:86px;height:86px;background:linear-gradient(160deg,#7dd13f,#4f9e23);}
#btnB{background:linear-gradient(160deg,#4dd2ff,#1f8fd0);}
#wrapM{display:none;}
#btnM{background:linear-gradient(160deg,#ff9a4d,#ef6b2a);}
#btnM.on{outline:4px solid var(--sun);outline-offset:2px;}
#btnSnap{background:linear-gradient(160deg,#b48cff,#6a2fb0);}
#btnFish{background:linear-gradient(160deg,#43cea2,#1e8a68);}
.dexunk{filter:brightness(0) opacity(0.3);}

/* ---- maker palette drawer ---- */
#palette{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  display:none;gap:8px;max-width:min(94%,700px);overflow-x:auto;padding:9px;z-index:6;
  background:rgba(16,45,75,.62);border-radius:16px;pointer-events:auto;backdrop-filter:blur(3px);}
#palette::-webkit-scrollbar{height:0;}
.pal{flex:none;width:76px;border:none;border-radius:12px;background:#fff;padding:7px 4px 6px;cursor:pointer;
  font-weight:800;font-size:10px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;}
.pal img{width:34px;height:34px;image-rendering:pixelated;}
.pal.sel{outline:3px solid var(--sun);}
.pal .cost{color:#b06a00;display:inline-flex;align-items:center;gap:2px;}
.pal .cost img{width:11px;height:11px;}
.pal.locked{opacity:.55;}
.pal.tool{background:linear-gradient(180deg,#ffe9d2,#ffd9b0);}

/* ---- dialog ---- */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
  width:min(92%,620px);background:rgba(255,255,255,.97);border-radius:18px;padding:12px 16px;
  box-shadow:0 12px 30px rgba(0,30,60,.4);display:none;pointer-events:auto;z-index:8;cursor:pointer;}
#dialog .dhead{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
#dlgAv{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:inset 0 -4px 8px rgba(0,0,0,.15);}
#dlgName{font-weight:900;color:var(--grape);font-size:clamp(14px,2.8vmin,19px);}
#dlgText{font-weight:700;color:var(--ink);font-size:clamp(13px,2.7vmin,18px);line-height:1.3;min-height:2.4em;}
#dlgBtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
#dlgBtns:empty{display:none;}
#dlgMore{float:right;color:#8aa;font-weight:900;font-size:12px;margin-top:4px;}
.dbtn{border:none;cursor:pointer;background:linear-gradient(160deg,#7dd13f,#4f9e23);color:#fff;font-weight:900;
  border-radius:1em;padding:.5em 1.1em;font-size:clamp(12px,2.5vmin,16px);box-shadow:0 3px 0 rgba(0,0,0,.2);}
.dbtn.alt{background:linear-gradient(160deg,#b6c3d0,#8295a4);}

/* ---- modal ---- */
#modal{position:absolute;inset:0;background:rgba(8,35,65,.5);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:20;padding:12px;}
.card{background:linear-gradient(180deg,#ffffff,#e6f4ff);border-radius:24px;padding:20px 22px;
  width:min(96%,560px);max-height:88%;overflow:auto;text-align:center;color:var(--ink);
  box-shadow:0 20px 50px rgba(0,20,50,.5);-webkit-overflow-scrolling:touch;}
.card::-webkit-scrollbar{width:0;}
.card h1{margin:.1em 0 .2em;font-size:clamp(24px,6vmin,42px);font-weight:900;color:#2f8b22;}
.card h2{margin:.1em 0 .3em;font-size:clamp(18px,4.4vmin,30px);font-weight:900;color:var(--grape);}
.card p{margin:.3em 0;font-weight:700;line-height:1.35;font-size:clamp(13px,2.7vmin,17px);}
.card p.dim{opacity:.7;font-size:clamp(11px,2.3vmin,14px);}
.bigb{display:block;width:100%;border:none;cursor:pointer;margin:10px 0 0;color:#fff;font-weight:900;
  border-radius:1.2em;padding:.7em 1em;font-size:clamp(15px,3.4vmin,22px);font-family:inherit;
  background:linear-gradient(160deg,#7dd13f,#4f9e23);box-shadow:0 5px 0 #3a7a18;transition:transform .08s;}
.bigb:active{transform:translateY(3px);box-shadow:0 2px 0 #3a7a18;}
.bigb.blue{background:linear-gradient(160deg,#4dd2ff,#1f8fd0);box-shadow:0 5px 0 #14639a;}
.bigb.purple{background:linear-gradient(160deg,#9b6bff,#6a2fb0);box-shadow:0 5px 0 #4c1d86;}
.bigb.gray{background:linear-gradient(160deg,#b6c3d0,#8295a4);box-shadow:0 5px 0 #5b6b7a;}
.bigb.red{background:linear-gradient(160deg,#ff8a7a,#e04a3a);box-shadow:0 5px 0 #a03028;}
.critgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px;}
.crit{border:3px solid transparent;border-radius:16px;background:#fff;cursor:pointer;padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:12px;color:var(--ink);
  box-shadow:0 4px 10px rgba(0,40,70,.15);}
.crit.sel{border-color:var(--sun);background:#fffbe8;}
.crit svg{width:56px;height:56px;}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px;}
.invcell{background:#fff;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;
  gap:2px;font-weight:800;font-size:11px;color:var(--ink);box-shadow:0 3px 8px rgba(0,40,70,.12);}
.invcell img{width:30px;height:30px;image-rendering:pixelated;}
.invcell b{font-size:15px;}
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.modecard{border:3px solid transparent;border-radius:18px;cursor:pointer;padding:14px 10px;text-align:center;
  font-weight:800;color:#fff;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 6px 14px rgba(0,40,70,.25);}
.modecard h3{margin:0;font-size:clamp(15px,3.2vmin,20px);}
.modecard p{margin:0;font-size:clamp(11px,2.2vmin,13px);font-weight:700;opacity:.95;}
.modecard.explore{background:linear-gradient(160deg,#43cea2,#185a9d);}
.modecard.maker{background:linear-gradient(160deg,#ff9a4d,#d63b86);}
.modecard svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ---- boutique: mannequin + item cards ---- */
.shopwrap{display:flex;gap:12px;align-items:flex-start;margin-top:8px;}
.manq{flex:none;width:134px;background:linear-gradient(180deg,#fff6e6,#f0dfc0);border-radius:14px;
  padding:8px 4px 6px;box-shadow:0 3px 8px rgba(0,40,70,.15);}
.manq svg{width:112px;height:142px;}
.manq p{margin:2px 0 0;font-size:10.5px;}
.shopgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.shopcard{background:#fff;border-radius:12px;padding:6px 4px 5px;cursor:pointer;
  border:3px solid transparent;box-shadow:0 3px 8px rgba(0,40,70,.12);}
.shopcard.sel{border-color:var(--sun);background:#fffbe8;}
.shopcard svg{width:100%;height:46px;}
.shopname{font-weight:800;font-size:10.5px;color:var(--ink);line-height:1.1;}
.shopprice{font-weight:900;font-size:10px;color:#b06a00;margin-top:2px;min-height:12px;}
.shopprice img{width:11px;height:11px;vertical-align:-2px;image-rendering:pixelated;}
.shopprice .worn{color:#2f8b22;}
.dic{width:1.15em;height:1.15em;vertical-align:-0.22em;image-rendering:pixelated;}

/* ---- shop scene: fixed camera, menu panel on the left 2/3 ---- */
#shoppanel{position:absolute;left:calc(10px + env(safe-area-inset-left));
  top:calc(56px + env(safe-area-inset-top));bottom:calc(12px + env(safe-area-inset-bottom));
  width:min(64%,640px);background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(230,244,255,.96));
  border-radius:20px;padding:14px 14px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:none;pointer-events:auto;z-index:7;box-shadow:0 16px 40px rgba(0,20,50,.4);color:var(--ink);}
#shoppanel::-webkit-scrollbar{width:0;}
#shoppanel h2{margin:0 0 2px;font-size:clamp(17px,3.8vmin,26px);font-weight:900;color:var(--grape);}
#shoppanel .speech2{font-weight:700;font-size:12.5px;opacity:.8;margin:0 0 6px;}
#shoppanel .shopgrid{grid-template-columns:repeat(4,1fr);margin-top:8px;}
#shoppanel .actrow{display:flex;gap:8px;margin-top:10px;}
#shoppanel .actrow .bigb{margin:0;flex:1;padding:.55em .6em;font-size:clamp(13px,2.8vmin,17px);}

/* ---- toast + point pops ---- */
#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%) translateY(-8px);z-index:30;
  background:rgba(20,40,60,.92);color:#fff;font-weight:800;padding:.55em 1.2em;border-radius:1.4em;
  font-size:clamp(12px,2.6vmin,17px);opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.pop{position:absolute;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.45);pointer-events:none;
  font-size:clamp(14px,3vmin,20px);z-index:10;display:flex;align-items:center;gap:4px;}
.pop img{width:1.2em;height:1.2em;image-rendering:pixelated;}

/* ---- multiplayer: nametags, emotes, session UI ---- */
#tags{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden;}
.tag{position:absolute;transform:translate(-50%,-100%);background:rgba(16,45,75,.72);color:#fff;
  font-weight:800;font-size:12px;padding:3px 10px;border-radius:12px;white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.3);transition:opacity .2s;}
.tag.em{background:#fff;color:var(--ink);font-size:15px;font-weight:900;box-shadow:0 4px 10px rgba(0,30,60,.3);}
#emotebar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  display:none;gap:8px;padding:9px;background:rgba(16,45,75,.62);border-radius:16px;z-index:6;
  pointer-events:auto;max-width:94%;overflow-x:auto;backdrop-filter:blur(3px);}
.emo{flex:none;border:none;border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;
  font-weight:900;font-size:14px;padding:10px 14px;}
#wrapSay{display:none;}
#btnSay{background:linear-gradient(160deg,#ffd23e,#f0a51c);}
#chipMP{background:linear-gradient(160deg,#46d6a0,#0c8f63);display:none;}
.mprow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 10px;
  margin-top:8px;font-weight:800;color:var(--ink);box-shadow:0 3px 8px rgba(0,40,70,.12);}
.mprow .who{flex:1;text-align:left;font-size:14px;}
.mprow button{border:none;border-radius:10px;padding:6px 12px;font-weight:900;cursor:pointer;color:#fff;
  background:linear-gradient(160deg,#ff8a7a,#e04a3a);font-size:12px;}
.mpcode{font-size:clamp(22px,5vmin,34px);font-weight:900;letter-spacing:2px;color:#2f8b22;
  background:#eaffe0;border-radius:14px;padding:10px 14px;margin:8px 0;user-select:text;-webkit-user-select:text;}
.mptog{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;
  padding:10px 12px;margin-top:8px;font-weight:800;color:var(--ink);box-shadow:0 3px 8px rgba(0,40,70,.12);}
.mptog .toggle2{width:52px;height:30px;border-radius:15px;background:#c3cdd6;position:relative;cursor:pointer;transition:background .2s;flex:none;}
.mptog .toggle2.on{background:#7dd13f;}
.mptog .toggle2 b{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.25);}
.mptog .toggle2.on b{left:25px;}
#codein{width:100%;border:3px solid #b6d9f0;border-radius:14px;padding:.6em .8em;font-size:clamp(16px,4vmin,24px);
  font-weight:900;text-align:center;letter-spacing:2px;text-transform:uppercase;color:var(--ink);font-family:inherit;
  -webkit-user-select:text;user-select:text;}

/* ---- loading ---- */
#loading{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:linear-gradient(180deg,#8fd0f5,#57b7ea);color:#fff;font-weight:900;}
#loading .t{font-size:clamp(16px,4vmin,26px);text-shadow:0 2px 4px rgba(0,40,80,.3);}
#loading .frogload{width:90px;height:90px;animation:bounce 1s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-22px) scale(.95,1.05)}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="topbar">
    <span class="chip" id="chipCoins"><img alt=""><b id="coinN">0</b></span>
    <button class="chip" id="btnInv"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 12h-11z"/><path d="M8 8a4 4 0 0 1 8 0"/></svg> Bag</button>
    <span class="chip" id="chipObj"></span>
    <button class="chip" id="chipMP"></button>
    <button class="chip" id="btnPause"><svg viewBox="0 0 24 24" fill="#fff" stroke="none"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg></button>
  </div>
  <canvas id="compass"></canvas>
  <canvas id="mini"></canvas>
  <div id="tags"></div>
  <div id="emotebar"></div>
  <div id="shoppanel"></div>
  <div id="joy"><div id="joyn"></div></div>
  <div id="abtns">
    <div class="actwrap" id="wrapFish" style="display:none">
      <button class="act" id="btnFish" aria-label="Fish"><svg viewBox="0 0 24 24"><path d="M4 4c6 0 8 5 8 9a4 4 0 0 1-8 0"/><path d="M12 13c0 4 3 7 7 7"/><circle cx="19" cy="20" r="1.6" fill="#fff" stroke="none"/></svg></button>
      <span class="alabel">FISH</span>
    </div>
    <div class="actwrap" id="wrapSnap" style="display:none">
      <button class="act" id="btnSnap" aria-label="Snap a photo"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13.5" r="4"/><path d="M9 7l1.5-2.5h3L15 7"/></svg></button>
      <span class="alabel">SNAP</span>
    </div>
    <div class="actwrap">
      <button class="act" id="btnA" aria-label="Hop"><svg viewBox="0 0 24 24"><path d="M12 19V6"/><path d="m5.5 12.5 6.5-7 6.5 7"/></svg></button>
      <span class="alabel">HOP</span>
    </div>
    <div class="actwrap">
      <button class="act" id="btnB" aria-label="Talk / Grab"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-4 4 .5-4H4z"/></svg></button>
      <span class="alabel">TALK</span>
    </div>
    <div class="actwrap" id="wrapM">
      <button class="act" id="btnM" aria-label="Build"><svg viewBox="0 0 24 24"><path d="M13.5 5.5 18 3l3 3-2.5 4.5L15 8z" fill="#fff" stroke="none"/><path d="M15 8 4 19l1 1L16 9"/></svg></button>
      <span class="alabel">BUILD</span>
    </div>
    <div class="actwrap" id="wrapSay">
      <button class="act" id="btnSay" aria-label="Say"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-4 4 .5-4H4z"/><path d="M8 9h8M8 12h5" stroke-width="1.8"/></svg></button>
      <span class="alabel">SAY</span>
    </div>
  </div>
  <div id="palette"></div>
  <div id="dialog">
    <div class="dhead"><canvas id="dlgAv" width="44" height="44"></canvas><span id="dlgName"></span></div>
    <div id="dlgText"></div><div id="dlgMore">tap ▸</div>
    <div id="dlgBtns"></div>
  </div>
  <div id="modal"><div class="card" id="modalCard"></div></div>
  <div id="toast"></div>
  <div id="qflash" style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;"></div>
  <div id="pops"></div>
  <div id="loading">
    <svg class="frogload" viewBox="0 0 100 100"><circle cx="33" cy="27" r="15" fill="#8fdf5a"/><circle cx="67" cy="27" r="15" fill="#8fdf5a"/><path d="M50 24C73 24 87 41 87 62 87 83 70 93 50 93 30 93 13 83 13 62 13 41 27 24 50 24Z" fill="#8fdf5a"/><circle cx="33" cy="28" r="9" fill="#fff"/><circle cx="67" cy="28" r="9" fill="#fff"/><circle cx="35" cy="31" r="5" fill="#16242e"/><circle cx="65" cy="31" r="5" fill="#16242e"/><path d="M38 58Q50 70 62 58" fill="none" stroke="#2f6e18" stroke-width="4" stroke-linecap="round"/></svg>

  return lerp(lerp(a,b2,s(xf)),lerp(c,d,s(xf)),s(zf));}

      MAKER={x:44,z:44,r:19,h:14},
      REED={x:64,z:196,r:16,h:12,g:B.mud},
      MOSS={x:196,z:56,r:17,h:15},
      BAY={x:204,z:204,r:16,h:12,g:B.sand},
      COVE={x:204,z:219,r:11,h:8},
      POOL={x:120,z:176,r:13,h:8},
      GARDEN={x:172,z:96,r:12,h:13};
const ZONES=[CITY,MAKER,REED,MOSS,BAY,COVE,POOL,GARDEN];
const CLEAN=new Set([CITY,MAKER,POOL,GARDEN]);
function zoneAt(x,z){let best=null,bt=0;
  for(const zn of ZONES){const d=Math.hypot(x-zn.x,z-zn.z);const t=clamp((zn.r-d)/7,0,1);
    if(t>bt){bt=t;best=zn;}}
  return {zn:best,t:bt*bt*(3-2*bt)};}

const bioMap=new Uint8Array(W*D); /* 0 meadow 1 forest 2 swamp 3 beach 4 pond 5 zone */
const TERR_H=new Uint8Array(W*D);  /* natural terrain height BEFORE structures — smoothing anchor */
function genTerrain(){
  for(let z=0;z<D;z++)for(let x=0;x<W;x++){
    let h=6+fbm(x*.035,z*.035)*16;
    const m=fbm(x*.02+40,z*.02+40);
    const za=zoneAt(x,z);
    if(za.zn)h=lerp(h,za.zn.h,za.t);
    h=Math.round(clamp(h,3,H-10));
    let b;
    if(za.zn&&za.t>0.55)b=5;
    else if(h<=WL)b=4;
    else if(h<=WL+1)b=3;
    else if(m>0.60)b=1;
    else if(m<0.42&&h<=WL+3)b=2;
    else b=0;
    bioMap[z*W+x]=b;
    TERR_H[z*W+x]=h;
    for(let y=0;y<h;y++){
      let bl=B.stone;
      if(y===h-1){
        if(h<=WL)bl=(m>0.5?B.mud:B.sand);
        else if(b===5)bl=(za.zn.g||B.grass);
        else if(b===3)bl=B.sand;
        else if(b===2)bl=B.mud;
        else bl=B.grass;
      }else if(y>h-4)bl=(b===3?B.sand:B.dirt);
      sb(x,y,z,bl);
    }
    for(let y=h;y<=WL;y++)sb(x,y,z,B.water);
  }
}
function nearWater(x,z){return gb(x+1,WL,z)===B.water||gb(x-1,WL,z)===B.water||gb(x,WL,z+1)===B.water||gb(x,WL,z-1)===B.water;}
/* smooth-mode model registries: roofs render as slopes, trees as round canopies */
const cellKey=(x,y,z)=>(y*D+z)*W+x;
const ROOFS=new Map(),ROOFSKIP=new Set();
const TREEMAP=new Map(),FOLSKIP=new Set();
function regRoof(ax,az,data,cells){
  data.cells=cells;ROOFS.set(ax*1024+az,data);
  for(const k of cells)ROOFSKIP.add(k);
}
function unregAt(x,z){
  const k=x*1024+z;
  const r=ROOFS.get(k);if(r){for(const c of r.cells)ROOFSKIP.delete(c);ROOFS.delete(k);}
  const t2=TREEMAP.get(k);if(t2){for(const c of t2.cells)FOLSKIP.delete(c);TREEMAP.delete(k);}
}
function tree(x,z,g){const ht=3+((hash2(x,z)*2)|0);
  const cells=[];
  const put=(X,Y,Z,B2)=>{sb(X,Y,Z,B2);cells.push(cellKey(X,Y,Z));};
  for(let y=0;y<ht;y++)put(x,g+y,z,B.wood);
  for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=0;dy<2;dy++){
    if(Math.abs(dx)===2&&Math.abs(dz)===2)continue;
    if(gb(x+dx,g+ht-1+dy,z+dz)===B.air)put(x+dx,g+ht-1+dy,z+dz,B.leaf);}
  put(x,g+ht+1,z,B.leaf);
  for(const k of cells)FOLSKIP.add(k);
  TREEMAP.set(x*1024+z,{x,z,g,ht,cells});
}
function pruneTrees(){ /* structures may have flattened a decor tree */
  for(const [k,tr] of TREEMAP){
    if(gb(tr.x,tr.g,tr.z)!==B.wood){
      for(const c of tr.cells)FOLSKIP.delete(c);
      TREEMAP.delete(k);
    }
  }
}
function genDecor(){
  for(let z=2;z<D-2;z++)for(let x=2;x<W-2;x++){
    const b=bioMap[z*W+x],r=hash2(x*7+1,z*13+5);
    const za=zoneAt(x,z);
    if(za.zn&&za.t>0.1&&CLEAN.has(za.zn))continue;
    if(b===5)continue;
    if(b===4){if(r<.06)sb(x,WL,z,B.lily);continue;}
    const g=groundY(x,z);
    if(b===3){if(r<.05)sb(x,g,z,B.pebble);else if(r<.08)sb(x,g,z,B.shell);
      else if(r<.11&&nearWater(x,z))sb(x,g,z,B.reed);continue;}
    if(b===2){if(r<.09)sb(x,g,z,B.reed);else if(r<.13)sb(x,g,z,B.shroom);
      else if(r<.145)sb(x,g,z,B.stick);continue;}
    if(b===1){if(r<.022)tree(x,z,g);else if(r<.05)sb(x,g,z,B.shroom);
      else if(r<.085)sb(x,g,z,B.stick);else if(r<.095)sb(x,g,z,B.flowP);continue;}
    if(r<.03)sb(x,g,z,B.flowP);else if(r<.06)sb(x,g,z,B.flowY);
    else if(r<.078)sb(x,g,z,B.berry);else if(r<.088)sb(x,g,z,B.stick);
    else if(r<.0905)tree(x,z,g);
  }
}

/* ---- structure helpers ---- */
function fillB(x0,y0,z0,x1,y1,z1,b){for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)sb(x,y,z,b);}
function clearAbove(x0,z0,x1,z1,g){for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++)for(let y=g;y<H;y++)sb(x,y,z,B.air);}
function floorPad(x0,z0,x1,z1,g,b){for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++)sb(x,g-1,z,b);}
function lamp(x,z,g){sb(x,g,z,B.wood);sb(x,g+1,z,B.wood);sb(x,g+2,z,B.lantern);}
function hut(cx,cz,g,wall,roof){
  clearAbove(cx-4,cz-4,cx+4,cz+4,g);
  floorPad(cx-3,cz-3,cx+3,cz+3,g,B.plank);
  for(let x=cx-3;x<=cx+3;x++)for(let z=cz-3;z<=cz+3;z++){
    if(x===cx-3||x===cx+3||z===cz-3||z===cz+3)for(let y=g;y<g+4;y++)sb(x,y,z,wall);}
  /* wide welcoming doorway on the south side */
  for(let dx=-1;dx<=1;dx++)for(let y=g;y<g+2;y++)sb(cx+dx,y,cz+3,B.air);
  /* glowing windows + cozy light inside */
  sb(cx-3,g+2,cz,B.lantern);sb(cx+3,g+2,cz,B.lantern);
  sb(cx-2,g,cz-2,B.lantern);
  let lvl=0;
  for(let s=4;s>=0;s--){fillB(cx-s,g+4+lvl,cz-s,cx+s,g+4+lvl,cz+s,roof);lvl++;}
  sb(cx+2,g,cz+4,B.lantern);
  const rc=[];lvl=0;
  for(let s2=4;s2>=0;s2--){for(let X=cx-s2;X<=cx+s2;X++)for(let Z=cz-s2;Z<=cz+s2;Z++)rc.push(cellKey(X,g+4+lvl,Z));lvl++;}
  regRoof(cx,cz,{t:'pyr',x0:cx-4,x1:cx+5,z0:cz-4,z1:cz+5,yB:g+4,yT:g+9.4,b:roof},rc);
}
function shroomHouse(cx,cz,g,cap){
  clearAbove(cx-4,cz-4,cx+4,cz+4,g);
  floorPad(cx-3,cz-3,cx+3,cz+3,g,B.dirt);
  for(let x=cx-3;x<=cx+3;x++)for(let z=cz-3;z<=cz+3;z++){
    if(Math.abs(x-cx)===3||Math.abs(z-cz)===3)for(let y=g;y<g+4;y++)sb(x,y,z,B.stem);}
  for(let dx=-1;dx<=1;dx++)for(let y=g;y<g+2;y++)sb(cx+dx,y,cz+3,B.air);
  fillB(cx-4,g+4,cz-4,cx+4,g+5,cz+4,cap);
  fillB(cx-3,g+6,cz-3,cx+3,g+6,cz+3,cap);
  fillB(cx-2,g+7,cz-2,cx+2,g+7,cz+2,cap);
  fillB(cx-1,g+8,cz-1,cx+1,g+8,cz+1,cap);
  sb(cx-2,g,cz-2,B.lantern);
  sb(cx+4,g,cz+4,B.shroom);
  const rc=[];
  const lay=[[4,4],[4,5],[3,6],[2,7],[1,8]];
  for(const L of lay)for(let X=cx-L[0];X<=cx+L[0];X++)for(let Z=cz-L[0];Z<=cz+L[0];Z++)rc.push(cellKey(X,g+L[1],Z));
  regRoof(cx,cz,{t:'dome',cx:cx+0.5,cz:cz+0.5,yB:g+4,r:4.7,b:cap},rc);
}
function tower(cx,cz,g,cap){
  cap=cap||B.roofP;
  clearAbove(cx-2,cz-2,cx+2,cz+2,g);
  for(let y=g;y<g+8;y++)for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
    if(Math.abs(dx)+Math.abs(dz)===2)continue;sb(cx+dx,y,cz+dz,B.plank);}
  const rc=[];
  for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){
    if(Math.abs(dx)===2&&Math.abs(dz)===2)continue;
    sb(cx+dx,g+8,cz+dz,cap);rc.push(cellKey(cx+dx,g+8,cz+dz));}
  sb(cx,g+9,cz,B.lantern);
  regRoof(cx,cz,{t:'pyr',x0:cx-2,x1:cx+3,z0:cz-2,z1:cz+3,yB:g+8,yT:g+10.6,b:cap},rc);
}
function lodge(cx,cz,g){
  clearAbove(cx-7,cz-5,cx+7,cz+5,g);
  floorPad(cx-7,cz-5,cx+7,cz+5,g,B.plank);
  for(let x=cx-7;x<=cx+7;x++)for(let z=cz-5;z<=cz+5;z++){
    if(x===cx-7||x===cx+7||z===cz-5||z===cz+5)for(let y=g;y<g+5;y++)sb(x,y,z,B.mud);}
  fillB(cx-7,g+5,cz-5,cx+7,g+5,cz+5,B.plank);
  fillB(cx-5,g+6,cz-3,cx+5,g+6,cz+3,B.roofP);
  fillB(cx-3,g+7,cz-1,cx+3,g+7,cz+1,B.roofP);
  const rc=[];
  for(let X=cx-5;X<=cx+5;X++)for(let Z=cz-3;Z<=cz+3;Z++)rc.push(cellKey(X,g+6,Z));
  for(let X=cx-3;X<=cx+3;X++)for(let Z=cz-1;Z<=cz+1;Z++)rc.push(cellKey(X,g+7,Z));
  regRoof(cx,cz,{t:'hip',x0:cx-5,x1:cx+6,z0:cz-3,z1:cz+4,yB:g+6,yT:g+8.8,rx0:cx-2.5,rx1:cx+3.5,rz:cz+0.5,b:B.roofP},rc);
  /* grand doorway */
  for(let dx=-1;dx<=1;dx++)for(let y=g;y<g+3;y++)sb(cx+dx,y,cz+5,B.air);
  sb(cx-4,g+2,cz+5,B.lantern);sb(cx+4,g+2,cz+5,B.lantern);
  /* hall interior: lit corners + a little podium */
  sb(cx-5,g,cz-3,B.lantern);sb(cx+5,g,cz-3,B.lantern);
  sb(cx,g,cz-3,B.plank);sb(cx,g+1,cz-3,B.flag);
  lamp(cx-5,cz+7,g);lamp(cx+5,cz+7,g);
  sb(cx,g+8,cz,B.flag);
}
function stall(cx,cz,g){
  clearAbove(cx-2,cz-1,cx+2,cz+1,g);
  for(let x=cx-1;x<=cx+1;x++)sb(x,g,cz,B.plank);
  sb(cx-2,g,cz,B.wood);sb(cx+2,g,cz,B.wood);sb(cx-2,g+1,cz,B.wood);sb(cx+2,g+1,cz,B.wood);
  for(let x=cx-2;x<=cx+2;x++)for(let z=cz-1;z<=cz+1;z++)sb(x,g+2,z,(x+z)%2?B.roofP:B.roofB);
}

(function(){

  const AX=[[0,1,2,1],[0,1,2,-1],[1,0,2,1],[1,0,2,-1],[2,0,1,1],[2,0,1,-1]];
  const P=(ax,u,v)=>{const p=[0,0,0];p[ax[0]]=ax[3]*0.5;p[ax[1]]=u;p[ax[2]]=v;return p;};
  function vert(p){
    const inn=p.map(c=>clamp(c,-0.5+r,0.5-r));
    let dx=p[0]-inn[0],dy=p[1]-inn[1],dz=p[2]-inn[2];
    const dl=Math.hypot(dx,dy,dz);

    if(dl<1e-6){n=[0,0,0];const i=p.findIndex(c=>Math.abs(c)>0.499);n[i]=Math.sign(p[i]);pos=p;}
    else{n=[dx/dl,dy/dl,dz/dl];pos=[inn[0]+n[0]*r,inn[1]+n[1]*r,inn[2]+n[2]*r];}
    const d=Math.max(0,n[0]*SUNV[0]+n[1]*SUNV[1]+n[2]*SUNV[2]);

      for(const k of [0,1,2,0,2,3])a.push(q[k][0],q[k][1],q[k][2],q[k][3]);

const FOVY=65*Math.PI/180;
const P={x:CITY.x+0.5,y:20,z:CITY.z+34.5,vx:0,vy:0,vz:0,yaw:Math.PI,onGround:false,inWater:false,moving:false,hw:0.28,hh:1.5};

function ptSolid(px,py,pz){
  const fx=Math.floor(px),fy=Math.floor(py),fz=Math.floor(pz);
  const b=gb(fx,fy,fz);
  if(SOLID.has(b)||b===B.fence){
    /* smooth mode: natural ground is walked via the sheet (smoothGroundY),
       so its blocks stop being invisible stair-step colliders */
    if(GFXPOLY){
      if(NATURAL.has(b)&&natTopAt(fx,fz)>0)return false;
      /* old tree blocks are invisible in smooth mode — only the visible
         trunk column stays solid (canopies are walk-under) */
      if(FOLSKIP.has((fy*D+fz)*W+fx)){
        const tr=TREEMAP.get(fx*1024+fz);
        return !!(tr&&b===B.wood&&fy<tr.g+tr.ht+1);
      }
    }
    return true;
  }
  if(gb(fx,fy-1,fz)===B.fence&&py-fy<0.6)return true;
  return false;}
function boxSolid(e,x,y,z){
  const xs=[x-e.hw,x+e.hw],zs=[z-e.hw,z+e.hw],ys=[y+0.02,y+e.hh*0.5,y+e.hh-0.02];
  for(const yy of ys)for(const xx of xs)for(const zz of zs)
    if(ptSolid(xx,yy,zz))return true;
  return false;}
function moveEntity(e,dt){
  e.inWater=gb(Math.floor(e.x),Math.floor(e.y+0.4),Math.floor(e.z))===B.water;
  /* no gravity while resting on ground — an integrate-collide-snap cycle
     makes the character (and camera) sawtooth by a few centimeters */
  if(e.onGround&&e.vy<=0)e.vy=0;
  else{e.vy+=(e.inWater?-5:-22)*dt;
    e.vy=Math.max(e.vy,e.inWater?-3:-24);}
  /* auto-hop: pushing into a 1-block ledge triggers a ~1.25-block hop
     (taller walls stay walls — the space above the ledge must be clear) */
  const hop=()=>{if((e.onGround||e.inWater)&&e.vy<=0.01)e.vy=e.inWater?7:7.5;};
  const nx=e.x+e.vx*dt;
  if(!boxSolid(e,nx,e.y,e.z))e.x=nx;
  else{if(!boxSolid(e,nx,e.y+1.05,e.z))hop();e.vx=0;}
  const nz=e.z+e.vz*dt;
  if(!boxSolid(e,e.x,e.y,nz))e.z=nz;
  else{if(!boxSolid(e,e.x,e.y+1.05,nz))hop();e.vz=0;}
  const ny=e.y+e.vy*dt;
  if(!boxSolid(e,e.x,ny,e.z))e.y=ny;
  else{if(e.vy<0)e.y=Math.floor(ny+0.02)+1.0001;e.vy=0;}
  /* stable ground probe (a collision-event flag flickers between frames) */
  e.onGround=e.vy<=0&&boxSolid(e,e.x,e.y-0.06,e.z);
  if(GFXPOLY){ /* the low-poly sheet is the real floor on natural ground */
    const sg=smoothGroundY(e.x,e.z);
    if(sg>0&&!boxSolid(e,e.x,sg,e.z)){ /* never snap up into a solid */
      if(e.y<=sg+0.07&&e.vy<=0){e.y=sg;e.vy=0;e.onGround=true;}
      else if(e.y<sg){e.y=sg;if(e.vy<0)e.vy=0;e.onGround=true;}
    }
  }
  moverCarry(e);
  gadgetCheck(e);
  /* wedged inside something solid (old bug / stale save): pop free */
  if(e===P){
    if(boxSolid(e,e.x,e.y,e.z)){
      e.stuckT=(e.stuckT||0)+dt;
      if(e.stuckT>0.8){e.stuckT=0;e.y=walkGroundY(e.x,e.z)+0.5;e.vy=0;}
    }else e.stuckT=0;
  }
  e.x=clamp(e.x,1.5,W-1.5);e.z=clamp(e.z,1.5,D-1.5);
  if(e.y<-6){e.y=groundY(e.x,e.z)+1;e.vy=0;}
}

    if(Math.hypot(dx,dz)>0.5)n.yaw=Math.atan2(dx,dz);
    n.moving=false;return;
  }
  n.wt-=dt;
  if(n.wt<=0){n.wt=2.5+Math.random()*4;
    const a=Math.random()*Math.PI*2,r=Math.random()*n.r;
    n.tx=n.hx+Math.sin(a)*r;n.tz=n.hz+Math.cos(a)*r;}
  const dx=n.tx-n.x,dz=n.tz-n.z,d=Math.hypot(dx,dz);
  if(d>0.35){
    const stx=dx/d*1.25*dt,stz=dz/d*1.25*dt;
    const gy=walkGroundY(n.x+stx*4,n.z+stz*4);
    if(gy<=WL+0.2||Math.abs(gy-n.y)>1.4){n.wt=0;n.moving=false;return;}
    n.x+=stx;n.z+=stz;n.yaw=Math.atan2(dx,dz);n.moving=true;
    n.y=lerp(n.y,walkGroundY(n.x,n.z),Math.min(1,12*dt));
  }else n.moving=false;
}

function cameraEye(){
  const cp=Math.sin(cam.pitch),cc=Math.cos(cam.pitch);
  const dir=[cc*Math.sin(cam.yaw),cp,cc*Math.cos(cam.yaw)];
  const tx=P.x,ty=P.y+1.35,tz=P.z;
  let d=cam.dist;
  for(let s=0.6;s<=cam.dist;s+=0.25){
    if(SOLID.has(gb(Math.floor(tx+dir[0]*s),Math.floor(ty+dir[1]*s),Math.floor(tz+dir[2]*s)))){
      d=Math.max(0.9,s-0.4);break;}
  }
  const eye=[tx+dir[0]*d,ty+dir[1]*d,tz+dir[2]*d];
  const fl=Math.hypot(dir[0],dir[1],dir[2]);
  return {eye,tgt:[tx,ty,tz],fwd:[-dir[0]/fl,-dir[1]/fl,-dir[2]/fl]};
}

function raycast(ox,oy,oz,dx,dy,dz,max){
  let x=Math.floor(ox),y=Math.floor(oy),z=Math.floor(oz);
  const stx=dx>0?1:-1,sty=dy>0?1:-1,stz=dz>0?1:-1;
  const tdx=Math.abs(1/(dx||1e-9)),tdy=Math.abs(1/(dy||1e-9)),tdz=Math.abs(1/(dz||1e-9));
  let tx=(stx>0?(x+1-ox):(ox-x))*tdx,ty=(sty>0?(y+1-oy):(oy-y))*tdy,tz=(stz>0?(z+1-oz):(oz-z))*tdz;
  let t=0,face=[0,1,0];
  while(t<=max){
    const b=gb(x,y,z);
    if(b!==B.air&&b!==B.water)return{x,y,z,b,t,face};
    if(tx<ty&&tx<tz){x+=stx;t=tx;tx+=tdx;face=[-stx,0,0];}
    else if(ty<tz){y+=sty;t=ty;ty+=tdy;face=[0,-sty,0];}
    else{z+=stz;t=tz;tz+=tdz;face=[0,0,-stz];}
  }
  return null;
}
function screenRay(px,py){
  const asp=canvas.width/canvas.height,th=Math.tan(FOVY/2);
  const f=CAMFWD;
  const rl=Math.hypot(f[0],f[2])||1;
  const rx=-f[2]/rl,rz=f[0]/rl;
  const ux=-rz*f[1],uy=rz*f[0]-rx*f[2],uz=rx*f[1];
  const nx=(px/innerWidth*2-1)*th*asp,ny=(1-py/innerHeight*2)*th;
  let dx=f[0]+rx*nx+ux*ny,dy=f[1]+uy*ny,dz=f[2]+rz*nx+uz*ny;
  const l=Math.hypot(dx,dy,dz)||1;
  return [dx/l,dy/l,dz/l];
}
function npcAlongRay(dir,max){
  let best=null,bt=max;
  for(const n of NPCS){
    const px2=n.x-CAMEYE[0],py2=n.y+0.8-CAMEYE[1],pz2=n.z-CAMEYE[2];
    const t=px2*dir[0]+py2*dir[1]+pz2*dir[2];
    if(t<0.5||t>bt)continue;
    const cx=CAMEYE[0]+dir[0]*t,cy=CAMEYE[1]+dir[1]*t,cz=CAMEYE[2]+dir[2]*t;
    if(Math.hypot(n.x-cx,n.y+0.8-cy,n.z-cz)<1.0){best=n;bt=t;}
  }
  return best;
}
function nearestNPC(maxD){
  let best=null,bd=maxD;
  for(const n of NPCS){const d=Math.hypot(n.x-P.x,n.y-P.y,n.z-P.z);
    if(d<bd){bd=d;best=n;}}
  return best;
}

function pollGamepad(dt){
  gp.mx=0;gp.my=0;

  for(const p of pads){
    if(!p)continue;
    const dz=v=>Math.abs(v||0)>0.18?v:0;
    gp.mx+=dz(p.axes[0]);gp.my+=-dz(p.axes[1]);
    cam.yaw+=dz(p.axes[2])*2.8*dt;
    cam.pitch=clamp(cam.pitch+dz(p.axes[3])*1.9*dt,-0.18,1.25);

    gpEdge('b',bp(1)||bp(2),uiButtonB);
    gpEdge('m',bp(3),toggleMaker);

}

  if(n.quest&&n.quest.wear){
    const q=n.quest,dressed=SV.outfit.hat!=='none'||SV.outfit.neck!=='none';
    if(st===0)ls.push({ask:true,text:q.ask});
    else if(st===1){
      if(dressed)ls.push({give:true,text:'Oh! Is that a new look? Give us a twirl!'});
      else ls.push({text:'The boutique is just east of the fountain — pink roof, can’t miss it!'});
    }else ls.push({text:'Still the snappiest dresser in Lilyopolis!'});
  }else if(n.quest){
    const q=n.quest,iname=ITEMS[q.item].name.toLowerCase();
    if(st===0)ls.push({ask:true,text:q.ask});
    else if(st===1){
      if(invCount(q.item)>=q.n)ls.push({give:true,text:'You have '+invCount(q.item)+' '+IC(q.item)+' '+iname+'! Hand over '+q.n+' of them?'});
      else ls.push({text:'Still hunting? I need '+(q.n-invCount(q.item))+' more '+IC(q.item)+' '+iname+'. You can do it!'});
    }else ls.push({text:'Thanks again, friend! The whole pond appreciates you.'});
  }
  /* phase-1 quests: offers from givers, hand-offs at delivery targets */
  for(const q of QDEFS){
    const st=q2get(q.id);
    if(q.giver===n.id){
      if(q.type==='seek'){if(st!==1)ls.push({q2ask:q,text:q.ask});}
      else if(st===0)ls.push({q2ask:q,text:q.ask});
      else if(st===1&&q.type!=='deliver')ls.push({text:q.hint});
      else if(st===1)ls.push({text:q.hint});
    }
    if(q.type==='deliver'&&q.target===n.id&&st===1)
      ls.push({q2give:q,text:q.deliver});
  }
  if(n.id==='marina'){
    if(!SV.tools.rod)ls.push({rod:true,text:'A brand-new angler! Here — your first fishing rod is on the house.'});
    else{
      const bag=fishBagTotal();
      if(bag.n>0)ls.push({sellfish:true,text:'Ooh, '+bag.n+' fish in your creel! I’ll pay '+bag.v+' coins for the lot.'});
      else ls.push({text:'Empty creel? Face the water, tap FISH to cast, and strike on the splash!'});
    }
  }
  if(n.shop)ls.push({shop:true,text:'Want to browse the racks, dearie?'});
  if(n.trade){
    const tr=n.trade;
    if(invCount(tr.item)>=tr.n)ls.push({trade:true,text:'Trade '+tr.n+' '+IC(tr.item)+' '+ITEMS[tr.item].name.toLowerCase()+' for '+tr.coins+' '+IC('coin')+' coins?'});
  }
  return ls;
}

function renderShopPanel(){
  const pv=SHOP_PREV;
  let cards='';
  for(const it of SHOP_ITEMS){
    const owned=SV.wardrobe[it.id]||it.cost===0;
    const worn=SV.outfit[it.slot]===it.id;
    const sel=pv[it.slot]===it.id;
    const vb=it.slot==='hat'?'6 0 88 52':'6 34 88 62';
    cards+='<div class="shopcard'+(sel?' sel':'')+'" data-id="'+it.id+'">'
      +mannequinSVG(it.slot==='hat'?it.id:'none',it.slot==='neck'?it.id:'none',vb)
      +'<div class="shopname">'+it.name+'</div>'
      +'<div class="shopprice">'+(worn?'<span class="worn">wearing ✓</span>'
        :owned?'free to wear':'<img src="'+ICONS.coin+'"> '+it.cost)+'</div>'
      +'</div>';
  }
  let cost=0;
  for(const slot of ['hat','neck']){
    const id=pv[slot];
    if(id!=='none'&&!SV.wardrobe[id]){
      const it=SHOP_ITEMS.find(x=>x.id===id);
      if(it&&it.cost>0)cost+=it.cost;
    }
  }
  const differs=pv.hat!==SV.outfit.hat||pv.neck!==SV.outfit.neck;
  const line=POPPY_LINES[(renderShopPanel._n=(renderShopPanel._n||0))%POPPY_LINES.length];
  $('#shoppanel').innerHTML=
    '<h2>Madame Poppy’s Boutique</h2>'
    +'<p class="speech2">“'+line+'”</p>'
    +'<p style="margin:0;font-weight:800"><img src="'+ICONS.coin+'" style="width:16px;vertical-align:-3px"> '
    +SV.coins+' coins · <span style="opacity:.65">that’s YOU trying things on →</span></p>'
    +'<div class="shopgrid">'+cards+'</div>'
    +'<div class="actrow">'
    +(differs?'<button class="bigb" id="shopBuy">'+(cost>0?'Buy & wear · '+cost+' coins':'Wear it!')+'</button>':'')
    +'<button class="bigb red" id="shopExit">Leave the shop</button></div>';
  document.querySelectorAll('#shoppanel .shopcard').forEach(el=>{
    el.onclick=()=>{
      const it=SHOP_ITEMS.find(x=>x.id===el.dataset.id);
      SHOP_PREV[it.slot]=SHOP_PREV[it.slot]===it.id?'none':it.id;
      renderShopPanel._n=(renderShopPanel._n||0)+1;
      sTalk();renderShopPanel();
    };});
  const buy=$('#shopBuy');
  if(buy)buy.onclick=()=>{
    if(SV.coins<cost){toast('Not enough coins yet — try the Arcade!');sBad();return;}
    SV.coins-=cost;
    for(const slot of ['hat','neck']){
      const id=SHOP_PREV[slot];
      if(id!=='none')SV.wardrobe[id]=1;
    }
    SV.outfit={hat:SHOP_PREV.hat,neck:SHOP_PREV.neck};
    save();updateHUD();if(cost>0)sCoin();else sTalk();
    toast('Looking fabulous!');
    mpSendFit();
    renderShopPanel();
  };
  $('#shopExit').onclick=exitShop;
}

  }else{
    for(const q of QDEFS){
      if(q2get(q.id)!==1)continue;
      txt=q.name+': '+q2status(q);
      break;
    }

      if(q&&SV.quests[n.id]===1){
        txt=q.wear?'Wear something from Madame Poppy’s Boutique, then see the Mayor!'
          :n.name+' needs '+ITEMS[q.item].name.toLowerCase()+': '+Math.min(invCount(q.item),q.n)+'/'+q.n;
        break;}}

  }

function updateBangs(){
  for(const n of NPCS){
    const st=SV.quests[n.id]||0;
    const done=n.quest&&(n.quest.wear
      ?(SV.outfit.hat!=='none'||SV.outfit.neck!=='none')
      :invCount(n.quest.item)>=n.quest.n);
    n.bang=!!(n.quest&&(st===0||(st===1&&done)));
    if(!n.bang)for(const q of QDEFS){
      if(q.giver!==n.id)continue;
      const s2=q2get(q.id);
      if((q.type==='seek'&&s2!==1)||s2===0){n.bang=true;break;}
      if(q.type==='deliver'&&q.target===n.id&&s2===1){n.bang=true;break;}
    }
    if(!n.bang)for(const q of QDEFS)
      if(q.type==='deliver'&&q.target===n.id&&q2get(q.id)===1){n.bang=true;break;}
  }
}

function teleport(p){P.x=p[0];P.y=p[1];P.z=p[2];P.vx=P.vy=P.vz=0;}
function spawnFlies(){
  FLIES.length=0;
  for(let i=0;i<MINI.firefly.goal;i++)
    FLIES.push({x:ARCADE.x+(Math.random()*16-8),z:ARCADE.z+(Math.random()*8-4),
      y:ARCADE.g+1.4+Math.random()*1.4,a:Math.random()*7,sp:1+Math.random(),got:false});
}
function startMini(id){
  const g=MINI[id];
  mini={id,count:0,t:0,tLeft:g.time||0,cp:null};
  if(id==='hop'){teleport(g.start);mini.cp=[...g.start];}
  if(id==='berry'){
    for(const b of GARD.bushes)if(gb(b[0],b[1],b[2])!==B.berry)edit(b[0],b[1],b[2],B.berry);
    teleport(g.start);}
  if(id==='firefly')spawnFlies();
  if(id==='obby'){teleport(g.start);mini.cp=OBBY.cps[0];}
  sHop();updateHUD();
}
function updateMini(dt){
  if(!mini)return;
  mini.t+=dt;
  if(mini.id==='hop'){
    for(const ci of HOP_CPS){const p=PADS[ci];
      if(Math.abs(P.y-(p[2]+1))<1.6&&Math.hypot(P.x-(p[0]+1),P.z-(p[1]+1))<1.7)
        mini.cp=[p[0]+1,p[2]+1.2,p[1]+1];}
    if(P.inWater){sSplash();toast('Splash! Back to the checkpoint');teleport(mini.cp);}
    const F=MINI.hop.fin;
    if(Math.hypot(P.x-F[0],P.y-F[1],P.z-F[2])<2.4)endMini(true);
  }else if(mini.id==='berry'){
    mini.tLeft-=dt;
    if(mini.tLeft<=0)endMini(false);
  }else if(mini.id==='firefly'){
    mini.tLeft-=dt;
    for(const f of FLIES){
      if(f.got)continue;
      f.a+=dt*(0.6+f.sp*0.35);
      f.x+=Math.sin(f.a*1.7)*f.sp*dt*1.9;
      f.z+=Math.cos(f.a*1.3)*f.sp*dt*1.9;
      f.y=ARCADE.g+1.8+Math.sin(f.a*2.1)*0.9;
      f.x=clamp(f.x,ARCADE.x-9,ARCADE.x+9);f.z=clamp(f.z,ARCADE.z-5,ARCADE.z+5);
      if(Math.hypot(f.x-P.x,f.y-(P.y+1),f.z-P.z)<1.4){
        f.got=true;mini.count++;sPick();popLabel('+1 Firefly','');updateHUD();
        if(mini.count>=MINI.firefly.goal){endMini(true);return;}}
    }
    if(mini.tLeft<=0)endMini(false);
  }else if(mini.id==='obby'){
    for(const cp of OBBY.cps)
      if(Math.hypot(P.x-cp[0],P.z-cp[2])<1.9&&Math.abs(P.y-cp[1])<1.6)mini.cp=cp;
    if(P.y<mini.cp[1]-7){teleport(mini.cp);toast('Whoops! Back to the checkpoint');sBad();}
    if(Math.hypot(P.x-OBBY.flag[0],P.z-OBBY.flag[2])<2.1&&Math.abs(P.y-OBBY.flag[1])<2.6)endMini(true);
  }else if(mini.id==='plot'){
    for(const c of COINSE){
      if(c.got)continue;
      if(Math.hypot(c.x-P.x,c.y-(P.y+0.8),c.z-P.z)<1.15){c.got=true;mini.count++;sCoin();updateHUD();}}
    if(PLOTGAME.flag&&Math.hypot(P.x-PLOTGAME.flag[0],P.z-PLOTGAME.flag[2])<1.4&&
       Math.abs(P.y-PLOTGAME.flag[1])<2.2)endPlotTest();
  }
}
function endMini(win){
  const id=mini.id,g=MINI[id];
  const timeUsed=g.time?(g.time-Math.max(0,mini.tLeft)):mini.t;
  let coins=0;const first=!SV.best[id];
  if(win){
    coins=first?g.reward:g.again;
    if(!SV.best[id]||timeUsed<SV.best[id])SV.best[id]=Math.round(timeUsed*10)/10;
    addCoins(coins);sWin();
  }else sBad();
  FLIES.length=0;
  mini=null;save();updateHUD();
  const dest=id==='berry'?MINI.berry.start:[ARCADE.x+0.5,ARCADE.g+0.2,ARCADE.z+2.5];
  openModal(win?('<h2>You did it!</h2><p>'+g.name+' complete in '+timeUsed.toFixed(1)+'s.</p>'+
      '<p>+'+coins+' coins'+(first?' — first-win bonus!':'')+'</p>')
    :'<h2>Time’s up!</h2><p>Good try! Hop back on the glowing pad to play again.</p>',
    [['Keep exploring','',()=>{closeModal();teleport(dest);padCool=4;}]]);
}

function doStamp(id,x,z){
  const g=PLOT.g;
  switch(id){
    case 'block':{let y=g;while(y<H-2&&SOLID.has(gb(x,y,z)))y++;sb(x,y,z,B.grass);break;}
    case 'pathT':sb(x,g-1,z,B.path);break;
    case 'ramp':sb(x,g,z,B.plank);sb(x,g,z-1,B.plank);sb(x,g+1,z-1,B.plank);break;
    case 'fence1':sb(x,g,z,B.fence);break;
    case 'flower':sb(x,g,z,B.flowP);sb(x+1,g,z,B.flowY);sb(x-1,g,z,B.flowY);sb(x,g,z+1,B.flowY);sb(x,g,z-1,B.flowP);break;
    case 'tree':tree(x,z,g);break;
    case 'pond':for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)sb(x+dx,g-1,z+dz,B.water);break;
    case 'start':for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)sb(x+dx,g-1,z+dz,B.padB);break;
    case 'coin':break;
    case 'flagM':sb(x,g,z,B.flag);break;
    case 'bounce':sb(x,g,z,B.bounce);break;
    case 'tele':sb(x,g-1,z,B.tele);break;
    case 'moverH':case 'moverV':break; /* entity-only, synced from placements */
    case 'shroomH':shroomHouse(x,z,g,B.capR);break;
    case 'hut':hut(x,z,g,B.plank,B.roofP);break;
    case 'tower':tower(x,z,g);break;
    case 'lodge':lodge(x,z,g);break;
  }
}
function syncPlotEnts(){
  COINSE.length=0;PLOTGAME.start=null;PLOTGAME.flag=null;
  for(let i=MOVERS.length-1;i>=0;i--)if(MOVERS[i].plot)MOVERS.splice(i,1);
  TELE_PAIRS=TELE_PAIRS.filter(pr=>!pr.plot);
  let pendingTele=null;
  for(const p of PLACED){
    if(p.m==='coin')COINSE.push({x:p.x+0.5,y:PLOT.g+0.9,z:p.z+0.5,got:false});
    else if(p.m==='start')PLOTGAME.start=[p.x+0.5,PLOT.g+0.3,p.z+0.5];
    else if(p.m==='flagM')PLOTGAME.flag=[p.x+0.5,PLOT.g+1,p.z+0.5];
    else if(p.m==='moverH')MOVERS.push({x:p.x+0.5,y:PLOT.g+0.9,z:p.z+0.5,ax:3,ay:0,az:0,per:4,ph:(p.x%7)/7,sx:2,sz:2,col:'#8a52e6',plot:true});
    else if(p.m==='moverV')MOVERS.push({x:p.x+0.5,y:PLOT.g+1.6,z:p.z+0.5,ax:0,ay:1.9,az:0,per:4.5,ph:(p.z%7)/7,sx:2,sz:2,col:'#43cea2',plot:true});
    else if(p.m==='tele'){
      if(pendingTele){TELE_PAIRS.push({a:pendingTele,b:[p.x,p.z],plot:true});pendingTele=null;}
      else pendingTele=[p.x,p.z];
    }
  }
}
/* stamp + bookkeeping shared by solo play, hosting, and visiting */
function plotStamp(m,x,z){
  REC.list=[];
  doStamp(m,x,z);
  PLACED.push({m,x,z,diff:REC.list});
  REC.list=null;
  syncPlotEnts();
  markRegion(x-7,z-7,x+7,z+7);
  scanLanterns();
  buildMiniBase();
  buildRoofMesh();
  sPlace();
  burst(x+0.5,PLOT.g+0.7,z+0.5,10,'#ffffff',2,2,4.5,0.09);
}
function placeModel(md,x,z){
  const m=md.id==='lodge'?8:(md.id==='shroomH'?5:(md.id==='tower'?4:(md.id==='hut'?5:1)));
  if(x-m<PLOT.x0-1||x+m>PLOT.x1+1||z-m<PLOT.z0-1||z+m>PLOT.z1+1){toast('Build inside the plot!');return;}
  if(MP&&MP.role==='guest'){
    if(!MP.allowBuild){toast('Ask the host to turn on "Friends can build"!');return;}
    mpSend(['plot',md.id,x,z]);return;
  }
  plotStamp(md.id,x,z);
  SV.plot.push({m:md.id,x,z});saveSoon();
  if(MP)mpBroadcast(['plotOk',md.id,x,z]);
}
function revertPlacement(i){
  const rec=PLACED[i];if(!rec)return;
  for(let k=rec.diff.length-1;k>=0;k--){const d=rec.diff[k];sb(d.x,d.y,d.z,d.p);}
  PLACED.splice(i,1);
  if(!MP||MP.role!=='guest'){SV.plot.splice(i,1);saveSoon();}
  unregAt(rec.x,rec.z);
  buildRoofMesh();
  syncPlotEnts();
  scanLanterns();
  buildMiniBase();
  markRegion(rec.x-7,rec.z-7,rec.x+7,rec.z+7);
  sBad();
}
function hostErase(i){
  revertPlacement(i);
  if(MP)mpBroadcast(['plotDel',i]);
}
function eraseAt(hit){
  for(let i=PLACED.length-1;i>=0;i--){
    const p=PLACED[i];
    if(Math.abs(hit.x-p.x)<=6&&Math.abs(hit.z-p.z)<=6&&
      p.diff.some(d=>d.x===hit.x&&d.y===hit.y&&d.z===hit.z)){
      if(MP&&MP.role==='guest'){
        if(!MP.allowBuild){toast('Ask the host to turn on "Friends can build"!');return;}
        mpSend(['plotErase',i]);return;
      }
      hostErase(i);return;}
  }
  for(let i=PLACED.length-1;i>=0;i--){
    if(['coin','moverH','moverV'].indexOf(PLACED[i].m)>=0&&Math.abs(hit.x-PLACED[i].x)<=2&&Math.abs(hit.z-PLACED[i].z)<=2){
      if(MP&&MP.role==='guest'){
        if(!MP.allowBuild){toast('Ask the host to turn on "Friends can build"!');return;}
        mpSend(['plotErase',i]);return;
      }
      hostErase(i);return;}
  }
  toast('Tap one of the placed models to erase it');
}
function undoLast(){
  if(!PLACED.length){toast('Nothing to undo');return;}
  if(MP&&MP.role==='guest'){
    if(!MP.allowBuild){toast('Ask the host to turn on "Friends can build"!');return;}
    mpSend(['plotErase',PLACED.length-1]);return;
  }
  hostErase(PLACED.length-1);toast('Undone!');
}
function rebuildPlot(){
  PLACED.length=0;
  const list=SV.plot;SV.plot=[];
  for(const p of list){
    REC.list=[];doStamp(p.m,p.x,p.z);
    PLACED.push({m:p.m,x:p.x,z:p.z,diff:REC.list});REC.list=null;
    SV.plot.push(p);
  }
  syncPlotEnts();
}

function gameTap(sx,sy){
  if(modalOpen||SHOP.active)return;
  if(dialog.npc){dialogNext();return;}
  const dir=screenRay(sx,sy);
  if(makerOn&&makerSel){
    const hit=raycast(CAMEYE[0],CAMEYE[1],CAMEYE[2],dir[0],dir[1],dir[2],30);
    if(hit&&hit.x>=PLOT.x0-1&&hit.x<=PLOT.x1+1&&hit.z>=PLOT.z0-1&&hit.z<=PLOT.z1+1){
      if(makerSel.id==='erase')eraseAt(hit);
      else placeModel(makerSel,hit.x,hit.z);
      return;}
    if(hit){toast('Build on YOUR plot — inside the path ring on Maker Isle!');return;}
  }
  if(PET&&SV.pet){
    const pd=[PET.x-CAMEYE[0],PET.y+0.4-CAMEYE[1],PET.z-CAMEYE[2]];
    const tproj=pd[0]*dir[0]+pd[1]*dir[1]+pd[2]*dir[2];
    if(tproj>0.5&&tproj<10){
      const cx2=CAMEYE[0]+dir[0]*tproj,cy2=CAMEYE[1]+dir[1]*tproj,cz2=CAMEYE[2]+dir[2]*tproj;
      if(Math.hypot(PET.x-cx2,PET.y+0.4-cy2,PET.z-cz2)<0.8){openPetCard();return;}
    }
  }
  const n=npcAlongRay(dir,10);
  if(n){talkTo(n);return;}
  const hit=raycast(CAMEYE[0],CAMEYE[1],CAMEYE[2],dir[0],dir[1],dir[2],12);
  if(hit&&QBOARD.x&&Math.abs(hit.x-QBOARD.x)<=3&&Math.abs(hit.z-QBOARD.z)<=1&&hit.y>=QBOARD.g&&hit.y<=QBOARD.g+4
     &&Math.hypot(QBOARD.x+0.5-P.x,QBOARD.z+0.5-P.z)<10){openQuestBoard();return;}
  if(hit&&COLLECT[hit.b]){
    if(Math.hypot(hit.x+0.5-P.x,hit.z+0.5-P.z)<7)collectAt(hit,sx,sy);
    else toast('Hop closer!');
  }
}
function interactAction(){
  if(QBOARD.x&&Math.hypot(QBOARD.x+0.5-P.x,QBOARD.z+0.5-P.z)<4){openQuestBoard();return;}
  const n=nearestNPC(3.4);
  if(n){talkTo(n);return;}
  const hit=raycast(CAMEYE[0],CAMEYE[1],CAMEYE[2],CAMFWD[0],CAMFWD[1],CAMFWD[2],10);
  if(hit&&COLLECT[hit.b]&&Math.hypot(hit.x+0.5-P.x,hit.z+0.5-P.z)<7){collectAt(hit);return;}
  toast('Tap plants to scavenge, tap critters to chat!');
}

/* ---- main loop ---- */
let lastT=performance.now(),hudT=0,posT=0,respT=0;
const abtnsEl=$('#abtns');
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  const t=now/1000;
  RENDT=t;RENDDT=dt;
  pollGamepad(dt);keyCam(dt);
  const wasWater=P.inWater,wasGround=P.onGround,fallVy=P.vy;
  if(SHOP.active){
    P.moving=false;P.vx=0;P.vz=0;
    P.yaw+=dt*0.8; /* slow turntable so the outfit shows all around */
  }else if(!modalOpen){
    updatePlayer(dt);
    checkPads(dt);
    updateMini(dt);
    SHOP.checkT-=dt;
    if(SHOP.checkT<=0){
      SHOP.checkT=0.25;
      for(const sh of SHOPS){
        const b=sh.box;
        if(P.x>b.x0&&P.x<b.x1+1&&P.z>b.z0&&P.z<b.z1+1&&Math.abs(P.y-b.y)<2&&!mini){
          enterShop(sh);break;
        }
      }
    }
  }
  /* juice: splash on water entry, dust puff on hard landings, drifting pollen */
  if(P.inWater&&!wasWater&&fallVy<-2){
    burst(P.x,P.y+0.5,P.z,14,'#cfeeff',2.6,3.2,9,0.12);sSplash();}
  if(P.onGround&&!wasGround&&fallVy<-7)
    burst(P.x,P.y+0.15,P.z,8,'#d9c99e',1.8,0.9,2.5,0.1);
  frame._pol=(frame._pol||0)+dt;
  if(frame._pol>0.5){frame._pol=0;
    const bio=bioMap[Math.floor(P.z)*W+Math.floor(P.x)];
    const night=NIGHTA>0.4;
    if((bio===0||bio===1||(night&&bio===2))&&PARTS.length<120){
      const a=Math.random()*Math.PI*2,r=3+Math.random()*7;
      const px2=P.x+Math.sin(a)*r,pz2=P.z+Math.cos(a)*r;
      /* daytime pollen motes become fireflies after dark */
      spawnPart(px2,groundY(px2,pz2)+0.8+Math.random()*1.6,pz2,
        0.25,0.12,0.18,4+Math.random()*3,night?'#d8ff6e':'#fff6c0',night?0.08:0.05,0);}}
  updateParts(dt);
  questTick(dt);
  fishTick();
  bugTick(dt);
  petTick(dt,t);
  abtnsEl.classList.toggle('dim',P.moving&&!modalOpen&&!dialog.npc);
  for(const n of NPCS)if(Math.hypot(n.x-P.x,n.z-P.z)<48)updateNPC(n,dt);
  updateBangs();
  remeshDirty(3);
  let c;
  if(SHOP.active){
    const sh=SHOP.active;
    const dx=sh.tgt[0]-sh.eye[0],dy=sh.tgt[1]-sh.eye[1],dz=sh.tgt[2]-sh.eye[2];
    const l=Math.hypot(dx,dy,dz)||1;
    c={eye:sh.eye,tgt:sh.tgt,fwd:[dx/l,dy/l,dz/l]};

/* ---- Firebase over REST ---- */
const fbA={tok:null,uid:null,exp:0,refresh:null};
async function fbAuth(){
  if(FB.noAuth){if(!fbA.uid){fbA.uid='test-'+Math.random().toString(36).slice(2,10);fbA.tok='x';}return fbA.tok;}
  const now=Date.now();
  if(fbA.tok&&now<fbA.exp-120000)return fbA.tok;
  if(fbA.refresh){
    try{
      const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,
        {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
         body:'grant_type=refresh_token&refresh_token='+fbA.refresh});
      if(r.ok){const j=await r.json();
        fbA.tok=j.id_token;fbA.uid=j.user_id;fbA.exp=now+j.expires_in*1000;fbA.refresh=j.refresh_token;
        return fbA.tok;}
    }catch(e){}
  }
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,
    {method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'});
  if(!r.ok)throw new Error('Could not reach the pond server — check the internet connection.');
  const j=await r.json();
  fbA.tok=j.idToken;fbA.uid=j.localId;fbA.exp=now+(+j.expiresIn)*1000;fbA.refresh=j.refreshToken;
  return fbA.tok;
}
async function fbReq(path,method,val){
  const t=await fbAuth();
  const r=await fetch(FB.dbURL+'/'+path+'.json?auth='+t,
    {method:method||'GET',body:val===undefined?undefined:JSON.stringify(val)});
  if(!r.ok)throw new Error('pond-server-'+r.status);
  return (method&&method!=='GET')?true:r.json();
}
const fbSet=(p,v)=>fbReq(p,'PUT',v),fbPush=(p,v)=>fbReq(p,'POST',v),fbDel=p=>fbReq(p,'DELETE'),fbGet=p=>fbReq(p);
function fbStream(path,onChange){
  const st={tree:undefined,es:null,closed:false,backoff:800};
  function setPath(p,d,merge){
    const parts=p.split('/').filter(Boolean);
    if(!parts.length){if(merge&&st.tree&&d){Object.assign(st.tree,d);}else st.tree=d;return;}
    if(st.tree===undefined||st.tree===null)st.tree={};
    let n=st.tree;
    for(let i=0;i<parts.length-1;i++){if(typeof n[parts[i]]!=='object'||n[parts[i]]===null)n[parts[i]]={};n=n[parts[i]];}
    const k=parts[parts.length-1];
    if(merge&&d&&typeof d==='object'&&typeof n[k]==='object'&&n[k])Object.assign(n[k],d);
    else if(d===null)delete n[k];else n[k]=d;
  }
  async function open(){
    if(st.closed)return;
    try{
      const t=await fbAuth();
      st.es=new EventSource(FB.dbURL+'/'+path+'.json?auth='+t);
      st.es.addEventListener('put',e=>{const m=JSON.parse(e.data);setPath(m.path,m.data,false);onChange(st.tree);});
      st.es.addEventListener('patch',e=>{const m=JSON.parse(e.data);setPath(m.path,m.data,true);onChange(st.tree);});
      st.es.addEventListener('cancel',()=>{try{st.es.close();}catch(e){}retry();});
      st.es.addEventListener('auth_revoked',()=>{fbA.exp=0;try{st.es.close();}catch(e){}retry();});
      st.es.onerror=()=>{if(st.es&&st.es.readyState===EventSource.CLOSED)retry();};
      st.es.onopen=()=>{st.backoff=800;};
    }catch(e){retry();}
  }
  function retry(){if(st.closed)return;setTimeout(open,st.backoff);st.backoff=Math.min(st.backoff*2,15000);}
  open();
  return {close(){st.closed=true;try{st.es&&st.es.close();}catch(e){}},get tree(){return st.tree;}};
}

/* ---- peers ---- */
function mkPeer(uid,info,initiator){
  const peer={uid,info:info||{},pc:null,game:null,pos:null,mode:'connecting',ready:false,
    lastSeq:0,lastSeen:Date.now(),p:null,fallbackT:null};
  if(FB.noRTC){peer.mode='relay';return peer;}
  const pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});
  peer.pc=pc;
  function wire(ch){
    ch.onopen=()=>{
      if(peer.game&&peer.game.readyState==='open'&&peer.pos&&peer.pos.readyState==='open'){
        peer.mode='p2p';
        if(MP&&MP.role==='host'&&!peer.ready)mpPeerReady(peer);
      }};
    ch.onmessage=e=>{try{mpRecv(peer,JSON.parse(e.data));}catch(err){}};
    ch.onclose=()=>{if(peer.mode==='p2p')peer.mode='relay';};
  }
  if(initiator){
    peer.game=pc.createDataChannel('game');
    peer.pos=pc.createDataChannel('pos',{ordered:false,maxRetransmits:0});
    wire(peer.game);wire(peer.pos);
    pc.onnegotiationneeded=async()=>{
      try{const o=await pc.createOffer();await pc.setLocalDescription(o);
        mpSigSend(uid,{sdp:pc.localDescription});}catch(e){}};
  }else{
    pc.ondatachannel=e=>{
      if(e.channel.label==='game')peer.game=e.channel;else peer.pos=e.channel;
      wire(e.channel);};
  }
  pc.onicecandidate=e=>{if(e.candidate)mpSigSend(uid,{ice:e.candidate.toJSON()});};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'&&peer.mode==='p2p')peer.mode='relay';};
  peer.fallbackT=setTimeout(()=>{
    if(peer.mode==='connecting'){peer.mode='relay';
      if(MP&&MP.role==='host'&&!peer.ready)mpPeerReady(peer);}},9000);
  return peer;
}
function mpSigSend(to,msg){if(MP)fbPush('rooms/'+MP.code+'/sig/'+to+'/'+fbA.uid,msg).catch(()=>{});}
async function mpOnSig(from,msg){
  const peer=MP.role==='host'?MP.peers.get(from):MP.peer;
  if(!peer||!peer.pc)return;
  try{
    if(msg.sdp){
      await peer.pc.setRemoteDescription(msg.sdp);
      if(msg.sdp.type==='offer'){
        const a=await peer.pc.createAnswer();
        await peer.pc.setLocalDescription(a);
        mpSigSend(from,{sdp:peer.pc.localDescription});
      }
    }else if(msg.ice)await peer.pc.addIceCandidate(msg.ice);
  }catch(e){}
}

function mpSendTo(peer,arr,unreliable){
  const ch=unreliable?peer.pos:peer.game;
  if(peer.mode==='p2p'&&ch&&ch.readyState==='open'){
    try{ch.send(JSON.stringify(arr));return;}catch(e){peer.mode='relay';}
  }
}
function mpBroadcast(arr){
  if(!MP||MP.role!=='host')return;
  for(const peer of MP.peers.values())if(peer.ready)mpSendTo(peer,arr,false);
  if([...MP.peers.values()].some(p=>p.ready&&p.mode!=='p2p')){
    MP.relayEv.push([++MP.relaySeq,arr]);
    if(MP.relayEv.length>50)MP.relayEv.splice(0,MP.relayEv.length-50);
  }
}
function mpSend(arr){ /* guest -> host */
  if(!MP||MP.role!=='guest'||!MP.peer)return;
  if(MP.peer.mode==='p2p'){mpSendTo(MP.peer,arr,false);return;}
  MP.outEv.push([++MP.outSeq,arr]);
  if(MP.outEv.length>50)MP.outEv.splice(0,MP.outEv.length-50);
}

    else if(tag==='reqE')edit(m[1],m[2],m[3],m[4]);
    else if(tag==='em'){mpRemoteEmote(peer.uid,m[2]);mpBroadcast(['em',peer.uid,m[2]]);}
    else if(tag==='fit'){peer.info.hat=m[2];peer.info.neck=m[3];
      const r=REMOTES.get(peer.uid);if(r)r.outfit={hat:m[2],neck:m[3]};

    else if(tag==='fit'){if(m[1]!==fbA.uid){
      if(MP.playersInfo[m[1]])Object.assign(MP.playersInfo[m[1]],{hat:m[2],neck:m[3]});
      if(m[1]===MP.hostUid&&MP.hostInfo)Object.assign(MP.hostInfo,{hat:m[2],neck:m[3]});

    else if(tag==='plotOk'){MP_APPLYING=true;plotStamp(m[1],m[2],m[3]);MP_APPLYING=false;}
    else if(tag==='plotDel'){MP_APPLYING=true;revertPlacement(m[1]);MP_APPLYING=false;}
    else if(tag==='build'){MP.allowBuild=!!m[1];toast(MP.allowBuild?'The host turned ON friend building!':'Friend building is off right now.');}
    else if(tag==='pj'){if(m[1]!==fbA.uid){MP.playersInfo[m[1]]={name:m[2],critter:m[3],hat:m[4],neck:m[5]};toast(m[2]+' hopped in!');sPick();}}
    else if(tag==='drop'){mpRemoteGone(m[1]);delete MP.playersInfo[m[1]];}
    else if(tag==='kick')mpLeave('The host ended your visit.');

function mpHostRoom(tree){
  if(!MP||MP.role!=='host'||!tree)return;

  for(const uid in ks){
    if(uid===fbA.uid||MP.peers.has(uid)||MP.blocked.has(uid))continue;
    if(MP.knockCur===uid||MP.knockQ.some(k=>k.uid===uid))continue;
    const k=ks[uid]||{};
    MP.knockQ.push({uid,name:String(k.name||'A critter').slice(0,20),critter:SPECIES[k.critter]?k.critter:'frog',
      hat:String(k.hat||'none'),neck:String(k.neck||'none')});

    else mpMaybeShowKnock();

  const sig=(tree.sig||{})[fbA.uid]||{};

    const id=from+'/'+key;

  }
  const rel=tree.relay||{};
  for(const uid in rel){

    const n=rel[uid];

  }

function mpJoinPrompt(){
  openModal('<h2>Join a friend’s pond</h2><p>Type the pond code from your friend’s screen:</p>'+
    '<input id="codein" autocomplete="off" autocapitalize="characters" placeholder="LILY-OTTER-1234">',
    [['Hop in!','',()=>{
        const code=($('#codein').value||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
        if(code.length<8){toast('That code looks too short');return;}
        openModal('<h2>Looking for that pond…</h2><p>'+code+'</p><p class="dim">one moment!</p>',[]);
        mpTryJoin(code);
      }],
     ['Cancel','gray',closeModal]]);
  setTimeout(()=>{try{$('#codein').focus();}catch(e){}},100);
}
async function mpTryJoin(code){
  try{
    const slow=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Could not reach the pond server — check the internet connection and try again.')),12000));
    await Promise.race([fbAuth(),slow]);
    const room=await Promise.race([fbGet('rooms/'+code),slow]);
    if(!room||!room.host)throw new Error('No pond found with that code — check it letter by letter!');
    if(Date.now()-(room.host.t||0)>120000)throw new Error('That pond isn’t open right now — ask your friend to host again.');
    if(room.locked)throw new Error('That pond is locked. Ask the host to unlock it!');
    sessionStorage.setItem('mpjoin',JSON.stringify({code}));
    save();location.reload();
  }catch(e){mpFbError(e);}
}
async function mpJoinBoot(code){
  await fbAuth();
  MP={role:'guest',code,peer:null,hostUid:null,hostInfo:null,playersInfo:{},sigSeen:new Set(),
      approved:false,initDone:false,pending:[],allowBuild:false,lastHostSeq:0,relT:0,
      outSeq:0,outEv:[],lastPosSend:0,lastRelaySend:0,lastHostMsg:Date.now(),knockT:Date.now(),stream:null};
  await fbSet('rooms/'+code+'/knocks/'+fbA.uid,{name:mpMyName(),critter:SV.critter,
    hat:SV.outfit.hat,neck:SV.outfit.neck,t:Date.now()});
  try{$('#loading .t').textContent='Knock knock! Waiting for the host to let you in…';}catch(e){}
  MP.stream=fbStream('rooms/'+code,t=>mpGuestRoom(t));
  await new Promise((res,rej)=>{
    MP.joinRes=res;MP.joinRej=rej;
    MP.joinT=setTimeout(()=>rej(new Error('No answer — ask the host to let you in, then try again!')),90000);
  });
  mpUIStart();
  toast('You hopped into '+(MP.hostInfo?MP.hostInfo.name+'’s':'the')+' pond!');
}
function mpGuestRoom(tree){
  if(!MP||MP.role!=='guest')return;
  if(tree===null||tree===undefined){
    if(tree===null){
      if(MP.initDone)mpLeave('The host closed the pond.');
      else if(MP.joinRej)MP.joinRej(new Error('That pond just closed.'));
    }
    return;
  }
  if(tree.host&&!MP.hostInfo){
    MP.hostUid=tree.host.uid;
    MP.hostInfo={name:tree.host.name||'Host',critter:SPECIES[tree.host.critter]?tree.host.critter:'frog',
      hat:tree.host.hat||'none',neck:tree.host.neck||'none'};
  }
  const me=(tree.players||{})[fbA.uid];
  if(!MP.approved){
    if(me&&me.ok){
      MP.approved=true;
      MP.peer=mkPeer(MP.hostUid,MP.hostInfo,false);
    }else if(!((tree.knocks||{})[fbA.uid])&&!me&&Date.now()-MP.knockT>4000){
      if(MP.joinRej)MP.joinRej(new Error('The host didn’t let you in this time.'));
      return;
    }
  }
  const sig=(tree.sig||{})[fbA.uid]||{};
  for(const from in sig)for(const key in sig[from]){
    const id=from+'/'+key;
    if(!MP.sigSeen.has(id)){MP.sigSeen.add(id);mpOnSig(from,sig[from][key]);}
  }
  if(me&&me.init&&!MP.initDone)mpApplyInit(me.init);
  if(MP.initDone&&!me){mpLeave('The host ended your visit.');return;}
  if(MP.initDone&&MP.peer&&MP.peer.mode!=='p2p'){
    const rn=(tree.relay||{})[MP.hostUid];
    if(rn&&rn.t!==MP.relT){
      MP.relT=rn.t;MP.lastHostMsg=Date.now();
      if(rn.pos)mpOnMsg(MP.peer,['pos',rn.pos]);
      for(const ev of (rn.e||[]))if(ev[0]>MP.lastHostSeq){MP.lastHostSeq=ev[0];mpOnMsg(MP.peer,ev[1]);}
    }
  }
}
function mpApplyInit(init){
  const s0=SV.sound;SV.sound=false;
  MP_APPLYING=true;
  try{
    for(const p of (init.plot||[]))plotStamp(p[0],p[1],p[2]);
    for(const e of (init.edits||[]))edit(e[0],e[1],e[2],e[3]);
  }finally{MP_APPLYING=false;SV.sound=s0;}
  for(const pl of (init.players||[]))if(pl[0]!==fbA.uid)MP.playersInfo[pl[0]]={name:pl[1],critter:pl[2],hat:pl[3],neck:pl[4]};
  MP.allowBuild=!!init.build;
  if(typeof init.tod==='number'){
    const d=new Date();
    MP.todOff=init.tod-(d.getHours()+d.getMinutes()/60);
  }
  MP.initDone=true;
  const pend=MP.pending;MP.pending=[];
  for(const m of pend)mpOnMsg(MP.peer,m);
  clearTimeout(MP.joinT);
  if(MP.joinRes)MP.joinRes();
}
function mpLeave(msg){
  mpCleanup();
  openModal('<h2>Visit over</h2><p>'+msg+'</p>',[['Back to my pond','',()=>{save();location.reload();}]]);
}
function mpCleanup(){
  if(!MP)return;
  try{MP.stream&&MP.stream.close();}catch(e){}
  if(MP.hb)clearInterval(MP.hb);
  if(MP.peers)for(const p of MP.peers.values()){try{p.pc&&p.pc.close();}catch(e){}}
  if(MP.peer){try{MP.peer.pc&&MP.peer.pc.close();}catch(e){}}
  for(const uid of [...REMOTES.keys()])mpRemoteGone(uid);
  MP=null;OWN_EMOTE=null;
  $('#chipMP').style.display='none';
  $('#wrapSay').style.display='none';
  $('#emotebar').style.display='none';
}
addEventListener('pagehide',()=>{
  if(!MP||!fbA.tok)return;
  try{
    if(MP.role==='guest')mpSend(['bye']);
    const p=MP.role==='host'?'rooms/'+MP.code:'rooms/'+MP.code+'/knocks/'+fbA.uid;
    fetch(FB.dbURL+'/'+p+'.json?auth='+fbA.tok,{method:'DELETE',keepalive:true});
  }catch(e){}
});

/* ---- remote critters, tags, emotes ---- */
function mpTag(uid){
  let el=document.getElementById('tag-'+uid);
  if(!el){el=document.createElement('div');el.id='tag-'+uid;el.className='tag';$('#tags').appendChild(el);}
  return el;
}
function mpRemoteSet(uid,info,p){
  if(!p)return;
  let r=REMOTES.get(uid);
  if(!r){
    r={uid,sp:(info&&SPECIES[info.critter])?info.critter:'frog',name:(info&&info.name)||'Pal',
       outfit:{hat:(info&&info.hat)||'none',neck:(info&&info.neck)||'none'},
       x:p[0],y:p[1],z:p[2],yaw:p[3]||0,tx:p[0],ty:p[1],tz:p[2],tyaw:p[3]||0,
       moving:false,ph:Math.random()*7,emote:null,emoteT:0};
    REMOTES.set(uid,r);
  }
  r.tx=p[0];r.ty=p[1];r.tz=p[2];r.tyaw=p[3]||0;r.moving=!!p[4];
}
function mpRemoteGone(uid){
  REMOTES.delete(uid);
  const el=document.getElementById('tag-'+uid);
  if(el)el.remove();
}
function mpRemoteEmote(uid,i){
  const r=REMOTES.get(uid);
  if(r){r.emote=MP_EMOTES[i]||'...';r.emoteT=performance.now()+3000;sTalk();}
}
function mpEmoteBar(){
  if(!MP)return;
  const bar=$('#emotebar');
  if(bar.style.display==='flex'){bar.style.display='none';return;}
  if(!bar.children.length){
    MP_EMOTES.forEach((e,i)=>{
      const b=document.createElement('button');b.className='emo';b.textContent=e;
      b.onclick=()=>{mpEmote(i);bar.style.display='none';};
      bar.appendChild(b);});
  }
  bar.style.display='flex';
}
function mpSendFit(){
  if(!MP)return;
  if(MP.role==='host')mpBroadcast(['fit',fbA.uid,SV.outfit.hat,SV.outfit.neck]);
  else mpSend(['fit',fbA.uid,SV.outfit.hat,SV.outfit.neck]);
}
function mpEmote(i){
  OWN_EMOTE={txt:MP_EMOTES[i],until:performance.now()+3000};
  sTalk();
  if(MP.role==='host'){mpBroadcast(['em',fbA.uid,i]);}
  else mpSend(['em',fbA.uid,i]);
}

/* ---- per-frame sync ---- */
function projectPt(pv,x,y,z){
  const w=pv[3]*x+pv[7]*y+pv[11]*z+pv[15];
  if(w<0.2)return null;
  return [((pv[0]*x+pv[4]*y+pv[8]*z+pv[12])/w*0.5+0.5)*innerWidth,
          (1-((pv[1]*x+pv[5]*y+pv[9]*z+pv[13])/w*0.5+0.5))*innerHeight];
}
function mpTick(dt,t,pv){
  const now=performance.now();
  for(const r of REMOTES.values()){
    const k=Math.min(1,10*dt);
    r.x=lerp(r.x,r.tx,k);r.y=lerp(r.y,r.ty,k);r.z=lerp(r.z,r.tz,k);
    let dy=r.tyaw-r.yaw;while(dy>Math.PI)dy-=2*Math.PI;while(dy<-Math.PI)dy+=2*Math.PI;
    r.yaw+=dy*k;
    const el=mpTag(r.uid);
    const sp2=projectPt(pv,r.x,r.y+1.95,r.z);
    const d=Math.hypot(r.x-P.x,r.z-P.z);
    if(sp2&&d<50){
      el.style.display='block';el.style.left=sp2[0]+'px';el.style.top=sp2[1]+'px';
      const em=r.emoteT>now?r.emote:null;
      el.textContent=em||r.name;
      el.classList.toggle('em',!!em);
    }else el.style.display='none';
  }
  let selfTag=document.getElementById('tag-self');
  if(OWN_EMOTE&&OWN_EMOTE.until>now){
    if(!selfTag){selfTag=document.createElement('div');selfTag.id='tag-self';selfTag.className='tag em';$('#tags').appendChild(selfTag);}
    const sp2=projectPt(pv,P.x,P.y+1.95,P.z);
    if(sp2){selfTag.style.display='block';selfTag.style.left=sp2[0]+'px';selfTag.style.top=sp2[1]+'px';selfTag.textContent=OWN_EMOTE.txt;}
  }else if(selfTag)selfTag.style.display='none';

  if(MP.role==='host'){
    MP.lastPosSend+=dt;
    if(MP.lastPosSend>0.09){
      MP.lastPosSend=0;
      const pos={};pos[fbA.uid]=[+P.x.toFixed(2),+P.y.toFixed(2),+P.z.toFixed(2),+P.yaw.toFixed(2),P.moving?1:0];
      for(const p of MP.peers.values())if(p.ready&&p.p)pos[p.uid]=p.p;
      for(const p of MP.peers.values())if(p.ready)mpSendTo(p,['pos',pos],true);
      MP._pos=pos;
    }
    MP.lastRelaySend+=dt;
    if(MP.lastRelaySend>0.22){
      MP.lastRelaySend=0;
      if([...MP.peers.values()].some(p=>p.ready&&p.mode!=='p2p')&&MP._pos)
        fbSet('rooms/'+MP.code+'/relay/'+fbA.uid,{t:Date.now(),pos:MP._pos,e:MP.relayEv.slice(-40)}).catch(()=>{});
    }
    for(const p of [...MP.peers.values()])
      if(p.ready&&p.mode!=='p2p'&&Date.now()-p.lastSeen>20000)mpDrop(p.uid);
  }else if(MP.initDone&&MP.peer){
    MP.lastPosSend+=dt;
    if(MP.lastPosSend>0.09&&MP.peer.mode==='p2p'){
      MP.lastPosSend=0;
      mpSendTo(MP.peer,['p',+P.x.toFixed(2),+P.y.toFixed(2),+P.z.toFixed(2),+P.yaw.toFixed(2),P.moving?1:0],true);
    }
    MP.lastRelaySend+=dt;
    if(MP.lastRelaySend>0.22&&MP.peer.mode!=='p2p'){
      MP.lastRelaySend=0;
      fbSet('rooms/'+MP.code+'/relay/'+fbA.uid,
        {t:Date.now(),p:[+P.x.toFixed(2),+P.y.toFixed(2),+P.z.toFixed(2),+P.yaw.toFixed(2),P.moving?1:0],
         e:MP.outEv.slice(-40)}).catch(()=>{});
    }
    if(Date.now()-MP.lastHostMsg>30000)mpLeave('Lost the connection to the host’s pond.');
  }
}

/* ========== 14. Phase 3: moving platforms, Obby Tower, pet, maker gadgets ========== */
const MOVERS=[]; /* {x,y,z,ax,ay,az,per,ph,sx,sz,col,plot} */
let RENDT=0,RENDDT=0.016;
function moverPos(m,tN){const w=Math.sin((tN/m.per+m.ph)*6.2832);
  return[m.x+m.ax*w,m.y+m.ay*w,m.z+m.az*w];}
function moverCarry(e){
  for(const m of MOVERS){
    const p=moverPos(m,RENDT);
    if(Math.abs(e.x-p[0])<=m.sx/2+e.hw&&Math.abs(e.z-p[2])<=m.sz/2+e.hw){
      const top=p[1]+0.25;
      if(e.vy<=0&&e.y>=top-0.6&&e.y<=top+0.4){
        const q=moverPos(m,RENDT-RENDDT);
        e.x+=p[0]-q[0];e.z+=p[2]-q[2];
        e.y=top;e.vy=0;e.onGround=true;
      }
    }
  }
}
/* bouncy shrooms + teleporter pads (checked when landing/standing) */
let TELE_PAIRS=[],TELE_CD=0;
function gadgetCheck(e){
  if(e!==P)return;
  const bx=Math.floor(e.x),bz=Math.floor(e.z),by=Math.floor(e.y-0.4);
  const b=gb(bx,by,bz);
  if(e.onGround&&b===B.bounce){
    e.vy=13.5;e.onGround=false;
    blip(300,.08,'square',.2);setTimeout(()=>blip(620,.12,'square',.18),60);
    burst(e.x,e.y+0.2,e.z,8,'#ff9cbd',1.8,1.5,4,0.09);
  }
  if(e.onGround&&b===B.tele&&performance.now()>TELE_CD){
    for(const pr of TELE_PAIRS){
      let dest=null;
      if(Math.abs(pr.a[0]-bx)<1&&Math.abs(pr.a[1]-bz)<1)dest=pr.b;
      else if(Math.abs(pr.b[0]-bx)<1&&Math.abs(pr.b[1]-bz)<1)dest=pr.a;
      if(dest){
        TELE_CD=performance.now()+1600;
        burst(e.x,e.y+0.8,e.z,12,'#c9a8ff',2,2,5,0.1);
        teleport([dest[0]+0.5,walkGroundY(dest[0]+0.5,dest[1]+0.5)+0.2,dest[1]+0.5]);
        burst(P.x,P.y+0.8,P.z,12,'#c9a8ff',2,2,5,0.1);
        blip(500,.06,'sine',.18);blip(900,.09,'sine',.16);
        break;
      }
    }
  }
}

/* ---- Obby Tower (4th arcade game) ---- */
const OBBY={x:84,z:68,g:0,cps:[],flag:null}; /* clear meadow between city and Maker Isle */
const OBBY_PLATS=[
 [0,0,0,3],[4,0,2,1],[7,3,4,1],[7,7,6,1],[4,9,8,1],
 [0,7,10,1,'cp'],[-4,9,12,1],[-7,6,14,1],[-7,2,16,1],
 [-4,-1,18,1,'cp'],[0,-4,20,1],[4,-4,22,1],[7,-1,24,2]];
function buildObby(){
  const g=Math.max(walkGroundY(OBBY.x,OBBY.z),WL+2);
  OBBY.g=g;
  clearAbove(OBBY.x-12,OBBY.z-10,OBBY.x+12,OBBY.z+15,g);
  floorPad(OBBY.x-4,OBBY.z-4,OBBY.x+4,OBBY.z+4,g,B.path);
  for(let y=g;y<g+24;y++)sb(OBBY.x,y,OBBY.z,B.wood); /* center mast */
  OBBY.cps=[[OBBY.x+0.5,g,OBBY.z+0.5]];
  for(const p of OBBY_PLATS){
    const px2=OBBY.x+p[0],pz=OBBY.z+p[1],py=g+p[2],r=p[3];
    if(p[2]>0)fillB(px2-r,py,pz-r,px2+r,py,pz+r,B.plank);
    if(p[4]==='cp'){
      sb(px2,py+1,pz,B.lantern);
      OBBY.cps.push([px2+0.5,py+1,pz+0.5]);
    }
  }
  const top=OBBY_PLATS[OBBY_PLATS.length-1];
  OBBY.flag=[OBBY.x+top[0]+0.5,g+top[2]+1,OBBY.z+top[1]+0.5];
  sb(OBBY.x+top[0],g+top[2]+1,OBBY.z+top[1],B.flag);
  sb(OBBY.x+top[0]+1,g+top[2]+1,OBBY.z+top[1]+1,B.lantern);
  /* moving platforms bridge the tricky gaps */
  MOVERS.push(
    {x:OBBY.x+2,y:g+1.2,z:OBBY.z+0.5,ax:2.2,ay:0,az:0,per:3.6,ph:0,sx:2,sz:2,col:'#8a52e6'},
    {x:OBBY.x+5.5,y:g+5,z:OBBY.z+5,ax:0,ay:0,az:2.2,per:4.2,ph:0.3,sx:2,sz:2,col:'#43cea2'},
    {x:OBBY.x-2,y:g+11,z:OBBY.z+8,ax:2.4,ay:0,az:0,per:4,ph:0.6,sx:2,sz:2,col:'#8a52e6'},
    {x:OBBY.x-5.5,y:g+15,z:OBBY.z+0,ax:0,ay:0,az:2.4,per:4.4,ph:0.1,sx:2,sz:2,col:'#43cea2'},
    {x:OBBY.x-2,y:g+19,z:OBBY.z-2.5,ax:0,ay:1.6,az:0,per:3.4,ph:0.5,sx:2,sz:2,col:'#ffb02e'},
    {x:OBBY.x+2,y:g+21,z:OBBY.z-4,ax:2,ay:0,az:0,per:3.8,ph:0.8,sx:2,sz:2,col:'#8a52e6'});
}

let PET=null,EGG=null;
const PET_NAMES=['Dot','Bubbles','Jelly','Pip','Squirm','Momo'];
function initPet(){
  if(SV.pet&&SV.pet.stage>=1)
    PET={x:P.x-1,y:P.y,z:P.z-1,yaw:0,ph:Math.random()*7};
}
function bugBagTotal(){let n=0;for(const k in SV.bugBag)n+=SV.bugBag[k];return n;}
function petTick(dt,t){
  if(!PET||!SV.pet)return;
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  const tx=P.x-fx*1.5+fz*0.5,tz=P.z-fz*1.5-fx*0.5;
  const d=Math.hypot(tx-PET.x,tz-PET.z);
  if(d>18){PET.x=tx;PET.z=tz;}
  else if(d>0.4){
    const k=Math.min(1,(SV.pet.stage>=2?4.5:3.2)*dt/Math.max(d,0.001)*d);
    PET.x=lerp(PET.x,tx,Math.min(1,3.4*dt));
    PET.z=lerp(PET.z,tz,Math.min(1,3.4*dt));
    PET.yaw=Math.atan2(P.x-PET.x,P.z-PET.z);
  }
  const gy=walkGroundY(PET.x,PET.z);
  PET.y=lerp(PET.y||gy,gy+(SV.pet.stage>=2?0:0.12),Math.min(1,8*dt));
}
function drawPet(t){
  if(!PET||!SV.pet)return;
  const b=mMul(mT(PET.x,PET.y,PET.z),mRY(PET.yaw));
  const part=(tm,sx,sy,sz,col)=>drawBox(mMul(b,mMul(tm,mS(sx,sy,sz))),col);
  const wig=Math.sin(t*8+PET.ph)*0.35;
  if(SV.pet.stage===1){
    part(mT(0,0.22,0),0.3,0.24,0.3,'#5a7a34');
    part(mMul(mT(Math.sin(wig)*0.14,0.2,-0.28),mRY(wig)),0.1,0.14,0.26,'#4a6a2a');
    part(mT(0.07,0.32,0.12),0.06,0.06,0.02,'#16242e');
    part(mT(-0.07,0.32,0.12),0.06,0.06,0.02,'#16242e');
  }else{
    const hop=Math.abs(Math.sin(t*6+PET.ph))*0.1;
    part(mT(0,0.24+hop,0),0.34,0.26,0.3,'#74cb43');
    part(mT(0,0.46+hop,0.02),0.3,0.22,0.26,'#74cb43');
    part(mT(0.08,0.52+hop,0.14),0.08,0.08,0.03,'#fff');
    part(mT(-0.08,0.52+hop,0.14),0.08,0.08,0.03,'#fff');
    part(mT(0.08,0.52+hop,0.16),0.04,0.04,0.02,'#16242e');
    part(mT(-0.08,0.52+hop,0.16),0.04,0.04,0.02,'#16242e');
    part(mT(0.12,0.08+hop,0),0.1,0.16,0.12,'#4f9e23');
    part(mT(-0.12,0.08+hop,0),0.1,0.16,0.12,'#4f9e23');
  }
}

/* ---- fishing ---- */
let FISHING=null;
function castTargetWater(){
  const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw);
  for(let d=2.2;d<=6.5;d+=0.8){
    const X=Math.floor(P.x+fx*d),Z=Math.floor(P.z+fz*d);
    if(gb(X,WL,Z)===B.water)return [P.x+fx*d,WL+0.92,P.z+fz*d];
  }
  return null;
}
function pickFish(){
  const night=NIGHTA>0.35,cove=Math.hypot(P.x-COVE.x,P.z-COVE.z)<26;
  const pool=FISH_DEFS.map(f=>({f,w:f.w*(f.night?(night?3:0.12):1)*(f.cove?(cove?3:0.15):1)}));
  const tot=pool.reduce((a,p)=>a+p.w,0);
  let r=Math.random()*tot;
  for(const p of pool){r-=p.w;if(r<=0)return p.f;}
  return FISH_DEFS[0];
}
function fishPress(){
  if(!SV.tools.rod)return;
  if(FISHING){
    if(FISHING.state==='bite'){
      const f=pickFish();
      SV.fish[f.id]=(SV.fish[f.id]||0)+1;
      SV.fishBag[f.id]=(SV.fishBag[f.id]||0)+1;
      save();
      burst(FISHING.x,FISHING.y+0.3,FISHING.z,12,'#cfeeff',2.2,2.6,8,0.1);
      FISHING=null;
      sWin();
      popLabel('+1 '+f.name,FISHICON[f.id]);
      toast(f.rare?'A GOLDEN KOI! Marina won’t believe this!':'Caught a '+f.name+'!');
    }else{FISHING=null;toast('Reeled in too soon — wait for the splash!');sBad();}
    return;
  }
  const t=castTargetWater();
  if(!t){toast('Face the water to cast!');return;}
  FISHING={state:'wait',x:t[0],y:t[1],z:t[2],tBite:performance.now()+1500+Math.random()*3500};
  sHop();
  burst(t[0],t[1],t[2],5,'#cfeeff',1.1,1.1,6,0.06);
}
function fishTick(){
  if(!FISHING)return;
  if(Math.hypot(P.x-FISHING.x,P.z-FISHING.z)>9||P.inWater){FISHING=null;return;}
  const now=performance.now();
  if(FISHING.state==='wait'&&now>=FISHING.tBite){
    FISHING.state='bite';FISHING.tEnd=now+1000;
    blip(880,.1,'square',.22);
    burst(FISHING.x,FISHING.y,FISHING.z,9,'#cfeeff',1.9,1.7,8,0.09);
  }else if(FISHING.state==='bite'&&now>FISHING.tEnd){
    FISHING=null;toast('It got away!');sBad();
  }
}
function fishBagTotal(){let n=0,v=0;
  for(const f of FISH_DEFS){const c=SV.fishBag[f.id]||0;n+=c;v+=c*f.val;}
  return {n,v};}

/* ---- bug catching ---- */
const BUGS=[];
let bugT=0;
function bugTick(dt){
  bugT-=dt;
  for(let i=BUGS.length-1;i>=0;i--){
    const b=BUGS[i];
    b.t+=dt;b.a+=dt*(1.5+b.sp);
    b.x+=Math.sin(b.a*1.9)*dt*1.4;
    b.z+=Math.cos(b.a*1.4)*dt*1.4;
    b.y=b.baseY+Math.sin(b.a*2.3)*0.5;
    if(b.t>b.life){BUGS.splice(i,1);continue;}
    if(Math.hypot(b.x-P.x,b.y-(P.y+1),b.z-P.z)<1.2){
      SV.bugs[b.def.id]=(SV.bugs[b.def.id]||0)+1;
      SV.bugBag[b.def.id]=(SV.bugBag[b.def.id]||0)+1;save();
      sPick();popLabel('+1 '+b.def.name,BUGICON[b.def.id]);
      BUGS.splice(i,1);
    }
  }
  if(bugT>0||BUGS.length>=4)return;
  bugT=1.4;
  const night=NIGHTA>0.35;
  const bio=bioMap[Math.floor(P.z)*W+Math.floor(P.x)];
  const nearWaterHere=gb(Math.floor(P.x)+3,WL,Math.floor(P.z))===B.water||gb(Math.floor(P.x)-3,WL,Math.floor(P.z))===B.water
    ||gb(Math.floor(P.x),WL,Math.floor(P.z)+3)===B.water||gb(Math.floor(P.x),WL,Math.floor(P.z)-3)===B.water;
  const pool=BUG_DEFS.filter(b=>
    (b.night?night:(b.day?!night:true))&&
    (b.water?nearWaterHere:(b.biome?b.biome.indexOf(bio)>=0:true)));
  if(!pool.length||Math.random()<0.5)return;
  const def=pool[Math.floor(Math.random()*pool.length)];
  const a=Math.random()*6.2832,r=4+Math.random()*6;
  const bx=P.x+Math.sin(a)*r,bz=P.z+Math.cos(a)*r;
  BUGS.push({def,x:bx,z:bz,baseY:walkGroundY(bx,bz)+1+Math.random()*1.2,y:0,
    a:Math.random()*7,sp:Math.random(),t:0,life:22+Math.random()*15});
}
function drawBug(b,t){
  const flap=0.5+Math.abs(Math.sin(t*16+b.a))*0.6;
  drawBox(mMul(mT(b.x,b.y,b.z),mS(0.08,0.16,0.08)),'#3a2f2a');
  drawBox(mMul(mT(b.x-0.1*flap,b.y+0.04,b.z),mS(0.16*flap,0.04,0.13)),b.def.c1);
  drawBox(mMul(mT(b.x+0.1*flap,b.y+0.04,b.z),mS(0.16*flap,0.04,0.13)),b.def.c1);
}

  if(id==='p1')return NIGHTA>0.35&&PARTS.some(p=>p.col==='#d8ff6e'&&Math.hypot(p.x-P.x,p.z-P.z)<9);
  if(id==='p2'){const F=MINI.hop.fin;return h>=16.5&&h<=20.5&&Math.hypot(P.x-F[0],P.z-F[2])<4.5;}
  if(id==='p3')return P.inWater&&Math.hypot(P.x-BAY.x,P.z-BAY.z)<26;
  return false;
}
function doSnap(){
  const f=$('#qflash');f.animate([{opacity:0},{opacity:.9},{opacity:0}],{duration:260});
  blip(900,.05,'square',.2);
  let hit=false;
  for(const id of ['p1','p2','p3']){
    if(q2get(id)!==1)continue;
    const q=QDEFS.find(x=>x.id===id);
    if(photoCheck(id)){
      hit=true;SV.q2[id]=2;addCoins(q.coins);save();updateHUD();
      sWin();toast('Perfect shot! Show '+(NPCS.find(n=>n.id===q.giver)||{name:'them'}).name+' any time.');
    }
  }
  if(!hit){
    const act=['p1','p2','p3'].find(id=>q2get(id)===1);
    if(act)toast(QDEFS.find(x=>x.id===act).fail);
  }
}

const DAILY_ORDERS=[
 {items:{berry:3,flower:2},coins:12},
 {items:{shell:2,pebble:3},coins:12},
 {items:{mushroom:2,stick:3},coins:12},
 {items:{reed:4,flower:2},coins:12},
